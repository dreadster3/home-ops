name: Gitleaks

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  scan:
    name: Scan for Leaks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - name: Generate gitleaks config
        run: |
          cat > .gitleaks.toml << EOF
          [extend]
          useDefault = true

          [[rules]]
          id = "personal-domain"
          description = "Personal domain leaked"
          regex = '''${{ secrets.PERSONAL_DOMAIN }}'''
          EOF

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
