keys:
  - &primary age1usemhw8v2nnr5nuxddrc7gsy3525hhv0na4hk2ur7tjara5cp90s7cpeen
  - &pangolin age12eqkqgn8vpp4lt0xutx7mz0typuj4n0lffx77752rrp9t4af758qhmr65n

creation_rules:
  - path_regex: ^docker/mgmt/home-assistant/config/integrations/openid.yaml$
    encrypted_regex: ^(client_id|client_secret|configure_url)$
    key_groups:
      - age:
          - *primary
  - path_regex: ^.+\.sops\.ya?ml$
    encrypted_regex: ^(data|stringData|crt|key|token|secretboxencryptionsecret|bootstraptoken|secret|id)$
    key_groups:
      - age:
          - *primary
  - path_regex: ^.*\.env$
    key_groups:
      - age:
          - *primary
  # pangolin
  - path_regex: ^docker/pangolin01/pangolin/config/crowdsec/postoverflows/s01-whitelist/01-home-whitelist.ya?ml$
    encrypted_regex: ^(expression)$
    key_groups:
      - age:
          - *pangolin
  - path_regex: ^docker/pangolin01/pangolin/config/traefik/traefik-dynamic.ya?ml$
    encrypted_regex: ^(rule|allowedIPAddresses)$
    key_groups:
      - age:
          - *pangolin
  - path_regex: ^docker/pangolin01/pangolin/config/pangolin/config.yml$
    encrypted_regex: ^(dashboard_url|base_endpoint|configure_url|base_domain|origins|no_reply)$
    key_groups:
      - age:
          - *pangolin
  - path_regex: ^docker/pangolin01.*
    key_groups:
      - age:
          - *pangolin
