apiVersion: ceph.rook.io/v1
kind: CephCluster
metadata:
  name: rook-ceph
spec:
  external:
    enable: true
  crashCollector:
    disable: true
  cephVersion:
    allowUnsupported: false
    image: quay.io/ceph/ceph:v21.2.0@sha256:c9e6ed4ac3fcf67b28f38358bb9619dee4d1dfb96ddd4b9b583eee316a15f04d
  healthCheck:
    daemonHealth:
      mon:
        disabled: false
        interval: 45s
  monitoring:
    enabled: true
    externalMgrEndpoints:
      - ip: 192.168.30.5
      - ip: 192.168.30.6
      - ip: 192.168.30.10
    externalMgrPrometheusPort: 9283
  dataDirHostPath: /var/lib/rook
