---
# Grants HTTPRoutes in the scaled app namespaces permission to reference the
# KEDA HTTP add-on interceptor proxy service, which lives here in the keda
# namespace (Gateway API cross-namespace backendRef requirement).
apiVersion: gateway.networking.k8s.io/v1
kind: ReferenceGrant
metadata:
  name: interceptor-proxy-searxng
  namespace: keda
spec:
  from:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: searxng
  to:
    - group: ""
      kind: Service
      name: keda-add-ons-http-interceptor-proxy
---
apiVersion: gateway.networking.k8s.io/v1
kind: ReferenceGrant
metadata:
  name: interceptor-proxy-termix
  namespace: keda
spec:
  from:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: termix
  to:
    - group: ""
      kind: Service
      name: keda-add-ons-http-interceptor-proxy