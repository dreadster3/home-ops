---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ai-debugger
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ai-debugger-readonly
rules:
  # Core workload and cluster state (no secrets)
  - apiGroups: [""]
    resources: ["pods", "pods/log", "services", "endpoints", "events",
                "nodes", "namespaces", "configmaps",
                "persistentvolumes", "persistentvolumeclaims",
                "replicationcontrollers", "resourcequotas", "limitranges"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets", "statefulsets", "daemonsets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses", "networkpolicies"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses", "volumeattachments"]
    verbs: ["get", "list", "watch"]
  # Operator-managed datastores (Langfuse ClickHouse/Keeper, CNPG, shared Dragonfly)
  - apiGroups: ["clickhouse.com"]
    resources: ["clickhouseclusters", "clickhouseclusters/status",
                "keeperclusters", "keeperclusters/status"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["postgresql.cnpg.io"]
    resources: ["clusters", "clusters/status", "backups", "scheduledbackups"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["dragonflydb.io"]
    resources: ["dragonflies", "dragonflies/status"]
    verbs: ["get", "list", "watch"]
  # Cilium policies (the repo uses CNPs, not networking.k8s.io NetworkPolicies)
  - apiGroups: ["cilium.io"]
    resources: ["ciliumnetworkpolicies", "ciliumclusterwidenetworkpolicies"]
    verbs: ["get", "list", "watch"]
  # Flux reconcile state (no secrets; source objects carry no credentials)
  - apiGroups: ["helm.toolkit.fluxcd.io"]
    resources: ["helmreleases", "helmreleases/status"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["kustomize.toolkit.fluxcd.io"]
    resources: ["kustomizations", "kustomizations/status"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["source.toolkit.fluxcd.io"]
    resources: ["gitrepositories", "ocirepositories", "helmrepositories", "helmcharts"]
    verbs: ["get", "list", "watch"]
  # Cert signing requests — public keys/SANs only; useful for cert rotation forensics
  - apiGroups: ["certificates.k8s.io"]
    resources: ["certificatesigningrequests"]
    verbs: ["get", "list", "watch"]
  # Resource usage for kubectl top
  - apiGroups: ["metrics.k8s.io"]
    resources: ["pods", "nodes"]
    verbs: ["get", "list"]
  # Discovery of API resources
  - nonResourceURLs: ["/version", "/healthz", "/readyz"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ai-debugger-readonly
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: ai-debugger-readonly
subjects:
  - kind: ServiceAccount
    name: ai-debugger
    namespace: default
---
# Explicit long-lived token on the SA so a kubeconfig can be crafted from it
apiVersion: v1
kind: Secret
metadata:
  name: ai-debugger-token
  namespace: default
  annotations:
    kubernetes.io/service-account.name: ai-debugger
type: kubernetes.io/service-account-token
