---
# Mirrors harbor/secret-store.yaml: a namespaced External-Secrets store backed
# by the Kubernetes provider, used to translate the OBC-generated secret's
# AWS_* keys into the key names the renovate-operator chart requires
# (access-key-id / secret-access-key).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kubernetes-secret-store-sa
  namespace: renovate-operator
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kubernetes-secret-store-role
  namespace: renovate-operator
rules:
  - apiGroups: [""]
    resources:
      - secrets
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - authorization.k8s.io
    resources:
      - selfsubjectrulesreviews
    verbs:
      - create
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kubernetes-secret-store-role-binding
  namespace: renovate-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: kubernetes-secret-store-role
subjects:
  - kind: ServiceAccount
    name: kubernetes-secret-store-sa
    namespace: renovate-operator
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: kubernetes-secret-store
  namespace: renovate-operator
spec:
  provider:
    kubernetes:
      remoteNamespace: renovate-operator
      server:
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
      auth:
        serviceAccount:
          name: kubernetes-secret-store-sa
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: renovate-s3-credentials
  namespace: renovate-operator
spec:
  secretStoreRef:
    name: kubernetes-secret-store
    kind: SecretStore
  refreshInterval: 1h
  target:
    name: renovate-s3-credentials
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        access-key-id: "{{ .AWS_ACCESS_KEY_ID }}"
        secret-access-key: "{{ .AWS_SECRET_ACCESS_KEY }}"
  dataFrom:
    - extract:
        key: renovate-bucket
