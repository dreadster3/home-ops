---
# GitHub App credentials for the operator's native GitHub App integration
# (docs: github-app-native.md). The operator signs a JWT with the App's PEM,
# exchanges it for a short-lived installation access token and injects it as
# RENOVATE_TOKEN into every discovery/executor job — no long-lived PAT involved.
#
# The `renovate-operator.mogenius.com/allow-ref` label opts the secret in to
# being referenced at caller-chosen keys (enforced by the policy engine).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: github-app-credentials
  namespace: renovate-operator
spec:
  refreshInterval: 24h
  secretStoreRef:
    name: infisical
    kind: ClusterSecretStore
  target:
    name: github-app-credentials
    creationPolicy: Owner
    template:
      metadata:
        labels:
          renovate-operator.mogenius.com/allow-ref: "true"
  data:
    - secretKey: APP_ID
      remoteRef:
        key: /renovate/GITHUB_APP_ID
    - secretKey: INSTALL_ID
      remoteRef:
        key: /renovate/GITHUB_APP_INSTALLATION_ID
    - secretKey: PEM
      remoteRef:
        key: /renovate/GITHUB_APP_KEY
---
# UI authentication (authentik OIDC), kept out of git: External Secrets renders
# a single secret with two keys:
#   - `oidc.yaml`     → the HelmRelease `valuesFrom` fragment (helm-controller
#                       merges it into the chart values)
#   - `client-secret` → read by the chart via auth.oidc.existingSecret
#
# postBuild substitution applies to the ExternalSecret objects themselves, so
# ${EXTERNAL_DOMAIN}/${INTERNAL_DOMAIN} resolve with the cluster's domain before
# External Secrets renders the file, while the client id and secret come from
# Infisical.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: renovate-oidc
  namespace: renovate-operator
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: infisical
    kind: ClusterSecretStore
  target:
    name: renovate-oidc
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        oidc.yaml: |
          auth:
            oidc:
              enabled: true
              issuerUrl: "https://authentik.${EXTERNAL_DOMAIN}/application/o/renovate/"
              redirectUrl: "https://renovate.${INTERNAL_DOMAIN}/auth/callback"
              clientId: "{{ .client_id }}"
              existingSecret: renovate-oidc
        client-secret: "{{ .oidc_client_secret }}"
  data:
    - secretKey: client_id
      remoteRef:
        key: /renovate/OIDC_CLIENT_ID
    - secretKey: oidc_client_secret
      remoteRef:
        key: /renovate/OIDC_CLIENT_SECRET
