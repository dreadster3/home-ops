---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: renovate-operator
  namespace: renovate-operator
spec:
  targetNamespace: renovate-operator
  commonMetadata:
    labels:
      app.kubernetes.io/module: renovate-operator
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: renovate-operator
      namespace: renovate-operator
  path: ./kubernetes/infrastructure/base/platform/renovate-operator/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  interval: 1h
  timeout: 5m
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: renovate-operator-config
  namespace: renovate-operator
spec:
  targetNamespace: renovate-operator
  commonMetadata:
    labels:
      app.kubernetes.io/module: renovate-operator-config
  dependsOn:
    - name: renovate-operator
      namespace: renovate-operator
  path: ./kubernetes/infrastructure/base/platform/renovate-operator/config
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  interval: 1h
  retryInterval: 1m
  timeout: 5m
