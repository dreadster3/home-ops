---
# Bearer/hook token for incoming webhook deliveries from GitHub (via Pangolin).
# A random 64+ character value; the operator uses it to authenticate
# /webhook/v1/* requests, and webhook sync attaches it to created GitHub hooks
# as the hook secret (validated via X-Hub-Signature-256 HMAC).
# Per-RenovateJob credential, so it is managed next to the RenovateJob.
# The allow-ref label is required by the policy engine.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: renovate-webhook-token
  namespace: renovate-operator
spec:
  refreshInterval: 24h
  secretStoreRef:
    name: infisical
    kind: ClusterSecretStore
  target:
    name: renovate-webhook-token
    creationPolicy: Owner
    template:
      metadata:
        labels:
          renovate-operator.mogenius.com/allow-ref: "true"
  data:
    - secretKey: token
      remoteRef:
        key: /renovate/WEBHOOK_TOKEN
