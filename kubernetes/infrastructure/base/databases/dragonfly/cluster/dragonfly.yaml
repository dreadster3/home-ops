apiVersion: dragonflydb.io/v1alpha1
kind: Dragonfly
metadata:
  name: dragonfly
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  # Consumers use dedicated logical DB indexes (Dragonfly supports 16 by default),
  # all set explicitly:
  # harbor 0/1/2/3, openwebui 4+5, immich 6, litellm 7, netbox 8+9,
  # paperless 10, searxng 11, sure 12
  image: ghcr.io/dragonflydb/dragonfly:v2.0.2@sha256:061f00b201b58e12f974e4e96c761a881ee1c05e9d8ee967466a604b7299753b
  replicas: 2
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: DoNotSchedule
      labelSelector:
        matchLabels:
          app: dragonfly
  env:
    - name: MAX_MEMORY
      valueFrom:
        resourceFieldRef:
          resource: limits.memory
          divisor: 1Mi
  args:
    - --maxmemory=$(MAX_MEMORY)Mi
    - --proactor_threads=4
    # Required by BullMQ-based apps (immich, paperless, sure, openwebui) that
    # run Lua scripts with undeclared keys
    - --default_lua_flags=allow-undeclared-keys
  # One shared password for all consumers, per app namespaces sync this via
  # their own ExternalSecret from /dragonfly/DRAGONFLY_PASSWORD
  authentication:
    passwordFromSecret:
      name: dragonfly-credentials
      key: DRAGONFLY_PASSWORD
  resources:
    # Aggregated footprint of the previous per-app instances; memory pinned
    # at 2Gi with requests == limits so MAX_MEMORY (derived from limits)
    # has a stable size
    requests:
      cpu: 50m
      memory: 2Gi
    limits:
      memory: 2Gi
---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: &app dragonfly
  labels:
    group: dragonfly
    app: *app
spec:
  selector:
    matchLabels:
      app: *app
  podTargetLabels:
    - app
  podMetricsEndpoints:
    - port: admin