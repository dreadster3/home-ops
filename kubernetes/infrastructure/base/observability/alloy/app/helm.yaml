apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: grafana
  namespace: monitoring
spec:
  interval: 24h
  url: https://grafana.github.io/helm-charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: alloy
  namespace: monitoring
spec:
  interval: 1h
  chart:
    spec:
      chart: alloy
      version: v1.*
      interval: 24h
      sourceRef:
        kind: HelmRepository
        name: grafana
  values:
    alloy:
      stabilityLevel: experimental
      configMap:
        create: false
        name: alloy
      clustering:
        enabled: true
        name: prd
      resources:
        requests:
          cpu: 120m
          memory: &memory 1700Mi
        limits:
          memory: *memory
      extraPorts:
        - name: otlp
          port: 4318
          targetPort: 4318
      extraEnv:
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName

    configReloader:
      resources:
        requests:
          cpu: 10m
          memory: 50Mi
        limits:
          memory: 50Mi
    controller:
      podAnnotations:
        reloader.stakater.com/auto: "true"
