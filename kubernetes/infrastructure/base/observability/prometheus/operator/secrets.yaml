# Token for the prometheus-scrape ServiceAccount (see scrape-rbac.yaml). The raw token is
# generated in-cluster and stored in Infisical; the Secret is synced into k8s by
# external-secrets. Value must be a long-lived bearer token of the `prometheus-scrape`
# ServiceAccount in the monitoring namespace.
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: prometheus-scrape-token
  labels:
    app.kubernetes.io/module: prometheus-operator
spec:
  secretStoreRef:
    name: infisical
    kind: ClusterSecretStore
  target:
    name: prometheus-scrape-token
    creationPolicy: Owner
  data:
    - secretKey: token
      remoteRef:
        key: /prometheus/SCRAPE_TOKEN