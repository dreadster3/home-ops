apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: prometheus
  namespace: monitoring
spec:
  interval: 1h
  chartRef:
    kind: HelmChart
    name: prometheus
  values:
    fullnameOverride: prometheus
    cleanPrometheusOperatorObjectNames: true

    prometheus:
      serviceMonitor:
        selfMonitor: true
      thanosService:
        enabled: true
      thanosServiceMonitor:
        enabled: true

      prometheusSpec:
        replicas: 1

        image:
          tag: v3.7.3

        enableRemoteWriteReceiver: true

        externalLabels:
          prometheus_replica: $(POD_NAME)

        retention: 7d
        retentionSize: 45GB

        thanos:
          image: quay.io/thanos/thanos:v0.42.4
          resources:
            requests:
              cpu: 10m
              memory: &memory 466Mi
            limits:
              memory: *memory

          grpcListenLocal: false
          httpListenLocal: false
          objectStorageConfig:
            existingSecret:
              name: thanos-object-store
              key: objstore.yml

        storageSpec:
          volumeClaimTemplate:
            spec:
              resources:
                requests:
                  storage: 50Gi

        resources:
          requests:
            cpu: 550m
            memory: &memory 6Gi
          limits:
            memory: *memory

        ruleSelectorNilUsesHelmValues: false
        podMonitorSelector:
          matchLabels:
            disabled: "true"
        probeSelector:
          matchLabels:
            disabled: "true"
        scrapeConfigSelector:
          matchLabels:
            disabled: "true"
        serviceMonitorSelector:
          matchLabels:
            disabled: "true"

    alertmanager:
      enabled: true

      alertmanagerSpec:
        image:
          tag: v0.28.1
        resources:
          requests:
            cpu: 10m
            memory: &memory 68Mi
          limits:
            memory: *memory

    crds:
      enabled: false

    defaultRules:
      create: false

    kubernetesServiceMonitors:
      enabled: false

    kubeApiServer:
      enabled: false

    kubelet:
      enabled: false

    kubeControllerManager:
      enabled: false

    coreDns:
      enabled: false

    kubeEtcd:
      enabled: false

    kubeScheduler:
      enabled: false

    kubeProxy:
      enabled: false

    kubeStateMetrics:
      enabled: false

    kube-state-metrics:
      enabled: false

    grafana:
      enabled: false

    nodeExporter:
      enabled: false

    prometheus-node-exporter:
      enabled: false

    windowsMonitoring:
      enabled: false

    prometheusOperator:
      enabled: false

    thanosRuler:
      enabled: false
