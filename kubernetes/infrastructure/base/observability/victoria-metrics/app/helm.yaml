apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: victoria-metrics
  namespace: monitoring
spec:
  interval: 24h
  url: oci://ghcr.io/victoriametrics/helm-charts/victoria-metrics-single
  ref:
    tag: "0.50.0"
    digest: sha256:06640ae79bf6f5b1eb44805b0d31e92b006b27cb94879cc9fb77aabcb2708c63
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: victoria-metrics
  namespace: monitoring
spec:
  interval: 1h
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  chartRef:
    kind: OCIRepository
    name: victoria-metrics
  values:
    server:
      fullnameOverride: victoria-metrics
      retentionPeriod: "90d"

      persistentVolume:
        enabled: true
        size: 50Gi
        storageClassName: ceph-block

      resources:
        requests:
          cpu: 100m
          memory: &memory 1.5Gi
        limits:
          memory: *memory

      serviceMonitor:
        enabled: true
