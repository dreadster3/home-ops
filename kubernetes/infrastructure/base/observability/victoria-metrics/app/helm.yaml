apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: victoria-metrics
  namespace: monitoring
spec:
  interval: 24h
  url: oci://ghcr.io/victoriametrics/helm-charts/victoria-metrics-single
  ref:
    tag: "0.52.0"
    digest: sha256:fc3bbb40d9e145203f45350103d90d2a776551dc8d37174c1060a4fceab901a2
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: victoria-metrics
  namespace: monitoring
spec:
  interval: 1h
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  chartRef:
    kind: OCIRepository
    name: victoria-metrics
  values:
    server:
      fullnameOverride: victoria-metrics
      retentionPeriod: "90d"

      persistentVolume:
        enabled: true
        size: 50Gi
        storageClassName: ceph-block

      resources:
        requests:
          cpu: 100m
          memory: &memory 1.75Gi
        limits:
          memory: *memory

      serviceMonitor:
        enabled: true
