apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: victoria-metrics
  namespace: monitoring
spec:
  interval: 24h
  url: oci://ghcr.io/victoriametrics/helm-charts/victoria-metrics-single
  ref:
    tag: "0.49.0"
    digest: sha256:08af44819d6956c7ce10e6989d120a700b1519d42b604b4d486e7bbb8daf5df9
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: victoria-metrics
  namespace: monitoring
spec:
  interval: 1h
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  chartRef:
    kind: OCIRepository
    name: victoria-metrics
  values:
    server:
      fullnameOverride: victoria-metrics
      retentionPeriod: "90d"

      persistentVolume:
        enabled: true
        size: 50Gi
        storageClassName: ceph-block

      resources:
        requests:
          cpu: 200m
          memory: &memory 1Gi
        limits:
          memory: *memory

      serviceMonitor:
        enabled: true
