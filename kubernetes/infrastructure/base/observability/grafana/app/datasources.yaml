apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: monitoring
  labels:
    grafana/datasource: "true"
data:
  default.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        url: http://thanos-query-frontend:9090
        isDefault: true
        version: 1
        jsonData:
          timeInterval: 15s
      - name: VictoriaLogs
        type: victoriametrics-logs-datasource
        url: http://victoria-logs-single:9428
        access: proxy
        version: 1
        jsonData:
          timeInterval: 15s