apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: victoria-logs
  namespace: monitoring
spec:
  interval: 24h
  url: oci://ghcr.io/victoriametrics/helm-charts/victoria-logs-single
  ref:
    tag: "0.13.14"
    digest: sha256:6e3f7c02490cf0b466fde00ce10ca4ab11bcfa4f349bc03285b827343b3fca0e
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: victoria-logs
  namespace: monitoring
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: victoria-logs
  values:
    server:
      fullnameOverride: victoria-logs
      retentionPeriod: "30d"
      retentionMaxDiskUsagePercent: 85

      persistentVolume:
        enabled: true
        size: 50Gi
        storageClassName: ceph-block

      resources:
        requests:
          cpu: 20m
          memory: &memory 2Gi
        limits:
          memory: *memory

      serviceMonitor:
        enabled: true
