apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: victoria-logs
  namespace: monitoring
spec:
  interval: 24h
  url: oci://ghcr.io/victoriametrics/helm-charts/victoria-logs-single
  ref:
    tag: "0.13.12"
    digest: sha256:a89531ea07e7a910c953da676d7e3b2fca73819060333e2b39634a8bebed5948
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: victoria-logs
  namespace: monitoring
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: victoria-logs
  values:
    server:
      fullnameOverride: victoria-logs
      retentionPeriod: "30d"
      retentionMaxDiskUsagePercent: 85

      persistentVolume:
        enabled: true
        size: 50Gi
        storageClassName: ceph-block

      resources:
        requests:
          cpu: 20m
          memory: &memory 2Gi
        limits:
          memory: *memory

      serviceMonitor:
        enabled: true
