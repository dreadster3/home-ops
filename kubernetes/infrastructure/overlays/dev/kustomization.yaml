apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
labels:
  - pairs:
      app.kubernetes.io/category: infrastructure
      app.kubernetes.io/environment: dev
patches:
  - path: ./secrets.sops.yaml
    target:
      kind: Secret
      name: secrets
  - patch: |-
      - op: replace
        path: /spec/path
        value: ./kubernetes/infrastructure/overlays/dev/networking/coredns/app
    target:
      kind: Kustomization
      name: coredns
  - patch: |-
      - op: replace
        path: /spec/path
        value: ./kubernetes/infrastructure/overlays/dev/security/external-secrets/store
    target:
      kind: Kustomization
      name: external-secrets-store
  - patch: |-
      - op: replace
        path: /spec/path
        value: ./kubernetes/infrastructure/overlays/dev/networking/cilium/config
    target:
      kind: Kustomization
      name: cilium-config
  - patch: |-
      - op: replace
        path: /spec/path
        value: ./kubernetes/infrastructure/overlays/dev/networking/envoy-gateway/config
    target:
      kind: Kustomization
      name: envoy-gateway-config
  - patch: |-
      - op: replace
        path: /spec/path
        value: ./kubernetes/infrastructure/overlays/dev/platform/flux/instance
    target:
      kind: Kustomization
      name: flux-instance
  - patch: |-
      $patch: delete
      apiVersion: kustomize.toolkit.fluxcd.io/v1
      kind: Kustomization
      metadata:
        name: cilium
        namespace: cilium-system
    target:
      kind: Kustomization
      name: cilium
  - patch: |-
      - op: remove
        path: /spec/dependsOn
    target:
      kind: Kustomization
      name: cilium-config
  - patch: |-
      - op: remove
        path: /spec/dependsOn
    target:
      kind: Kustomization
      name: cilium-policies
  - patch: |-
      - op: replace
        path: /spec/path
        value: ./kubernetes/infrastructure/overlays/dev/networking/external-dns/app
    target:
      kind: Kustomization
      name: external-dns
  - patch: |-
      $patch: delete
      apiVersion: kustomize.toolkit.fluxcd.io/v1
      kind: Kustomization
      metadata:
        name: prometheus
        namespace: monitoring
    target:
      kind: Kustomization
      name: prometheus
  - patch: |-
      $patch: delete
      apiVersion: kustomize.toolkit.fluxcd.io/v1
      kind: Kustomization
      metadata:
        name: metrics-server
        namespace: metrics-server
    target:
      kind: Kustomization
      name: metrics-server
  - patch: |-
      $patch: delete
      apiVersion: kustomize.toolkit.fluxcd.io/v1
      kind: Kustomization
      metadata:
        name: netbird-operator
        namespace: netbird
    target:
      kind: Kustomization
      name: netbird-operator
  - patch: |-
      $patch: delete
      apiVersion: kustomize.toolkit.fluxcd.io/v1
      kind: Kustomization
      metadata:
        name: netbird-operator-config
        namespace: netbird
    target:
      kind: Kustomization
      name: netbird-operator-config
  - patch: |-
      - op: replace
        path: /spec/path
        value: ./kubernetes/infrastructure/overlays/dev/storage/rook/cluster
      - op: add
        path: /spec/healthChecks
        value:
          - apiVersion: helm.toolkit.fluxcd.io/v2
            kind: HelmRelease
            name: rook-ceph-cluster
            namespace: rook-ceph
          - apiVersion: ceph.rook.io/v1
            kind: CephCluster
            name: rook-ceph
            namespace: rook-ceph
    target:
      kind: Kustomization
      name: rook-ceph-cluster
  - patch: |-
      $patch: delete
      apiVersion: kustomize.toolkit.fluxcd.io/v1
      kind: Kustomization
      metadata:
        name: nfs-subdir
        namespace: nfs-subdir
    target:
      kind: Kustomization
      name: nfs-subdir
  - patch: |-
      $patch: delete
      apiVersion: kustomize.toolkit.fluxcd.io/v1
      kind: Kustomization
      metadata:
        name: local-path-storage
        namespace: local-path-storage
    target:
      kind: Kustomization
      name: local-path-storage
  - patch: |-
      - op: replace
        path: /spec/path
        value: ./kubernetes/infrastructure/overlays/dev/observability/thanos/app
    target:
      kind: Kustomization
      name: thanos
  - patch: |-
      - op: replace
        path: /spec/path
        value: ./kubernetes/infrastructure/overlays/dev/observability/victoria-logs/app
    target:
      kind: Kustomization
      name: victoria-logs
  - patch: |-
      - op: replace
        path: /spec/path
        value: ./kubernetes/infrastructure/overlays/dev/observability/prometheus/app
    target:
      kind: Kustomization
      name: prometheus
  - patch: |-
      - op: replace
        path: /spec/path
        value: ./kubernetes/infrastructure/overlays/dev/observability/grafana/app
    target:
      kind: Kustomization
      name: grafana
  - patch: |-
      - op: replace
        path: /spec/path
        value: ./kubernetes/infrastructure/overlays/dev/observability/alloy/app
    target:
      kind: Kustomization
      name: alloy
  - patch: |-
      apiVersion: kustomize.toolkit.fluxcd.io/v1
      kind: Kustomization
      metadata:
        name: _
      spec:
        deletionPolicy: WaitForTermination
        patches:
          - patch: |-
              apiVersion: helm.toolkit.fluxcd.io/v2
              kind: HelmRelease
              metadata:
                name: _
              spec:
                install:
                  crds: CreateReplace
                rollback:
                  cleanupOnFail: true
                upgrade:
                  cleanupOnFail: true
                  crds: CreateReplace
                  strategy:
                    name: RemediateOnFailure
                  remediation:
                    remediateLastFailure: true
                    retries: 2
            target:
              group: helm.toolkit.fluxcd.io
              kind: HelmRelease
    target:
      group: kustomize.toolkit.fluxcd.io
      kind: Kustomization
  - patch: |-
      apiVersion: kustomize.toolkit.fluxcd.io/v1
      kind: Kustomization
      metadata:
        name: not-used
      spec:
        decryption:
          provider: sops
    target:
      group: kustomize.toolkit.fluxcd.io
      kind: Kustomization
  - patch: |-
      apiVersion: kustomize.toolkit.fluxcd.io/v1
      kind: Kustomization
      metadata:
        name: not-used
      spec:
        postBuild:
          substituteFrom:
            - kind: ConfigMap
              name: settings
              optional: false
            - kind: Secret
              name: secrets
              optional: false
    target:
      group: kustomize.toolkit.fluxcd.io
      kind: Kustomization
resources:
  - ../../base/security
  - ../../base/databases
  - ../../base/observability/prometheus
  - ../../base/observability/victoria-logs
  - ../../base/observability/namespace.yaml
  - ../../base/platform
  - ../../base/networking
  - ../../base/storage
