apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: grafana
  namespace: monitoring
spec:
  values:
    replicas: 1
    resources:
      requests:
        cpu: 0m
        memory: 0Mi
    sidecar:
      resources:
        requests:
          cpu: 0m
          memory: 0Mi
    # Dev has no authentik — disable OIDC and remove the authentik secret mount.
    # assertNoLeakedSecrets is disabled so we can blank out client_id/client_secret,
    # which otherwise reference $__file{...} paths that aren't mounted in dev.
    assertNoLeakedSecrets: false
    extraSecretMounts: []
    grafana.ini:
      auth:
        signout_redirect_url: ""
      auth.generic_oauth:
        enabled: false
        auto_login: false
        client_id: ""
        client_secret: ""
        scopes: ""
        auth_url: ""
        token_url: ""
        api_url: ""
        role_attribute_path: ""
