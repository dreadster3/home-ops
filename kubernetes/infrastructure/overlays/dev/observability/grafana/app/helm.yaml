apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: grafana
  namespace: monitoring
spec:
  values:
    replicas: 1
    resources:
      requests:
        cpu: 0m
        memory: 0Mi
    sidecar:
      resources:
        requests:
          cpu: 0m
          memory: 0Mi
    # Dev has no authentik — disable OIDC and remove the authentik secret mount
    extraSecretMounts: []
    grafana.ini:
      auth:
        signout_redirect_url: ""
      auth.generic_oauth:
        enabled: false
        auto_login: false
        scopes: ""
        auth_url: ""
        token_url: ""
        api_url: ""
        role_attribute_path: ""
    route:
      main:
        enabled: false
