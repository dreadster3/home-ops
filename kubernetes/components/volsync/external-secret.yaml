# ExternalSecret for restic repository credentials, pulled from Infisical.
# The app must provide S3_ACCESS_KEY_PATH, S3_SECRET_KEY_PATH, and RESTIC_PASSWORD_PATH
# via postBuild.substitute (see configmap.yaml for defaults).
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ${APP}-volsync-rustfs
  namespace: ${NAMESPACE}
spec:
  secretStoreRef:
    name: infisical
    kind: ClusterSecretStore
  target:
    name: ${APP}-volsync-rustfs
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        RESTIC_REPOSITORY: "{{ .RESTIC_REPOSITORY }}"
        RESTIC_PASSWORD: "{{ .RESTIC_PASSWORD }}"
        AWS_ACCESS_KEY_ID: "{{ .AWS_ACCESS_KEY_ID }}"
        AWS_SECRET_ACCESS_KEY: "{{ .AWS_SECRET_ACCESS_KEY }}"
  data:
    - secretKey: RESTIC_REPOSITORY
      remoteRef:
        key: ${S3_ACCESS_KEY_PATH}
    - secretKey: RESTIC_PASSWORD
      remoteRef:
        key: ${RESTIC_PASSWORD_PATH}
    - secretKey: AWS_ACCESS_KEY_ID
      remoteRef:
        key: ${S3_ACCESS_KEY_PATH}
    - secretKey: AWS_SECRET_ACCESS_KEY
      remoteRef:
        key: ${S3_SECRET_KEY_PATH}
