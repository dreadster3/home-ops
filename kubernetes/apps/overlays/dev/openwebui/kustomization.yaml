apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: openwebui

labels:
  - pairs:
      app.kubernetes.io/module: openwebui

resources:
  - ../../../base/openwebui
  - bucket.yaml

patches:
  - path: store.yaml
    target:
      kind: ObjectStore
  - path: pgcluster.yaml
    target:
      kind: Cluster
  - patch: |-
      - op: replace
        path: /spec/jobTemplate/spec/template/spec/containers/0/env/3/value
        value: test
      - op: replace
        path: /spec/jobTemplate/spec/template/spec/containers/0/env/16/value
        value: https://truenas.${HOME_DOMAIN}:30292
    target:
      kind: CronJob
  - patch: |-
      - op: replace
        path: /spec/egress/0/toFQDNs/0/matchName
        value: truenas.${HOME_DOMAIN}
    target:
      kind: CiliumNetworkPolicy
      name: openwebui-sync
  - patch: |-
      # Disable OIDC and use built-in username/password auth in dev.
      # env index 8 = ENABLE_OAUTH_SIGNUP, index 9 = ENABLE_LOGIN_FORM
      # (see kubernetes/apps/base/openwebui/helm.yaml)
      - op: replace
        path: /spec/values/controllers/main/containers/main/env/8/value
        value: "false"
      - op: replace
        path: /spec/values/controllers/main/containers/main/env/9/value
        value: "true"
    target:
      kind: HelmRelease
      name: openwebui
