apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: openwebui-cluster
  namespace: openwebui
  annotations:
    cnpg.io/skipEmptyWalArchiveCheck: "disabled"
spec:
  imageName: ghcr.io/tensorchord/cloudnative-vectorchord:18.3-1.1.1

  postgresql:
    extensions: null
    shared_preload_libraries:
      - "vchord.so"

  # bootstrap:
  #   recovery: null
  #   initdb:
  #     database: openwebui
  #     owner: openwebui
  #     secret:
  #       name: openwebui-cluster-credentials
  #     postInitSQL:
  #       - CREATE EXTENSION IF NOT EXISTS "vchord" CASCADE;

  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: backup-store
        serverName: openwebui-cluster-vector
