apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: sure-backup-s3-account
  namespace: sure
spec:
  target:
    name: sure-cluster-bucket
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        ACCESS_KEY: "{{ .access_key }}"
        SECRET_KEY: "{{ .secret_key }}"
  data:
    - secretKey: access_key
      remoteRef:
        key: /sure/BACKUP_S3_ACCESS_KEY
    - secretKey: secret_key
      remoteRef:
        key: /sure/BACKUP_S3_SECRET_KEY