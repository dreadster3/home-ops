apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: paperless
  namespace: paperless
  labels:
    nfsMount: "true"
spec:
  interval: 1h
  timeout: 10m
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  chart:
    spec:
      chart: app-template
      version: 5.0.x
      interval: 24h
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  values:
    controllers:
      main:
        # With >1 controller the chart appends the controller identifier to resource names
        # (paperless-main). Force the original name to preserve deploy/paperless + svc/paperless.
        forceRename: paperless
        labels:
          nfsMount: "true"
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          main:
            image:
              repository: ghcr.io/paperless-ngx/paperless-ngx
              tag: 3.0.0@sha256:80f96a38de1a04c49a466b236b9c34491e6c4b29cc1e216a4a5134ba5dd22059
            env:
              USERMAP_UID: 4100
              USERMAP_GID: 4100
              PAPERLESS_TIME_ZONE: Europe/Lisbon
              PAPERLESS_DBENGINE: postgresql
              PAPERLESS_ALLOWED_HOSTS: paperless.${INTERNAL_DOMAIN},paperless.${EXTERNAL_DOMAIN},docs.${ALTERNATE_EXTERNAL_DOMAIN}
              PAPERLESS_CORS_ALLOWED_HOSTS: &domains https://paperless.${INTERNAL_DOMAIN},https://paperless.${EXTERNAL_DOMAIN},https://docs.${ALTERNATE_EXTERNAL_DOMAIN}
              PAPERLESS_CSRF_TRUSTED_ORIGINS: *domains
              PAPERLESS_OCR_LANGUAGE: eng+por
              PAPERLESS_OCR_LANGUAGES: eng por
              PAPERLESS_WEBSERVER_WORKERS: 2
              PAPERLESS_TASK_WORKERS: 2
              PAPERLESS_APPS: allauth.socialaccount.providers.openid_connect
              PAPERLESS_LOGOUT_REDIRECT_URL: "https://authentik.${EXTERNAL_DOMAIN}/application/o/paperless/end-session/"
              PAPERLESS_SOCIAL_AUTO_SIGNUP: true
              PAPERLESS_SOCIALACCOUNT_ALLOW_SIGNUPS: true
              PAPERLESS_SOCIAL_ACCOUNT_SYNC_GROUPS: true
              PAPERLESS_EMAIL_FROM: no-reply@${EXTERNAL_DOMAIN}
              # PAPERLESS_CONSUMER_DISABLE: false
              PAPERLESS_CONSUMPTION_DIR: &consume /usr/src/paperless/consume
              PAPERLESS_CONSUMER_RECURSIVE: true
              PAPERLESS_CONSUMER_SUBDIRS_AS_TAGS: false
              PAPERLESS_CONSUMER_DELETE_DUPLICATES: true
              PAPERLESS_CONSUMER_POLLING: 30
              PAPERLESS_DISABLE_REGULAR_LOGIN: true
              PAPERLESS_REDIRECT_LOGIN_TO_SSO: true
              S6_READ_ONLY_ROOT: 1
              S6_YES_I_WANT_A_WORLD_WRITABLE_RUN_BECAUSE_KUBERNETES: 1
              # Content extraction: global Tika (shared utility) + in-namespace Gotenberg for Office→PDF conversion.
              PAPERLESS_TIKA_ENABLED: 1
              PAPERLESS_TIKA_ENDPOINT: http://tika.tika.svc.cluster.local
              PAPERLESS_TIKA_GOTENBERG_ENDPOINT: http://paperless-gotenberg.paperless.svc.cluster.local
            envFrom:
              - secretRef:
                  name: paperless-secret-env
            ports:
              - containerPort: 8000
                name: http
                protocol: TCP
            resources:
              requests:
                cpu: 900m
                memory: &memory 2.5Gi
              limits:
                memory: *memory
            probes:
              liveness:
                enabled: true
                spec:
                  periodSeconds: 30
                  timeoutSeconds: 10
                  failureThreshold: 5
              readiness:
                enabled: true
                spec:
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 3
              startup:
                enabled: true
                spec:
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 30
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: false
              capabilities:
                drop: ["ALL"]
                add:
                  - CHOWN
                  - DAC_OVERRIDE
                  - FOWNER
                  - SETGID
                  - SETUID
        pod:
          # Needs to run as root to install OCR packages
          # TODO: Build a custom image with OCR packages builtin to remove this dependency and run as nonroot
          securityContext:
            runAsNonRoot: false
            runAsUser: 0
            runAsGroup: 0
            fsGroup: 0
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile:
              type: RuntimeDefault

      # Gotenberg — document conversion (Office/HTML → PDF) for Paperless consume.
      # Deployed alongside Paperless only (not shared); Tika is the global shared instance.
      gotenberg:
        type: deployment
        strategy: RollingUpdate
        replicas: 1
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          gotenberg:
            image:
              repository: docker.io/gotenberg/gotenberg
              tag: 8.34@sha256:67097317623a503ba2a6a7e9ae8db6929a1f7e1bbd88077bacf2d325fbdab923
            # Hardened chromium per upstream paperless compose: disable JS and restrict to local
            # file:// URLs so .eml conversion can't fetch tracking pixels or run external scripts.
            args:
              - gotenberg
              - --chromium-disable-javascript=true
              - --chromium-allow-list=file:///tmp/.*
            ports:
              - containerPort: 3000
                name: http
                protocol: TCP
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: http
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: http
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 3
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: http
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 30
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 100m
                memory: 512Mi
              limits:
                memory: 1Gi
        pod:
          # gotenberg image runs as non-root user `gotenberg` (UID 1001) by default.
          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
            runAsGroup: 1001
            fsGroup: 1001
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile:
              type: RuntimeDefault

    service:
      main:
        # Keep the service name as `paperless` (not `paperless-main`) for compatibility.
        forceRename: paperless
        annotations:
          netbird.io/expose: "true"
        controller: main
        ports:
          http:
            port: 80
            targetPort: http
      gotenberg:
        controller: gotenberg
        ports:
          http:
            # Service on port 80 (maps to the container's native 3000) so Paperless
            # can use the bare URL http://paperless-gotenberg.paperless.svc.cluster.local
            port: 80
            targetPort: http

    route:
      main:
        hostnames:
          - paperless.${INTERNAL_DOMAIN}
        parentRefs:
          - name: envoy-internal
            namespace: envoy
        rules:
          - backendRefs:
              - identifier: main
                port: http

    persistence:
      data:
        type: persistentVolumeClaim
        accessMode: ReadWriteMany
        storageClass: nfs
        size: 10Gi
        advancedMounts:
          main:
            main:
              - path: /usr/src/paperless/data
      media:
        type: persistentVolumeClaim
        accessMode: ReadWriteMany
        storageClass: nfs
        size: 50Gi
        advancedMounts:
          main:
            main:
              - path: /usr/src/paperless/media
      consume:
        type: nfs
        server: 192.168.30.20
        path: /mnt/main/PaperlessConsume
        advancedMounts:
          main:
            main:
              - path: *consume

      tmpfs:
        type: emptyDir
        globalMounts:
          - path: /tmp
            subPath: tmp
          - path: /run
            subPath: run
        advancedMounts:
          gotenberg:
            gotenberg:
              - path: /var/tmp
              - path: /home/gotenberg

