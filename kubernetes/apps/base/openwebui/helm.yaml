apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: openwebui
  namespace: openwebui
spec:
  interval: 1h
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  chart:
    spec:
      chart: app-template
      version: 5.0.x
      interval: 24h
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  # dependsOn:
  #   - name: ollama
  values:
    controllers:
      main:
        forceRename: openwebui
        strategy: RollingUpdate
        replicas: 2
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          main:
            image:
              repository: ghcr.io/open-webui/open-webui
              tag: v0.10.2@sha256:9fcea9c6e32ab60b0498f3986c6cdf651ddbe61db48d2213a3d28048ddd673d4
            env:
              - name: ENABLE_WEBSOCKET_SUPPORT
                value: "true"
              - name: WEBSOCKET_MANAGER
                value: redis

              - name: WEBUI_URL
                value: https://openwebui.${EXTERNAL_DOMAIN}

              # OAuth
              - name: OPENID_PROVIDER_URL
                value: https://authentik.${EXTERNAL_DOMAIN}/application/o/open-web-ui/.well-known/openid-configuration
              - name: OPENID_REDIRECT_URI
                value: https://openwebui.${EXTERNAL_DOMAIN}/oauth/oidc/callback
              - name: OAUTH_SCOPES
                value: openid email profile
              - name: OAUTH_PROVIDER_NAME
                value: Authentik
              - name: OAUTH_MERGE_ACCOUNTS_BY_EMAIL
                value: "true"
              - name: ENABLE_OAUTH_SIGNUP
                value: "true"
              - name: ENABLE_LOGIN_FORM
                value: "false"

              # Forward user info to LiteLLM for per-user usage tracking
              - name: ENABLE_FORWARD_USER_INFO_HEADERS
                value: "true"

              # TTS
              - name: AUDIO_TTS_ENGINE
                value: openai
              - name: AUDIO_TTS_OPENAI_API_BASE_URL
                value: &litellm http://litellm.litellm.svc.cluster.local:4000/v1
              - name: AUDIO_TTS_MODEL
                value: tts
              - name: AUDIO_TTS_VOICE
                value: nova

              # STT
              - name: AUDIO_STT_ENGINE
                value: openai
              - name: AUDIO_STT_OPENAI_API_BASE_URL
                value: *litellm
              - name: AUDIO_STT_MODEL
                value: stt

              # Image
              - name: ENABLE_CHAT_RESPONSE_BASE64_IMAGE_URL_CONVERSION
                value: "true"

              - name: ENABLE_IMAGE_GENERATION
                value: "true"
              - name: IMAGE_GENERATION_ENGINE
                value: &image-engine openai
              - name: IMAGE_GENERATION_MODEL
                value: &image-model image
              - name: IMAGE_SIZE
                value: &image-size auto
              - name: IMAGE_AUTO_SIZE_MODELS_REGEX_PATTERN
                value: ^image
              - name: IMAGES_OPENAI_API_BASE_URL
                value: *litellm
              - name: ENABLE_IMAGE_EDIT
                value: "true"
              - name: IMAGE_EDIT_ENGINE
                value: *image-engine
              - name: IMAGE_EDIT_MODEL
                value: *image-model
              - name: IMAGES_EDIT_OPENAI_API_BASE_URL
                value: *litellm
              - name: IMAGE_EDIT_SIZE
                value: *image-size

              # Search Engine
              - name: ENABLE_WEB_SEARCH
                value: "true"
              - name: ENABLE_SEARCH_QUERY_GENERATION
                value: "true"
              - name: WEB_SEARCH_ENGINE
                value: searxng
              - name: SEARXNG_QUERY_URL
                value: http://searxng.searxng.svc.cluster.local/search?q=<query>

              # Content Extraction
              - name: CONTENT_EXTRACTION_ENGINE
                value: tika
              - name: TIKA_SERVER_URL
                value: http://tika.tika.svc.cluster.local

              # RAG
              - name: RAG_EMBEDDING_ENGINE
                value: openai
              - name: RAG_EMBEDDING_MODEL
                value: text-embedding-3
              - name: RAG_OPENAI_API_BASE_URL
                value: *litellm

              - name: USER_AGENT
                value: OpenWebUI/1.0

              # Web Loader
              - name: WEB_LOADER_ENGINE
                value: playwright
              - name: PLAYWRIGHT_WS_URL
                value: ws://playwright:3000

              # Storage
              - name: STORAGE_PROVIDER
                value: s3
              - name: S3_ACCESS_KEY_ID
                valueFrom:
                  secretKeyRef:
                    name: openwebui-bucket
                    key: AWS_ACCESS_KEY_ID
              - name: S3_SECRET_ACCESS_KEY
                valueFrom:
                  secretKeyRef:
                    name: openwebui-bucket
                    key: AWS_SECRET_ACCESS_KEY
              - name: S3_BUCKET_NAME
                valueFrom:
                  configMapKeyRef:
                    name: openwebui-bucket
                    key: BUCKET_NAME
              - name: S3_ENDPOINT_HOST
                valueFrom:
                  configMapKeyRef:
                    name: openwebui-bucket
                    key: BUCKET_HOST
              - name: S3_ENDPOINT_URL
                value: http://$(S3_ENDPOINT_HOST):80

              # Vector Database
              - name: VECTOR_DB
                value: pgvector

              - name: REQUESTS_CA_BUNDLE
                value: /etc/ssl/certs/ca-certificates.crt
            envFrom:
              - secretRef:
                  name: openwebui-secret-env
            ports:
              - containerPort: 8080
                name: http
                protocol: TCP
            resources:
              requests:
                cpu: 50m
                memory: &memory 1.5Gi
              limits:
                memory: *memory
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: false
              capabilities:
                drop: ["ALL"]
      playwright:
        replicas: 1
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          main:
            image:
              repository: mcr.microsoft.com/playwright
              tag: v1.61.1-noble@sha256:5b8f294aff9041b7191c34a4bab3ac270157a28774d4b0660e9743297b697e48
            command:
              [
                "npx",
                "-y",
                "playwright@1.61.1",
                "run-server",
                "--port",
                "3000",
                "--host",
                "0.0.0.0",
              ]
            ports:
              - containerPort: 3000
                name: websocket
                protocol: TCP
            resources:
              requests:
                cpu: 50m
                memory: 500Mi
              limits:
                # Chromium doing real page loads needs more headroom than the
                # main app; 500Mi request is kept, limit raised to 1Gi.
                memory: 1Gi
            probes:
              readiness:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: websocket
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 3
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: ["ALL"]
                # Chromium's setuid sandbox needs SYS_ADMIN to initialize user
                # namespaces when running as non-root. Kept scoped: still no
                # privilege escalation, read-only root, all other caps dropped.
                add: ["SYS_ADMIN"]
        pod:
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile:
              type: RuntimeDefault

    service:
      main:
        forceRename: openwebui
        controller: main
        annotations:
          netbird.io/expose: "true"
        ports:
          http:
            port: 80
            targetPort: http
      playwright:
        controller: playwright
        ports:
          http:
            port: 3000
            targetPort: websocket

    route:
      main:
        hostnames:
          - openwebui.${INTERNAL_DOMAIN}
        parentRefs:
          - name: envoy-internal
            namespace: envoy
        rules:
          - backendRefs:
              - identifier: main
                port: http

    persistence:
      cache:
        enabled: true
        type: emptyDir
        globalMounts:
          - path: /app/backend/data/cache
      # Playwright (mcr.microsoft.com/playwright) ships the browsers baked into
      # /ms-playwright (read-only, 0777) but NOT the playwright npm package, so
      # `npx -y playwright@... run-server` downloads it at runtime into the npm
      # cache under /home/pwuser. Chromium also needs writable /tmp and a larger
      # /dev/shm than the default 64MiB. All three are emptyDirs so the root FS
      # can stay read-only.
      playwright-tmp:
        enabled: true
        type: emptyDir
        advancedMounts:
          playwright:
            main:
              - path: /tmp
      playwright-home:
        enabled: true
        type: emptyDir
        advancedMounts:
          playwright:
            main:
              - path: /home/pwuser
      playwright-shm:
        enabled: true
        type: emptyDir
        medium: Memory
        advancedMounts:
          playwright:
            main:
              - path: /dev/shm
