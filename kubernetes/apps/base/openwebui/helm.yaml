apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: openwebui
  namespace: openwebui
spec:
  interval: 1h
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  chart:
    spec:
      chart: app-template
      version: 5.0.x
      interval: 24h
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  # dependsOn:
  #   - name: ollama
  values:
    controllers:
      main:
        strategy: RollingUpdate
        replicas: 2
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          main:
            image:
              repository: ghcr.io/open-webui/open-webui
              tag: v0.10.2@sha256:9fcea9c6e32ab60b0498f3986c6cdf651ddbe61db48d2213a3d28048ddd673d4
            # command: ["/bin/sh"]
            # args:
            #   - -c
            #   - |
            #     # Install the correct dependency
            #     pip install --no-cache-dir datasets==3.6.0
            #
            #     # Run the original entrypoint
            #     exec /app/backend/start.sh
            env:
              - name: OLLAMA_BASE_URL
                value: https://ollama.${INTERNAL_DOMAIN}

              - name: ENABLE_WEBSOCKET_SUPPORT
                value: "true"
              - name: WEBSOCKET_MANAGER
                value: redis

              - name: WEBUI_URL
                value: https://openwebui.${EXTERNAL_DOMAIN}

              # OAuth
              - name: OPENID_PROVIDER_URL
                value: https://authentik.${EXTERNAL_DOMAIN}/application/o/open-web-ui/.well-known/openid-configuration
              - name: OPENID_REDIRECT_URI
                value: https://openwebui.${EXTERNAL_DOMAIN}/oauth/oidc/callback
              - name: OAUTH_SCOPES
                value: openid email profile
              - name: OAUTH_PROVIDER_NAME
                value: Authentik
              - name: OAUTH_MERGE_ACCOUNTS_BY_EMAIL
                value: "true"
              - name: ENABLE_OAUTH_SIGNUP
                value: "true"
              - name: ENABLE_LOGIN_FORM
                value: "false"

              # Forward user info to LiteLLM for per-user usage tracking
              - name: ENABLE_FORWARD_USER_INFO_HEADERS
                value: "true"

              # TTS
              - name: AUDIO_TTS_ENGINE
                value: openai
              - name: AUDIO_TTS_OPENAI_API_BASE_URL
                value: &litellm http://litellm.litellm.svc.cluster.local:4000/v1
              - name: AUDIO_TTS_MODEL
                value: tts
              - name: AUDIO_TTS_VOICE
                value: nova

              # STT
              - name: AUDIO_STT_ENGINE
                value: openai
              - name: AUDIO_STT_OPENAI_API_BASE_URL
                value: *litellm
              - name: AUDIO_STT_MODEL
                value: nova-2

              # Image
              - name: ENABLE_CHAT_RESPONSE_BASE64_IMAGE_URL_CONVERSION
                value: "true"

              - name: ENABLE_IMAGE_GENERATION
                value: "true"
              - name: IMAGE_GENERATION_ENGINE
                value: &image-engine openai
              - name: IMAGE_GENERATION_MODEL
                value: &image-model gemini-3.1-flash-lite-image
              - name: IMAGE_SIZE
                value: &image-size auto
              - name: IMAGE_AUTO_SIZE_MODELS_REGEX_PATTERN
                value: ^gemini
              - name: IMAGES_OPENAI_API_BASE_URL
                value: *litellm
              - name: ENABLE_IMAGE_EDIT
                value: "true"
              - name: IMAGE_EDIT_ENGINE
                value: *image-engine
              - name: IMAGE_EDIT_MODEL
                value: *image-model
              - name: IMAGES_EDIT_OPENAI_API_BASE_URL
                value: *litellm
              - name: IMAGE_EDIT_SIZE
                value: *image-size

              # Search Engine
              - name: ENABLE_WEB_SEARCH
                value: "true"
              - name: ENABLE_SEARCH_QUERY_GENERATION
                value: "true"
              - name: WEB_SEARCH_ENGINE
                value: searxng
              - name: SEARXNG_QUERY_URL
                value: http://searxng.searxng.svc.cluster.local/search?q=<query>

              # Storage
              - name: STORAGE_PROVIDER
                value: s3
              - name: S3_ACCESS_KEY_ID
                valueFrom:
                  secretKeyRef:
                    name: openwebui-bucket
                    key: AWS_ACCESS_KEY_ID
              - name: S3_SECRET_ACCESS_KEY
                valueFrom:
                  secretKeyRef:
                    name: openwebui-bucket
                    key: AWS_SECRET_ACCESS_KEY
              - name: S3_BUCKET_NAME
                valueFrom:
                  configMapKeyRef:
                    name: openwebui-bucket
                    key: BUCKET_NAME
              - name: S3_ENDPOINT_HOST
                valueFrom:
                  configMapKeyRef:
                    name: openwebui-bucket
                    key: BUCKET_HOST
              - name: S3_ENDPOINT_URL
                value: http://$(S3_ENDPOINT_HOST):80

              # Vector Database
              - name: VECTOR_DB
                value: pgvector

              - name: REQUESTS_CA_BUNDLE
                value: /etc/ssl/certs/ca-certificates.crt
            envFrom:
              - secretRef:
                  name: openwebui-secret-env
            ports:
              - containerPort: 8080
                name: http
                protocol: TCP
            resources:
              requests:
                cpu: 50m
                memory: 2Gi
              limits:
                memory: 2Gi

    service:
      main:
        controller: main
        annotations:
          netbird.io/expose: "true"
        ports:
          http:
            port: 80
            targetPort: http

    route:
      main:
        hostnames:
          - openwebui.${INTERNAL_DOMAIN}
        parentRefs:
          - name: envoy-internal
            namespace: envoy
        rules:
          - backendRefs:
              - identifier: main
                port: http

    persistence:
      cache:
        enabled: true
        type: emptyDir
        globalMounts:
          - path: /app/backend/data/cache
