apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: openwebui
  namespace: openwebui
spec:
  interval: 1h
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  chart:
    spec:
      chart: app-template
      version: 5.1.x
      interval: 24h
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  # dependsOn:
  #   - name: ollama
  values:
    controllers:
      main:
        strategy: RollingUpdate
        replicas: 2
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          main:
            image:
              repository: ghcr.io/open-webui/open-webui
              tag: v0.11.1@sha256:6bb1fbe8ab0a3e0456067f493044ffb66a30a65a34be47f6a5862176a370dd16
            env:
              - name: ENABLE_WEBSOCKET_SUPPORT
                value: "true"
              - name: WEBSOCKET_MANAGER
                value: redis

              - name: WEBUI_URL
                value: https://openwebui.${EXTERNAL_DOMAIN}

              # OAuth
              - name: OPENID_PROVIDER_URL
                value: https://authentik.${EXTERNAL_DOMAIN}/application/o/open-web-ui/.well-known/openid-configuration
              - name: OPENID_REDIRECT_URI
                value: https://openwebui.${EXTERNAL_DOMAIN}/oauth/oidc/callback
              - name: OAUTH_SCOPES
                value: openid email profile
              - name: OAUTH_PROVIDER_NAME
                value: Authentik
              - name: OAUTH_MERGE_ACCOUNTS_BY_EMAIL
                value: "true"
              - name: ENABLE_OAUTH_SIGNUP
                value: "true"
              - name: ENABLE_LOGIN_FORM
                value: "false"

              # Forward user info to LiteLLM for per-user usage tracking
              - name: ENABLE_FORWARD_USER_INFO_HEADERS
                value: "true"

              # TTS
              - name: AUDIO_TTS_ENGINE
                value: openai
              - name: AUDIO_TTS_OPENAI_API_BASE_URL
                value: &litellm http://litellm.litellm.svc.cluster.local:4000/v1
              - name: AUDIO_TTS_MODEL
                value: tts
              - name: AUDIO_TTS_VOICE
                value: nova

              # STT
              - name: AUDIO_STT_ENGINE
                value: openai
              - name: AUDIO_STT_OPENAI_API_BASE_URL
                value: *litellm
              - name: AUDIO_STT_MODEL
                value: stt

              # Image
              - name: ENABLE_CHAT_RESPONSE_BASE64_IMAGE_URL_CONVERSION
                value: "true"

              - name: ENABLE_IMAGE_GENERATION
                value: "true"
              - name: IMAGE_GENERATION_ENGINE
                value: &image-engine openai
              - name: IMAGE_GENERATION_MODEL
                value: &image-model image
              - name: IMAGE_SIZE
                value: &image-size auto
              - name: IMAGE_AUTO_SIZE_MODELS_REGEX_PATTERN
                value: ^image
              - name: IMAGES_OPENAI_API_BASE_URL
                value: *litellm
              - name: ENABLE_IMAGE_EDIT
                value: "true"
              - name: IMAGE_EDIT_ENGINE
                value: *image-engine
              - name: IMAGE_EDIT_MODEL
                value: *image-model
              - name: IMAGES_EDIT_OPENAI_API_BASE_URL
                value: *litellm
              - name: IMAGE_EDIT_SIZE
                value: *image-size

              # Search Engine
              - name: ENABLE_WEB_SEARCH
                value: "true"
              - name: ENABLE_SEARCH_QUERY_GENERATION
                value: "true"
              - name: WEB_SEARCH_ENGINE
                value: searxng
              - name: SEARXNG_QUERY_URL
                value: http://searxng.searxng.svc.cluster.local/search?q=<query>

              # Content Extraction
              - name: CONTENT_EXTRACTION_ENGINE
                value: tika
              - name: TIKA_SERVER_URL
                value: http://tika.tika.svc.cluster.local

              # RAG
              - name: RAG_EMBEDDING_ENGINE
                value: openai
              - name: RAG_EMBEDDING_MODEL
                value: text-embedding-3
              - name: RAG_OPENAI_API_BASE_URL
                value: *litellm

              - name: USER_AGENT
                value: OpenWebUI/1.0

              # Storage
              - name: STORAGE_PROVIDER
                value: s3
              - name: S3_ACCESS_KEY_ID
                valueFrom:
                  secretKeyRef:
                    name: openwebui-bucket
                    key: AWS_ACCESS_KEY_ID
              - name: S3_SECRET_ACCESS_KEY
                valueFrom:
                  secretKeyRef:
                    name: openwebui-bucket
                    key: AWS_SECRET_ACCESS_KEY
              - name: S3_BUCKET_NAME
                valueFrom:
                  configMapKeyRef:
                    name: openwebui-bucket
                    key: BUCKET_NAME
              - name: S3_ENDPOINT_HOST
                valueFrom:
                  configMapKeyRef:
                    name: openwebui-bucket
                    key: BUCKET_HOST
              - name: S3_ENDPOINT_URL
                value: http://$(S3_ENDPOINT_HOST):80

              # Vector Database
              - name: VECTOR_DB
                value: pgvector

              - name: REQUESTS_CA_BUNDLE
                value: /etc/ssl/certs/ca-certificates.crt
            envFrom:
              - secretRef:
                  name: openwebui-secret-env
            ports:
              - containerPort: 8080
                name: http
                protocol: TCP
            probes:
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: http
                  periodSeconds: 5
                  failureThreshold: 60
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health/db
                    port: http
                  periodSeconds: 10
                  failureThreshold: 1
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: http
                  periodSeconds: 10
                  failureThreshold: 3
            resources:
              requests:
                cpu: 50m
                memory: &memory 1Gi
              limits:
                memory: *memory
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: false
              capabilities:
                drop: ["ALL"]

    service:
      main:
        controller: main
        ports:
          http:
            port: 80
            targetPort: http

    route:
      main:
        hostnames:
          - openwebui.${INTERNAL_DOMAIN}
        parentRefs:
          - name: envoy-internal
            namespace: envoy
        rules:
          - backendRefs:
              - identifier: main
                port: http

    persistence:
      cache:
        enabled: true
        type: emptyDir
        globalMounts:
          - path: /app/backend/data/cache
