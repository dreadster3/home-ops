apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: openwebui-postgres
  namespace: openwebui
spec:
  secretStoreRef:
    name: infisical
    kind: ClusterSecretStore
  target:
    name: openwebui-cluster-credentials
    creationPolicy: Owner
    template:
      metadata:
        labels:
          cnpg.io/reload: "true"
  data:
    - secretKey: username
      remoteRef:
        key: /openwebui/POSTGRES_USERNAME
    - secretKey: password
      remoteRef:
        key: /openwebui/POSTGRES_PASSWORD
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: openwebui-backup-s3-account
  namespace: openwebui
spec:
  secretStoreRef:
    name: infisical
    kind: ClusterSecretStore
  target:
    name: openwebui-backup-s3-account
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        ACCESS_KEY: "{{ .access_key }}"
        SECRET_KEY: "{{ .secret_key }}"
  data:
    - secretKey: access_key
      remoteRef:
        key: /openwebui/BACKUP_S3_ACCESS_KEY
    - secretKey: secret_key
      remoteRef:
        key: /openwebui/BACKUP_S3_SECRET_KEY
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: openwebui-dragonfly
  namespace: openwebui
spec:
  secretStoreRef:
    name: infisical
    kind: ClusterSecretStore
  target:
    name: openwebui-dragonfly-credentials
    creationPolicy: Owner
  data:
    - secretKey: DRAGONFLY_PASSWORD
      remoteRef:
        key: /openwebui/DRAGONFLY_PASSWORD
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: openwebui-secret-env
  namespace: openwebui
spec:
  secretStoreRef:
    name: infisical
    kind: ClusterSecretStore
  target:
    name: openwebui-secret-env
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        DATABASE_URL: postgresql://{{ .pg_username }}:{{ .pg_password }}@openwebui-cluster-rw:5432/openwebui
        PGVECTOR_DB_URL: postgresql://{{ .pg_username }}:{{ .pg_password }}@openwebui-cluster-rw:5432/openwebui
        REDIS_URL: redis://:{{.redis_password}}@openwebui-dragonfly:6379/0
        WEBSOCKET_REDIS_URL: redis://:{{.redis_password}}@openwebui-dragonfly:6379/1
        WEBUI_SECRET_KEY: "{{ .token }}"
        OAUTH_CLIENT_ID: "{{ .client_id }}"
        OAUTH_CLIENT_SECRET: "{{ .client_secret }}"

        RAG_OPENAI_API_KEY: "{{ .litellm_api_key }}"
        IMAGES_OPENAI_API_KEY: "{{ .litellm_api_key }}"
        IMAGES_EDIT_OPENAI_API_KEY: "{{ .litellm_api_key }}"
        AUDIO_TTS_OPENAI_API_KEY: "{{ .litellm_api_key }}"
        AUDIO_STT_OPENAI_API_KEY: "{{ .litellm_api_key }}"

        N8N_BASIC_AUTH_USER: "{{ .n8n_username }}"
        N8N_BASIC_AUTH_PASSWORD: "{{ .n8n_password }}"
  data:
    - secretKey: pg_username
      remoteRef:
        key: /openwebui/POSTGRES_USERNAME
    - secretKey: pg_password
      remoteRef:
        key: /openwebui/POSTGRES_PASSWORD
    - secretKey: redis_password
      remoteRef:
        key: /openwebui/DRAGONFLY_PASSWORD
    - secretKey: token
      remoteRef:
        key: /openwebui/SECRET_TOKEN
    - secretKey: client_id
      remoteRef:
        key: /openwebui/OIDC_CLIENT_ID
    - secretKey: client_secret
      remoteRef:
        key: /openwebui/OIDC_CLIENT_SECRET
    - secretKey: litellm_api_key
      remoteRef:
        key: /openwebui/LITELLM_API_KEY
    - secretKey: n8n_username
      remoteRef:
        key: /openwebui/N8N_USERNAME
    - secretKey: n8n_password
      remoteRef:
        key: /openwebui/N8N_PASSWORD
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: openwebui-sync-s3-credentials
  namespace: openwebui
spec:
  secretStoreRef:
    name: infisical
    kind: ClusterSecretStore
  target:
    name: openwebui-sync-s3-credentials
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        RCLONE_CONFIG_DST_ACCESS_KEY_ID: "{{ .access_key }}"
        RCLONE_CONFIG_DST_SECRET_ACCESS_KEY: "{{ .secret_key }}"
  data:
    - secretKey: access_key
      remoteRef:
        key: /openwebui/BACKUP_S3_ACCESS_KEY
    - secretKey: secret_key
      remoteRef:
        key: /openwebui/BACKUP_S3_SECRET_KEY
