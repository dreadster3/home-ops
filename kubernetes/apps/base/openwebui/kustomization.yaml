apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: &app openwebui

labels:
  - pairs:
      app.kubernetes.io/module: *app

configMapGenerator:
  - name: openwebui-sync-script
    options:
      disableNameSuffixHash: true
      labels:
        kustomize.toolkit.fluxcd.io/substitute: disabled
    files:
      - scripts/sync.sh

resources:
  - namespace.yaml
  - bucket.yaml
  - store.yaml
  - pgcluster.yaml
  - database.yaml
  - secrets.yaml
  - dragonfly.yaml
  # - ollama.yaml
  - cronjob.yaml
  - helm.yaml
  - network.yaml
