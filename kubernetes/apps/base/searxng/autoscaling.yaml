apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: searxng
  namespace: searxng
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: searxng
  minReplicaCount: 0
  maxReplicaCount: 1
  cooldownPeriod: 300
  advanced:
    restoreToOriginalReplicaCount: false
  triggers:
    - type: cron
      metadata:
        timezone: Etc/UTC
        start: "0 7 * * *"
        end: "0 23 * * *"
        desiredReplicas: "1"