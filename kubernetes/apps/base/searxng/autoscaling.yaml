---
# Routes searxng traffic through the KEDA HTTP add-on interceptor, which counts
# requests and holds them while the deployment scales up from zero. The
# HTTPRoute backendRefs point at the interceptor proxy (gateway.networking.k8s.io
# ReferenceGrant in the keda namespace); in-cluster callers go through the
# searxng-proxy ExternalName Service. Host headers are matched with the port
# stripped, so the bare service DNS names cover :80/:8080 callers.
apiVersion: http.keda.sh/v1beta1
kind: InterceptorRoute
metadata:
  name: searxng
  namespace: searxng
spec:
  target:
    service: searxng
    port: 80
  rules:
    - hosts:
        - searxng.${INTERNAL_DOMAIN}
        - searxng-proxy
        - searxng-proxy.searxng.svc.cluster.local
  scalingMetric:
    concurrency:
      targetValue: 100
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: searxng
  namespace: searxng
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: searxng
  minReplicaCount: 0
  maxReplicaCount: 1
  cooldownPeriod: 300
  advanced:
    restoreToOriginalReplicaCount: false
  triggers:
    - type: external-push
      metadata:
        scalerAddress: keda-add-ons-http-external-scaler.keda:9090
        interceptorRoute: searxng