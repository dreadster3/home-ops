apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: langfuse-postgres
  namespace: langfuse
spec:
  secretStoreRef:
    name: infisical
    kind: ClusterSecretStore
  target:
    name: langfuse-cluster-credentials
    creationPolicy: Owner
    template:
      metadata:
        labels:
          cnpg.io/reload: "true"
  data:
    - secretKey: username
      remoteRef:
        key: /langfuse/POSTGRES_USERNAME
    - secretKey: password
      remoteRef:
        key: /langfuse/POSTGRES_PASSWORD
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: langfuse-backup-s3-account
  namespace: langfuse
spec:
  secretStoreRef:
    name: infisical
    kind: ClusterSecretStore
  target:
    name: langfuse-backup-s3-account
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        ACCESS_KEY: "{{ .access_key }}"
        SECRET_KEY: "{{ .secret_key }}"
  data:
    - secretKey: access_key
      remoteRef:
        key: /langfuse/BACKUP_S3_ACCESS_KEY
    - secretKey: secret_key
      remoteRef:
        key: /langfuse/BACKUP_S3_SECRET_KEY
---
