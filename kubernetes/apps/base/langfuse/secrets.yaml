---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: langfuse-secret-env
  namespace: langfuse
spec:
  secretStoreRef:
    name: infisical
    kind: ClusterSecretStore
  target:
    name: langfuse-oidc
    creationPolicy: Owner
  data:
    - secretKey: OIDC_CLIENT_ID
      remoteRef:
        key: /langfuse/OIDC_CLIENT_ID
