---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: langfuse-secret-env
  namespace: langfuse
spec:
  secretStoreRef:
    name: infisical
    kind: ClusterSecretStore
  target:
    name: langfuse-secret-env
    creationPolicy: Owner
