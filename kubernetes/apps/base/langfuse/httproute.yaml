apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: langfuse
  namespace: langfuse
spec:
  parentRefs:
    - name: envoy-internal
      namespace: envoy
  hostnames:
    - langfuse.${INTERNAL_DOMAIN}
  rules:
    - backendRefs:
        - name: langfuse-web
          port: 3000