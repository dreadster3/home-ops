apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: langfuse
  namespace: langfuse
spec:
  interval: 24h
  url: https://langfuse.github.io/langfuse-k8s
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: langfuse
  namespace: langfuse
spec:
  interval: 1h
  timeout: 10m
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  chart:
    spec:
      chart: langfuse
      version: 2.*.*
      interval: 24h
      sourceRef:
        kind: HelmRepository
        name: langfuse
  valuesFrom:
    - kind: ConfigMap
      name: langfuse-bucket
      valuesKey: BUCKET_NAME
      targetPath: s3.bucket
  values:
    # All datastores external: CNPG Postgres, in-namespace ClickHouse
    # (upstream operator), shared Dragonfly, Ceph RGW S3.
    langfuse:
      pod:
        annotations:
          reloader.stakater.com/auto: "true"
      salt:
        secretKeyRef:
          name: langfuse-secret-env
          key: SALT
      encryptionKey:
        secretKeyRef:
          name: langfuse-secret-env
          key: ENCRYPTION_KEY
      nextauth:
        url: https://langfuse.${INTERNAL_DOMAIN}
        secret:
          secretKeyRef:
            name: langfuse-secret-env
            key: NEXTAUTH_SECRET
      auth:
        disableUsernamePassword: true
      smtp:
        connectionUrl: smtp://maddy.maddy.svc.cluster.local:25
        fromAddress: no-reply@${EXTERNAL_DOMAIN}
      additionalEnv:
        # Authentik SSO via the app's native provider. Chart 2.2.6's validations.yaml
        # allowlist rejects `auth.providers.authentik` (stale — the app supports it),
        # so wire AUTH_AUTHENTIK_* directly. Move back to auth.providers once fixed.
        - name: AUTH_AUTHENTIK_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: langfuse-oidc
              key: OIDC_CLIENT_ID
        - name: AUTH_AUTHENTIK_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: langfuse-oidc
              key: OIDC_CLIENT_SECRET
        - name: AUTH_AUTHENTIK_ISSUER
          value: https://authentik.${INTERNAL_DOMAIN}/application/o/langfuse/
        # S3 endpoint from the OBC-generated configmap (Rook fills per environment);
        # overrides the chart's empty endpoint when s3.deploy=false.
        # $(S3_ENDPOINT_HOST) expands from the env entry above — keep the order.
        - name: S3_ENDPOINT_HOST
          valueFrom:
            configMapKeyRef:
              name: langfuse-bucket
              key: BUCKET_HOST
        - name: LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT
          value: http://$(S3_ENDPOINT_HOST)
        - name: LANGFUSE_S3_BATCH_EXPORT_ENDPOINT
          value: http://$(S3_ENDPOINT_HOST)
        - name: LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT
          value: http://$(S3_ENDPOINT_HOST)

      web:
        replicas: 2
        resources:
          requests:
            cpu: 100m
            memory: &memory 1.5Gi
          limits:
            memory: *memory

      worker:
        replicas: 1
        resources:
          requests:
            cpu: 100m
            memory: &memory 512Mi
          limits:
            memory: *memory

    # --- Postgres: external CloudNativePG cluster ---
    postgresql:
      deploy: false
      host: langfuse-cluster-rw
      auth:
        existingSecret: langfuse-cluster-credentials
        secretKeys:
          adminPasswordKey: password
          userPasswordKey: password

    # --- ClickHouse: upstream operator, single node, in-namespace ---
    clickhouse:
      deploy: true
      crdCheck: false
      auth:
        existingSecret: langfuse-clickhouse-auth
        existingSecretKey: password
      cluster:
        replicas: 1
        storage:
          size: 20Gi
          className: ceph-block
        resources:
          requests:
            cpu: 250m
            memory: &memory 1Gi
          limits:
            memory: *memory
      keeper:
        replicas: 1
        storage:
          size: 2Gi
          className: ceph-block
        resources:
          requests:
            cpu: 100m
            memory: &memory 256Mi
          limits:
            memory: *memory

    # --- Redis: shared centralized Dragonfly (dragonfly namespace), DB index 12 ---
    redis:
      deploy: false
      host: dragonfly.dragonfly.svc.cluster.local
      port: 6379
      auth:
        existingSecret: langfuse-dragonfly-credentials
        existingSecretPasswordKey: DRAGONFLY_PASSWORD
        database: 12

    # --- S3: external Ceph RGW (Rook) via ObjectBucketClaim ---
    # Credentials and endpoint come from the OBC-generated secret/configmap;
    # the endpoint is patched per environment (see dev/prd overlays).
    s3:
      deploy: false
      forcePathStyle: true
      accessKeyId:
        secretKeyRef:
          name: langfuse-bucket
          key: AWS_ACCESS_KEY_ID
      secretAccessKey:
        secretKeyRef:
          name: langfuse-bucket
          key: AWS_SECRET_ACCESS_KEY
      eventUpload:
        prefix: "events/"
      batchExport:
        prefix: "exports/"
      mediaUpload:
        prefix: "media/"
