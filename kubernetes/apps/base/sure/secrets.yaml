apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: sure-postgres
  namespace: sure
spec:
  secretStoreRef:
    name: infisical
    kind: ClusterSecretStore
  target:
    name: sure-cluster-credentials
    creationPolicy: Owner
    template:
      metadata:
        labels:
          cnpg.io/reload: "true"
  data:
    - secretKey: username
      remoteRef:
        key: /sure/POSTGRES_USERNAME
    - secretKey: password
      remoteRef:
        key: /sure/POSTGRES_PASSWORD
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: sure-dragonfly
  namespace: sure
spec:
  secretStoreRef:
    name: infisical
    kind: ClusterSecretStore
  target:
    name: sure-dragonfly-credentials
    creationPolicy: Owner
  data:
    - secretKey: DRAGONFLY_PASSWORD
      remoteRef:
        key: /sure/DRAGONFLY_PASSWORD
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: sure-backup-s3-account
  namespace: sure
spec:
  secretStoreRef:
    name: infisical
    kind: ClusterSecretStore
  target:
    name: sure-backup-s3-account
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        ACCESS_KEY: "{{ .access_key }}"
        SECRET_KEY: "{{ .secret_key }}"
  data:
    - secretKey: access_key
      remoteRef:
        key: /sure/BACKUP_S3_ACCESS_KEY
    - secretKey: secret_key
      remoteRef:
        key: /sure/BACKUP_S3_SECRET_KEY
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: sure-secret-env
  namespace: sure
spec:
  secretStoreRef:
    name: infisical
    kind: ClusterSecretStore
  target:
    name: sure-secret-env
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        # SECRET_KEY_BASE is read by the chart via secretKeyRef from existingSecret
        SECRET_KEY_BASE: "{{ .secret_key_base }}"
        # DATABASE_URL / REDIS_URL — injected via rails.extraEnvVars secretKeyRef.
        # Passwords embedded directly so K8s does not need $(VAR) expansion ordering.
        DATABASE_URL: "postgresql://{{ .dbuser }}:{{ .dbpass }}@sure-cluster-rw:5432/sure"
        REDIS_URL: "redis://:{{ .redis_password }}@sure-dragonfly:6379/1"
        # OIDC (Authentik) — used in production; dev overlay disables OIDC.
        # Optional refs below let dev sync even when Infisical has no OIDC keys.
        OIDC_CLIENT_ID: "{{ .oidc_client_id }}"
        OIDC_CLIENT_SECRET: "{{ .oidc_client_secret }}"
        OIDC_ISSUER: "https://authentik.${EXTERNAL_DOMAIN}/application/o/sure"
        OIDC_REDIRECT_URI: "https://sure.${EXTERNAL_DOMAIN}/auth/openid_connect/callback"
  data:
    - secretKey: secret_key_base
      remoteRef:
        key: /sure/SECRET_KEY_BASE
    - secretKey: dbuser
      remoteRef:
        key: /sure/POSTGRES_USERNAME
    - secretKey: dbpass
      remoteRef:
        key: /sure/POSTGRES_PASSWORD
    - secretKey: redis_password
      remoteRef:
        key: /sure/DRAGONFLY_PASSWORD
    - secretKey: oidc_client_id
      remoteRef:
        key: /sure/OIDC_CLIENT_ID
    - secretKey: oidc_client_secret
      remoteRef:
        key: /sure/OIDC_CLIENT_SECRET
