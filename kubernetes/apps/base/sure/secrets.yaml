apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: sure-postgres
  namespace: sure
spec:
  secretStoreRef:
    name: infisical
    kind: ClusterSecretStore
  target:
    name: sure-cluster-credentials
    creationPolicy: Owner
    template:
      metadata:
        labels:
          cnpg.io/reload: "true"
  data:
    - secretKey: username
      remoteRef:
        key: /sure/POSTGRES_USERNAME
    - secretKey: password
      remoteRef:
        key: /sure/POSTGRES_PASSWORD
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: sure-dragonfly
  namespace: sure
spec:
  secretStoreRef:
    name: infisical
    kind: ClusterSecretStore
  target:
    name: sure-dragonfly-credentials
    creationPolicy: Owner
  data:
    - secretKey: DRAGONFLY_PASSWORD
      remoteRef:
        key: /sure/DRAGONFLY_PASSWORD
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: sure-backup-s3-account
  namespace: sure
spec:
  secretStoreRef:
    name: infisical
    kind: ClusterSecretStore
  target:
    name: sure-backup-s3-account
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        ACCESS_KEY: "{{ .access_key }}"
        SECRET_KEY: "{{ .secret_key }}"
  data:
    - secretKey: access_key
      remoteRef:
        key: /sure/BACKUP_S3_ACCESS_KEY
    - secretKey: secret_key
      remoteRef:
        key: /sure/BACKUP_S3_SECRET_KEY
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: sure-secret-env
  namespace: sure
spec:
  secretStoreRef:
    name: infisical
    kind: ClusterSecretStore
  target:
    name: sure-secret-env
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        SECRET_KEY_BASE: "{{ .secret_key_base }}"
        DATABASE_URL: "postgresql://{{ .dbuser }}:{{ .dbpass }}@sure-cluster-rw:5432/sure"
        REDIS_URL: "redis://:{{ .redis_password }}@sure-dragonfly:6379/0"
        ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY: "{{ .active_record_encryption_primary_key }}"
        ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY: "{{ .active_record_encryption_deterministic_key }}"
        ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT: "{{ .active_record_encryption_key_derivation_salt }}"
        OPENAI_ACCESS_TOKEN: "{{ .litellm_api_key }}"
  data:
    - secretKey: secret_key_base
      remoteRef:
        key: /sure/SECRET_KEY_BASE
    - secretKey: dbuser
      remoteRef:
        key: /sure/POSTGRES_USERNAME
    - secretKey: dbpass
      remoteRef:
        key: /sure/POSTGRES_PASSWORD
    - secretKey: redis_password
      remoteRef:
        key: /sure/DRAGONFLY_PASSWORD
    - secretKey: oidc_client_id
      remoteRef:
        key: /sure/OIDC_CLIENT_ID
    - secretKey: oidc_client_secret
      remoteRef:
        key: /sure/OIDC_CLIENT_SECRET
    - secretKey: active_record_encryption_primary_key
      remoteRef:
        key: /sure/ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY
    - secretKey: active_record_encryption_deterministic_key
      remoteRef:
        key: /sure/ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY
    - secretKey: active_record_encryption_key_derivation_salt
      remoteRef:
        key: /sure/ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT
    - secretKey: litellm_api_key
      remoteRef:
        key: /sure/LITELLM_API_KEY
