---
# Routes tika traffic through the KEDA HTTP add-on interceptor, which counts
# requests and holds them while the deployment scales up from zero. In-cluster
# consumers reach tika via the tika-proxy ExternalName Service, which resolves
# to the interceptor proxy; the Host header they send must be listed in
# spec.rules[].hosts (ports are stripped from Host before matching).
apiVersion: http.keda.sh/v1beta1
kind: InterceptorRoute
metadata:
  name: tika
  namespace: tika
spec:
  target:
    service: tika
    port: 80
  rules:
    - hosts:
        - tika-proxy
        - tika-proxy.tika.svc.cluster.local
  scalingMetric:
    concurrency:
      targetValue: 100
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: tika
  namespace: tika
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: tika
  minReplicaCount: 0
  maxReplicaCount: 1
  cooldownPeriod: 300
  advanced:
    restoreToOriginalReplicaCount: false
  triggers:
    - type: external-push
      metadata:
        scalerAddress: keda-add-ons-http-external-scaler.keda:9090
        interceptorRoute: tika