apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: hindsight-helm
  namespace: hindsight
spec:
  interval: 24h
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
  ref:
    tag: 1.2.0
    digest: sha256:9c6081902317a1f9ac86f79c56319373bc1e358caa67b5e7df37e119317660aa
  url: oci://ghcr.io/vectorize-io/charts/hindsight
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: hindsight
  namespace: hindsight
spec:
  interval: 1h
  timeout: 20m
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  chartRef:
    kind: OCIRepository
    name: hindsight-helm
    namespace: hindsight
  values:
    podAnnotations:
      reloader.stakater.com/auto: "true"

    api:
      replicaCount: 2
      image: &image
        repository: ghcr.io/dreadster3/hindsight-hybrid-authentication
        tag: v1.2.0@sha256:d25e3ec9f97daab295f350c85819e81f3fa8622a1da0c7bf0a7ab7881735b910
      env:
        HINDSIGHT_API_TENANT_OAUTH_ENABLED: true
        HINDSIGHT_API_TENANT_OAUTH_ISSUER: https://authentik.${EXTERNAL_DOMAIN}/application/o/hindsight/
        HINDSIGHT_API_MCP_STATELESS: true
        HINDSIGHT_API_LLM_OUTPUT_LANGUAGE: english

        HINDSIGHT_API_LLM_BASE_URL: &api http://litellm.litellm.svc.cluster.local:4000/v1
        HINDSIGHT_API_LITELLM_API_BASE: &url http://litellm.litellm.svc.cluster.local:4000

        # Models are Hindsight LANE names, sent to the litellm proxy. Hindsight runs the
        # litellm SDK in-process, so the prefix must resolve to a backend that honors
        # api_base/api_key — 'openai' does (plain POST to the proxy); native backends
        # like 'minimax/' bypass api_base and hit api.minimax.io with the proxy token
        # (401). The 'openai/<name>' strings are mapped to the bare model groups by
        # team aliases inside litellm (openai/<name> -> <name> -> model_group_alias).
        HINDSIGHT_API_LLM_PROVIDER: &provider litellm
        HINDSIGHT_API_LLM_MODEL: openai/minimax-m3.1-flash
        HINDSIGHT_API_RETAIN_LLM_PROVIDER: *provider
        HINDSIGHT_API_RETAIN_LLM_MODEL: openai/minimax-m3.1-flash
        HINDSIGHT_API_CONSOLIDATION_LLM_PROVIDER: *provider
        HINDSIGHT_API_CONSOLIDATION_LLM_MODEL: openai/minimax-m3.1-flash
        HINDSIGHT_API_REFLECT_LLM_PROVIDER: *provider
        HINDSIGHT_API_REFLECT_LLM_MODEL: openai/glm-5.3-flash
        HINDSIGHT_API_MENTAL_MODEL_REFRESH_LLM_PROVIDER: *provider
        HINDSIGHT_API_MENTAL_MODEL_REFRESH_LLM_BASE_URL: *api
        HINDSIGHT_API_MENTAL_MODEL_REFRESH_LLM_MODEL: openai/gpt-6-luna
        HINDSIGHT_API_DECISION_MODEL_PROVIDER: typesafe
        HINDSIGHT_API_DECISION_MODEL_MODEL: clef
        HINDSIGHT_API_DECISION_MODEL_BASE_URL: *url

        # Auth: shared bearer key guarding the API + MCP endpoints (from
        # Infisical via hindsight-secret-env).
        HINDSIGHT_API_TENANT_EXTENSION: hindsight_ext_hybrid_tenant:HybridTenantExtension
        # Vector index on VectorChord — qwen3-embedding-8b is 4096 dims, past
        # pgvector's 2000-dim HNSW limit (see pgcluster.yaml extension image).
        HINDSIGHT_API_VECTOR_EXTENSION: vchord

        # Embeddings: qwen3-embedding-8b via litellm's dedicated proxy provider
        # (EMBEDDINGS_LITELLM_API_BASE is the proxy root, no /v1 suffix)
        HINDSIGHT_API_EMBEDDINGS_PROVIDER: *provider
        HINDSIGHT_API_EMBEDDINGS_LITELLM_API_BASE: *url
        HINDSIGHT_API_EMBEDDINGS_LITELLM_MODEL: qwen3-embedding-8b
        # Rerank via litellm (cohere-compatible /rerank against the proxy;
        # model 'rerank-2.5-lite' passthroughs to OpenRouter's voyage model)
        HINDSIGHT_API_RERANKER_PROVIDER: *provider
        HINDSIGHT_API_RERANKER_LITELLM_API_BASE: *url
        HINDSIGHT_API_RERANKER_LITELLM_MODEL: rerank-2.5-lite
      # No resource requests/limits — krr will measure usage and fill in later
      resources:
        requests:
          cpu: 1.2
          memory: &memory 1Gi
        limits:
          memory: *memory
      # Chart-managed PVC for the Hugging Face model cache (embedder + reranker)
      persistence:
        modelCache:
          enabled: true
          size: 3Gi
          accessModes:
            - ReadWriteMany
          storageClass: ceph-filesystem

    # Dedicated workers (StatefulSet): HINDSIGHT_API_WORKER_ID comes from the
    # stable pod name; the api container's in-process worker is disabled by
    # the chart. api.env above is inherited by workers. Each worker holds a
    # PVC because it loads the same embedder/reranker models as the api.
    worker:
      enabled: true
      replicaCount: 1
      image: *image
      # No resource requests/limits — krr will measure usage and fill in later
      resources:
        requests:
          cpu: 10m
          memory: &memory 1Gi
        limits:
          memory: *memory
      persistence:
        modelCache:
          enabled: true
          size: 3Gi
          storageClass: ceph-block

    controlPlane:
      replicaCount: 1
      image:
        repository: ghcr.io/vectorize-io/hindsight-control-plane
        tag: 1.2.0@sha256:f518803353d16e870aee930382e2eaaae965e649adba90a0b57fa4dc93bfd9a1
      # No resource requests/limits — krr will measure usage and fill in later
      resources:
        requests:
          cpu: 100m
          memory: &memory 256Mi
        limits:
          memory: *memory

    # All keys of this secret are injected as env into the api container
    # (existingSecret contract: postgres-password is required, others pass through)
    existingSecret: hindsight-secret-env

    # Use the external CloudNativePG cluster instead of bundled PostgreSQL
    postgresql:
      enabled: false
      external:
        host: hindsight-cluster-rw
        port: 5432
        database: hindsight
        username: hindsight

    ingress:
      enabled: false
