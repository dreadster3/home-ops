apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hindsight-postgres
  namespace: hindsight
spec:
  secretStoreRef:
    name: infisical
    kind: ClusterSecretStore
  target:
    name: hindsight-cluster-credentials
    creationPolicy: Owner
    template:
      metadata:
        labels:
          cnpg.io/reload: "true"
  data:
    - secretKey: username
      remoteRef:
        key: /hindsight/POSTGRES_USERNAME
    - secretKey: password
      remoteRef:
        key: /hindsight/POSTGRES_PASSWORD
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hindsight-backup-s3-account
  namespace: hindsight
spec:
  secretStoreRef:
    name: infisical
    kind: ClusterSecretStore
  target:
    name: hindsight-backup-s3-account
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        ACCESS_KEY: "{{ .access_key }}"
        SECRET_KEY: "{{ .secret_key }}"
  data:
    - secretKey: access_key
      remoteRef:
        key: /hindsight/BACKUP_S3_ACCESS_KEY
    - secretKey: secret_key
      remoteRef:
        key: /hindsight/BACKUP_S3_SECRET_KEY
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hindsight-secret-env
  namespace: hindsight
spec:
  secretStoreRef:
    name: infisical
    kind: ClusterSecretStore
  target:
    name: hindsight-secret-env
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        postgres-password: "{{ .pg_password }}"
        HINDSIGHT_API_LLM_API_KEY: "{{ .litellm_api_key }}"
        HINDSIGHT_API_EMBEDDINGS_LITELLM_API_KEY: "{{ .litellm_api_key }}"
        HINDSIGHT_API_RERANKER_LITELLM_API_KEY: "{{ .litellm_api_key }}"
        HINDSIGHT_API_TENANT_USERS: "dreadster:{{.tenant_api_key}}"
        HINDSIGHT_API_TENANT_OAUTH_AUDIENCE: "{{ .oidc_client_id }}"
        HINDSIGHT_CP_DATAPLANE_API_KEY: "{{ .tenant_api_key }}"
  data:
    - secretKey: pg_password
      remoteRef:
        key: /hindsight/POSTGRES_PASSWORD
    - secretKey: litellm_api_key
      remoteRef:
        key: /hindsight/LITELLM_API_KEY
    - secretKey: tenant_api_key
      remoteRef:
        key: /hindsight/TENANT_API_KEY
    - secretKey: oidc_client_id
      remoteRef:
        key: /hindsight/OIDC_CLIENT_ID
