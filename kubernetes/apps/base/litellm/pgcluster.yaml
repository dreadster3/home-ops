apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: litellm-cluster
  namespace: litellm
  annotations:
    cnpg.io/skipEmptyWalArchiveCheck: "disabled"
spec:
  imageName: ghcr.io/cloudnative-pg/postgresql:18.4-standard-trixie
  instances: 2
  primaryUpdateStrategy: unsupervised
  affinity:
    podAntiAffinityType: required
  storage:
    storageClass: ceph-block
    size: 5Gi

  bootstrap:
    # recovery:
    #   source: backup
    #   database: litellm
    #   owner: litellm
    #   secret:
    #     name: litellm-cluster-credentials
    initdb:
      database: litellm
      owner: litellm
      secret:
        name: litellm-cluster-credentials

  externalClusters:
    - name: backup
      plugin:
        name: barman-cloud.cloudnative-pg.io
        parameters:
          barmanObjectName: backup-store
          serverName: litellm-cluster

  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: backup-store
        serverName: litellm-cluster

  resources:
    requests:
      cpu: 50m
      memory: &memory 384Mi
    limits:
      memory: *memory

  monitoring:
    enablePodMonitor: true
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: litellm-cluster-backup
  namespace: litellm
spec:
  cluster:
    name: litellm-cluster
  schedule: "0 0 0 * * *"
  backupOwnerReference: self
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io

