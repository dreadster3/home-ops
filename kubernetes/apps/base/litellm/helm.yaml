apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: litellm-helm
  namespace: litellm
spec:
  interval: 24h
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
  ref:
    tag: 1.92.0
  url: oci://ghcr.io/berriai/litellm-helm
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: litellm
  namespace: litellm
spec:
  interval: 1h
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  chartRef:
    kind: OCIRepository
    name: litellm-helm
    namespace: litellm
  values:
    replicaCount: 2
    strategy:
      type: RollingUpdate
    podAnnotations:
      reloader.stakater.com/auto: "true"

    image:
      repository: ghcr.io/berriai/litellm-database
      tag: v1.92.0@sha256:64d3547e0b131bf4638342e52c12bc46d6f1d9b8498e4b731ff31be5ab316ea9

    # Use external CloudNativePG — disable the bundled Bitnami postgres subchart
    db:
      useExisting: true
      deployStandalone: false
      endpoint: litellm-cluster-rw
      database: litellm
      secret:
        name: litellm-cluster-credentials
        usernameKey: username
        passwordKey: password

    # Use external Dragonfly — disable the bundled Redis subchart
    redis:
      enabled: false

    # We use Envoy Gateway HTTPRoute (see httproute.yaml) instead of Ingress
    ingress:
      enabled: false

    service:
      annotations:
        netbird.io/expose: "true"

    # One Uvicorn worker per pod — scale horizontally via replicas (Kubernetes recommendation)
    numWorkers: 1

    # Turn off FastAPI's default info logs (production best practice)
    logLevel: "ERROR"

    # Enable Prometheus ServiceMonitor for metrics scraping
    serviceMonitor:
      enabled: false

    # Inject master key, API keys, and Redis connection info as env vars
    environmentSecrets:
      - litellm-secret-env

    masterkeySecretName: litellm-secret-env
    masterkeySecretKey: PROXY_MASTER_KEY

    envVars:
      GENERIC_AUTHORIZATION_ENDPOINT: https://authentik.${EXTERNAL_DOMAIN}/application/o/authorize/
      GENERIC_TOKEN_ENDPOINT: https://authentik.${EXTERNAL_DOMAIN}/application/o/token/
      GENERIC_USERINFO_ENDPOINT: https://authentik.${EXTERNAL_DOMAIN}/application/o/userinfo/
      GENERIC_SCOPE: openid profile email litellm_role
      PROXY_BASE_URL: https://litellm.${INTERNAL_DOMAIN}
      PROXY_LOGOUT_URL: https://authentik.${EXTERNAL_DOMAIN}/application/o/litellm/end-session/
      GENERIC_ROLE_MAPPINGS_GROUP_CLAIM: groups
      GENERIC_ROLE_MAPPINGS_DEFAULT_ROLE: internal_user
      GENERIC_USER_FIRST_NAME_ATTRIBUTE: given_name
      GENERIC_USER_ID_ATTRIBUTE: sub
      GENERIC_USER_ROLE_ATTRIBUTE: litellm_role
      GENERIC_USER_EMAIL_ATTRIBUTE: email
      GENERIC_USER_DISPLAY_NAME_ATTRIBUTE: preferred_username
      AUTO_REDIRECT_UI_LOGIN_TO_SSO: true
      GITHUB_COPILOT_TOKEN_DIR: /data/github_copilot
      LITELLM_MODE: PRODUCTION
      SMTP_HOST: maddy.maddy.svc.cluster.local
      SMTP_PORT: 25
      SMTP_TLS: "False"
      SMTP_SENDER_EMAIL: no-reply@${EXTERNAL_DOMAIN}

    proxy_config:
      model_list:
        # ===== Image Generation =====
        - model_name: openai/gpt-image-2
          # from LiteLLM community map (gpt-image-2): text $5/M in / $10/M out, image $8/M in / $30/M out, $1.25/M cache_read; multimodal text+image input.
          # models.dev lists only the image output rate ($30/M); community map distinguishes text vs image output, used here.
          model_info:
            mode: image_generation
            supports_vision: true
            input_cost_per_token: 0.000005
            output_cost_per_token: 0.00001
            input_cost_per_image_token: 0.000008
            output_cost_per_image_token: 0.00003
            cache_read_input_token_cost: 0.00000125
            cache_creation_input_token_cost: 0.0
          litellm_params:
            model: openai/gpt-image-2
            api_key: os.environ/OPENAI_API_KEY

        - model_name: gemini/gemini-3.1-flash-image
          # GA model `gemini-3.1-flash-image` (Nano Banana 2). models.dev only has the older `-preview` (65k/65k, $0.5/$60); GA values from Google AI pricing: 131072 ctx / 32768 out, $0.25/M input, $1.50/M text out, $60/M image out, $0.045/image. Reasoning supported per Google docs. Cache not published → 0.
          model_info:
            mode: image_generation
            max_input_tokens: 131072
            max_output_tokens: 32768
            supports_vision: true
            supports_reasoning: true
            input_cost_per_token: 0.00000025
            output_cost_per_token: 0.0000015
            output_cost_per_image_token: 0.00006
            output_cost_per_image: 0.045
            input_cost_per_token_batches: 0.000000125
            output_cost_per_token_batches: 0.00000075
            cache_read_input_token_cost: 0.0
            cache_creation_input_token_cost: 0.0
          litellm_params:
            model: gemini/gemini-3.1-flash-image
            api_key: os.environ/GEMINI_API_KEY

        - model_name: gemini/gemini-3.1-flash-lite-image
          # from Google AI pricing (Flash Lite Image, not in LiteLLM community map): $0.25/M input, $1.50/M text out, $30/M image out (~$0.0336/1K image); 131072 ctx (est from sibling) / 32768 out
          model_info:
            mode: image_generation
            max_input_tokens: 131072
            max_output_tokens: 32768
            supports_vision: true
            input_cost_per_token: 0.00000025
            output_cost_per_token: 0.0000015
            output_cost_per_image_token: 0.00003
            output_cost_per_image: 0.0336
            input_cost_per_token_batches: 0.000000125
            output_cost_per_token_batches: 0.00000075
            cache_read_input_token_cost: 0.0
            cache_creation_input_token_cost: 0.0
          litellm_params:
            model: gemini/gemini-3.1-flash-lite-image
            api_key: os.environ/GEMINI_API_KEY

        # ===== Audio (TTS / STT) =====
        - model_name: openai/tts-1
          # from LiteLLM community map (tts-1): mode=audio_speech, $15 per 1M characters (input_cost_per_character); text->speech
          model_info:
            mode: audio_speech
            supports_vision: false
            supports_reasoning: false
            input_cost_per_character: 0.000015
            cache_read_input_token_cost: 0.0
            cache_creation_input_token_cost: 0.0
          litellm_params:
            model: openai/tts-1
            api_key: os.environ/OPENAI_API_KEY

        - model_name: openai/whisper-1
          # from LiteLLM community map (whisper-1): mode=audio_transcription, $0.006/min = $0.0001/second (input_cost_per_second); audio->text
          model_info:
            mode: audio_transcription
            supports_vision: false
            supports_reasoning: false
            input_cost_per_second: 0.0001
            output_cost_per_second: 0.0001
            cache_read_input_token_cost: 0.0
            cache_creation_input_token_cost: 0.0
          litellm_params:
            model: openai/whisper-1
            api_key: os.environ/OPENAI_API_KEY

        - model_name: deepgram/nova-2
          # from LiteLLM community map (deepgram/nova-2): mode=audio_transcription, $0.0043/min = $0.00007167/second (input_cost_per_second); audio->text
          model_info:
            mode: audio_transcription
            supports_vision: false
            supports_reasoning: false
            input_cost_per_second: 0.00007167
            output_cost_per_second: 0.0
            cache_read_input_token_cost: 0.0
            cache_creation_input_token_cost: 0.0
          litellm_params:
            model: deepgram/nova-2
            api_key: os.environ/DEEPGRAM_API_KEY

        # ===== Embeddings =====
        - model_name: openai/text-embedding-3-large
          # from OpenAI docs + LiteLLM community map (text-embedding-3-large): 8191 max input tokens, 3072-dim vectors, $0.13/M input tokens (batch $0.065/M); embeddings have no output/cache cost
          model_info:
            mode: embedding
            max_input_tokens: 8191
            max_tokens: 8191
            output_vector_size: 3072
            supports_vision: false
            supports_reasoning: false
            input_cost_per_token: 0.00000013
            input_cost_per_token_batches: 0.000000065
            output_cost_per_token: 0.0
            output_cost_per_token_batches: 0.0
            cache_read_input_token_cost: 0.0
            cache_creation_input_token_cost: 0.0
          litellm_params:
            model: openai/text-embedding-3-large
            api_key: os.environ/OPENAI_API_KEY

        - model_name: openai/text-embedding-3-small
          # from OpenAI docs + LiteLLM community map (text-embedding-3-small): 8191 max input tokens, 1536-dim vectors, $0.02/M input tokens (batch $0.01/M); embeddings have no output/cache cost
          model_info:
            mode: embedding
            max_input_tokens: 8191
            max_tokens: 8191
            output_vector_size: 1536
            supports_vision: false
            supports_reasoning: false
            input_cost_per_token: 0.00000002
            input_cost_per_token_batches: 0.00000001
            output_cost_per_token: 0.0
            output_cost_per_token_batches: 0.0
            cache_read_input_token_cost: 0.0
            cache_creation_input_token_cost: 0.0
          litellm_params:
            model: openai/text-embedding-3-small
            api_key: os.environ/OPENAI_API_KEY

        # ===== Anthropic (direct API) =====
        - model_name: anthropic/claude-fable-5
          # from models.dev (anthropic): 1M ctx / 128k out, $10/$50 per M
          model_info:
            mode: chat
            max_input_tokens: 1000000
            max_output_tokens: 128000
            supports_vision: true
            supports_reasoning: true
            input_cost_per_token: 0.00001
            output_cost_per_token: 0.00005
            cache_read_input_token_cost: 0.000001
            cache_creation_input_token_cost: 0.0000125
          litellm_params:
            model: anthropic/claude-fable-5
            api_key: os.environ/ANTHROPIC_API_KEY

        # Fallback for claude-sonnet-5 (github_copilot > anthropic direct)
        - model_name: anthropic/claude-sonnet-5
          # from models.dev (anthropic): 1M ctx / 128k out, $2/$10 per M
          model_info:
            mode: chat
            max_input_tokens: 1000000
            max_output_tokens: 128000
            supports_vision: true
            supports_reasoning: true
            input_cost_per_token: 0.000002
            output_cost_per_token: 0.00001
            cache_read_input_token_cost: 0.0000002
            cache_creation_input_token_cost: 0.0000025
          litellm_params:
            model: anthropic/claude-sonnet-5
            api_key: os.environ/ANTHROPIC_API_KEY

        - model_name: anthropic/claude-opus-4-8
          # from models.dev (anthropic): 1M ctx / 128k out, $5/$25 per M
          model_info:
            mode: chat
            max_input_tokens: 1000000
            max_output_tokens: 128000
            supports_vision: true
            supports_reasoning: true
            input_cost_per_token: 0.000005
            output_cost_per_token: 0.000025
            cache_read_input_token_cost: 0.0000005
            cache_creation_input_token_cost: 0.00000625
          litellm_params:
            model: anthropic/claude-opus-4-8
            api_key: os.environ/ANTHROPIC_API_KEY

        # ===== GitHub Copilot (OAuth device flow — tokens persisted in PVC) =====
        # claude-sonnet-5: primary = github_copilot, fallback = anthropic direct
        - model_name: github_copilot/claude-sonnet-5
          # from models.dev (github-copilot): 1M ctx / 128k out, vision, reasoning, $2/$10 per M, cache_read $0.2/M, cache_write $2.5/M
          model_info:
            mode: chat
            max_input_tokens: 1000000
            max_output_tokens: 128000
            supports_vision: true
            supports_reasoning: true
            input_cost_per_token: 0.000002
            output_cost_per_token: 0.00001
            cache_read_input_token_cost: 0.0000002
            cache_creation_input_token_cost: 0.0000025
          litellm_params:
            model: github_copilot/claude-sonnet-5

        - model_name: github_copilot/gemini-3.5-flash
          # from models.dev (github-copilot): 128k input cap / 64k out, vision, reasoning, $1.5/$9 per M, cache_read $0.15/M; cache_write not published → 0
          model_info:
            mode: chat
            max_input_tokens: 128000
            max_output_tokens: 64000
            supports_vision: true
            supports_reasoning: true
            input_cost_per_token: 0.0000015
            output_cost_per_token: 0.000009
            cache_read_input_token_cost: 0.00000015
            cache_creation_input_token_cost: 0.0
          litellm_params:
            model: github_copilot/gemini-3.5-flash

        - model_name: github_copilot/gpt-5.6-luna
          # from GitHub Copilot billing (openai list price): 922k input cap / 128k out, vision, reasoning. Default <=200K: $1/$6 per M, cache_read $0.1/M, cache_write $1.25/M. Long context >200K: $2/$9 per M, cache_read $0.2/M. Primary; fallback to openai direct.
          model_info:
            mode: responses
            max_input_tokens: 922000
            max_output_tokens: 128000
            supports_vision: true
            supports_reasoning: true
            input_cost_per_token: 0.000001
            output_cost_per_token: 0.000006
            cache_read_input_token_cost: 0.0000001
            cache_creation_input_token_cost: 0.00000125
            input_cost_per_token_above_200k_tokens: 0.000002
            output_cost_per_token_above_200k_tokens: 0.000009
            cache_read_input_token_cost_above_200k_tokens: 0.0000002
          litellm_params:
            model: github_copilot/gpt-5.6-luna

        - model_name: github_copilot/gpt-5.6-terra
          # from GitHub Copilot billing (openai list price): 922k input cap / 128k out, vision, reasoning. Default <=272K: $2.5/$15 per M, cache_read $0.25/M, cache_write $3.125/M. Long context >272K: $5/$22.5 per M, cache_read $0.5/M. Primary; fallback to openai direct.
          model_info:
            mode: responses
            max_input_tokens: 922000
            max_output_tokens: 128000
            supports_vision: true
            supports_reasoning: true
            input_cost_per_token: 0.0000025
            output_cost_per_token: 0.000015
            cache_read_input_token_cost: 0.00000025
            cache_creation_input_token_cost: 0.000003125
            input_cost_per_token_above_272k_tokens: 0.000005
            output_cost_per_token_above_272k_tokens: 0.0000225
            cache_read_input_token_cost_above_272k_tokens: 0.0000005
          litellm_params:
            model: github_copilot/gpt-5.6-terra

        # ===== OpenAI direct API (fallback targets for copilot, + sol API-only) =====
        # gpt-5.6-luna: fallback for github_copilot/gpt-5.6-luna
        - model_name: openai/gpt-5.6-luna
          # from models.dev (openai): 922k input cap / 128k out, vision, reasoning. Default <=272K: $1/$6 per M, cache_read $0.1/M, cache_write $1.25/M. Long context >272K: $2/$9 per M, cache_read $0.2/M, cache_write $2.5/M
          model_info:
            mode: responses
            max_input_tokens: 922000
            max_output_tokens: 128000
            supports_vision: true
            supports_reasoning: true
            input_cost_per_token: 0.000001
            output_cost_per_token: 0.000006
            cache_read_input_token_cost: 0.0000001
            cache_creation_input_token_cost: 0.00000125
            input_cost_per_token_above_272k_tokens: 0.000002
            output_cost_per_token_above_272k_tokens: 0.000009
            cache_read_input_token_cost_above_272k_tokens: 0.0000002
            cache_creation_input_token_cost_above_272k_tokens: 0.0000025
          litellm_params:
            model: openai/gpt-5.6-luna
            api_key: os.environ/OPENAI_API_KEY

        # gpt-5.6-terra: fallback for github_copilot/gpt-5.6-terra
        - model_name: openai/gpt-5.6-terra
          # from models.dev (openai): 922k input cap / 128k out, vision, reasoning. Default <=272K: $2.5/$15 per M, cache_read $0.25/M, cache_write $3.125/M. Long context >272K: $5/$22.5 per M, cache_read $0.5/M, cache_write $6.25/M
          model_info:
            mode: responses
            max_input_tokens: 922000
            max_output_tokens: 128000
            supports_vision: true
            supports_reasoning: true
            input_cost_per_token: 0.0000025
            output_cost_per_token: 0.000015
            cache_read_input_token_cost: 0.00000025
            cache_creation_input_token_cost: 0.000003125
            input_cost_per_token_above_272k_tokens: 0.000005
            output_cost_per_token_above_272k_tokens: 0.0000225
            cache_read_input_token_cost_above_272k_tokens: 0.0000005
            cache_creation_input_token_cost_above_272k_tokens: 0.00000625
          litellm_params:
            model: openai/gpt-5.6-terra
            api_key: os.environ/OPENAI_API_KEY

        # gpt-5.6-sol: API-only (not available on this Copilot subscription tier)
        - model_name: openai/gpt-5.6-sol
          # from models.dev (openai): 922k input cap / 128k out, vision, reasoning. Default <=272K: $5/$30 per M, cache_read $0.5/M, cache_write $6.25/M. Long context >272K: $10/$45 per M, cache_read $1/M, cache_write $12.5/M
          model_info:
            mode: responses
            max_input_tokens: 922000
            max_output_tokens: 128000
            supports_vision: true
            supports_reasoning: true
            input_cost_per_token: 0.000005
            output_cost_per_token: 0.00003
            cache_read_input_token_cost: 0.0000005
            cache_creation_input_token_cost: 0.00000625
            input_cost_per_token_above_272k_tokens: 0.00001
            output_cost_per_token_above_272k_tokens: 0.000045
            cache_read_input_token_cost_above_272k_tokens: 0.000001
            cache_creation_input_token_cost_above_272k_tokens: 0.0000125
          litellm_params:
            model: openai/gpt-5.6-sol
            api_key: os.environ/OPENAI_API_KEY

        # ===== Ollama Cloud (https://ollama.com) — primary for fallback chains =====
        - model_name: ollama/glm-5.1
          # from models.dev (ollama-cloud): 202752 ctx / 131072 out; cost set to 0 (ollama-cloud billing handled outside LiteLLM)
          model_info:
            mode: chat
            max_input_tokens: 202752
            max_output_tokens: 131072
            supports_vision: false
            supports_reasoning: true
            input_cost_per_token: 0.0
            output_cost_per_token: 0.0
            cache_read_input_token_cost: 0.0
            cache_creation_input_token_cost: 0.0
          litellm_params:
            model: openai/glm-5.1
            api_base: https://ollama.com/v1
            api_key: os.environ/OLLAMA_API_KEY

        - model_name: ollama/deepseek-v4-pro
          # from models.dev (ollama-cloud): 1048576 ctx / 1048576 out; cost set to 0 (ollama-cloud billing handled outside LiteLLM)
          model_info:
            mode: chat
            max_input_tokens: 1048576
            max_output_tokens: 1048576
            supports_vision: false
            supports_reasoning: true
            input_cost_per_token: 0.0
            output_cost_per_token: 0.0
            cache_read_input_token_cost: 0.0
            cache_creation_input_token_cost: 0.0
          litellm_params:
            model: openai/deepseek-v4-pro
            api_base: https://ollama.com/v1
            api_key: os.environ/OLLAMA_API_KEY

        - model_name: ollama/kimi-k2.6
          # from models.dev (ollama-cloud): 262144 ctx / 262144 out, multimodal; cost set to 0 (ollama-cloud billing handled outside LiteLLM)
          model_info:
            mode: chat
            max_input_tokens: 262144
            max_output_tokens: 262144
            supports_vision: true
            supports_reasoning: true
            input_cost_per_token: 0.0
            output_cost_per_token: 0.0
            cache_read_input_token_cost: 0.0
            cache_creation_input_token_cost: 0.0
          litellm_params:
            model: openai/kimi-k2.6
            api_base: https://ollama.com/v1
            api_key: os.environ/OLLAMA_API_KEY

        - model_name: ollama/minimax-m3
          # from models.dev (ollama-cloud): 512000 ctx / 131072 out, multimodal (text+image+video), reasoning; cost set to 0 (ollama-cloud billing handled outside LiteLLM)
          model_info:
            mode: chat
            max_input_tokens: 512000
            max_output_tokens: 131072
            supports_vision: true
            supports_reasoning: true
            input_cost_per_token: 0.0
            output_cost_per_token: 0.0
            cache_read_input_token_cost: 0.0
            cache_creation_input_token_cost: 0.0
          litellm_params:
            model: openai/minimax-m3
            api_base: https://ollama.com/v1
            api_key: os.environ/OLLAMA_API_KEY

        - model_name: ollama/deepseek-v4-flash
          # from models.dev (ollama-cloud): 1048576 ctx / 1048576 out; cost set to 0 (ollama-cloud billing handled outside LiteLLM)
          model_info:
            mode: chat
            max_input_tokens: 1048576
            max_output_tokens: 1048576
            supports_vision: false
            supports_reasoning: true
            input_cost_per_token: 0.0
            output_cost_per_token: 0.0
            cache_read_input_token_cost: 0.0
            cache_creation_input_token_cost: 0.0
          litellm_params:
            model: openai/deepseek-v4-flash
            api_base: https://ollama.com/v1
            api_key: os.environ/OLLAMA_API_KEY

        - model_name: ollama/glm-5.2
          # from models.dev (ollama-cloud): 976000 ctx / 131072 out; cost set to 0 (ollama-cloud billing handled outside LiteLLM)
          model_info:
            mode: chat
            max_input_tokens: 976000
            max_output_tokens: 131072
            supports_vision: false
            supports_reasoning: true
            input_cost_per_token: 0.0
            output_cost_per_token: 0.0
            cache_read_input_token_cost: 0.0
            cache_creation_input_token_cost: 0.0
          litellm_params:
            model: openai/glm-5.2
            api_base: https://ollama.com/v1
            api_key: os.environ/OLLAMA_API_KEY

        # Ollama-only models (no fallback)
        - model_name: ollama/gemma4-31b
          # from models.dev (ollama-cloud): 262144 ctx / 262144 out, multimodal, reasoning; cost set to 0 (ollama-cloud billing handled outside LiteLLM)
          model_info:
            mode: chat
            max_input_tokens: 262144
            max_output_tokens: 262144
            supports_vision: true
            supports_reasoning: true
            input_cost_per_token: 0.0
            output_cost_per_token: 0.0
            cache_read_input_token_cost: 0.0
            cache_creation_input_token_cost: 0.0
          litellm_params:
            model: openai/gemma4:31b
            api_base: https://ollama.com/v1
            api_key: os.environ/OLLAMA_API_KEY

        # ===== OpenCode Go (https://opencode.ai/docs/go/) — fallback providers =====
        # OpenAI-compatible endpoint (https://opencode.ai/zen/go/v1)
        - model_name: opencode/glm-5.1
          # from models.dev (opencode-go): 202752 ctx / 32768 out, $1.4/$4.4 per M
          model_info:
            mode: chat
            max_input_tokens: 202752
            max_output_tokens: 32768
