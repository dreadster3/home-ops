      litellm_settings:
        callbacks:
          - prometheus
          - smtp_email
        prometheus_initialize_budget_metrics: true
        enable_end_user_cost_tracking_prometheus_only: true
        service_callback: ["prometheus_system"]
        require_auth_for_metrics_endpoint: true

        drop_params: true
        request_timeout: 600
        num_retries: 2
        set_verbose: false
        json_logs: true
        cache: true
        cache_params:
          type: redis
          host: os.environ/REDIS_HOST
          port: os.environ/REDIS_PORT
          password: os.environ/REDIS_PASSWORD
      router_settings:
        # Routing aliases — clean model_name → primary provider/model_name
        model_group_alias:
          claude-sonnet-5: github_copilot/claude-sonnet-5
          claude-opus-4-8: anthropic/claude-opus-4-8
          claude-fable-5: anthropic/claude-fable-5
          deepseek-v4-pro: ollama/deepseek-v4-pro
          kimi-k2.6: ollama/kimi-k2.6
          minimax-m3: ollama/minimax-m3
          deepseek-v4-flash: ollama/deepseek-v4-flash
          glm-5.2: ollama/glm-5.2
          glm-5.1: ollama/glm-5.1
          gemini-3.5-flash: github_copilot/gemini-3.5-flash
          gpt-5.6-luna: github_copilot/gpt-5.6-luna
          gpt-5.6-terra: github_copilot/gpt-5.6-terra
          gpt-5.6-sol: openai/gpt-5.6-sol
          qwen3.7-max: opencode/qwen3.7-max
          qwen3.7-plus: opencode/qwen3.7-plus
          tts: openai/tts-1
          stt: deepgram/nova-2
          image: gemini/gemini-3.1-flash-image
          text-embedding-3: openai/text-embedding-3-large
        # Fallback chains: ollama > opencode, github_copilot > direct API key
        fallbacks:
          - "glm-5.1":
              - "opencode/glm-5.1"
          - "deepseek-v4-pro":
              - "opencode/deepseek-v4-pro"
          - "kimi-k2.6":
              - "opencode/kimi-k2.6"
          - "minimax-m3":
              - "opencode/minimax-m3"
          - "deepseek-v4-flash":
              - "opencode/deepseek-v4-flash"
          - "glm-5.2":
              - "opencode/glm-5.2"
          - "claude-sonnet-5":
              - "anthropic/claude-sonnet-5"
          - "gpt-5.6-luna":
              - "openai/gpt-5.6-luna"
          - "gpt-5.6-terra":
              - "openai/gpt-5.6-terra"
          - "stt":
              - "openai/whisper-1"
          - "image":
              - "openai/gpt-image-2"
              - "gemini/gemini-3.1-flash-lite-image"
          - "text-embedding-3":
              - "openai/text-embedding-3-small"

      general_settings:
        alerting:
          - email
        master_key: os.environ/PROXY_MASTER_KEY
        database_url: os.environ/DATABASE_URL
        store_model_in_db: true
        # Per-user usage tracking from Open WebUI
        user_header_mappings:
          - header_name: X-OpenWebUI-User-Id
            litellm_user_role: internal_user
          - header_name: X-OpenWebUI-User-Email
            litellm_user_role: customer
        # Production best practices (https://docs.litellm.ai/docs/proxy/prod)
        proxy_batch_write_at: 60
        database_connection_pool_limit: 10
        disable_error_logs: true

      search_tools:
        - search_tool_name: searxng-search
          litellm_params:
            search_provider: searxng
            api_base: http://searxng.searxng.svc.cluster.local

      mcp_servers:
        github:
          url: https://api.githubcopilot.com/mcp/
          auth_type: oauth2
          client_id: os.environ/GITHUB_OAUTH_CLIENT_ID
          client_secret: os.environ/GITHUB_OAUTH_CLIENT_SECRET
          transport: http
          scopes:
            - repo
            - read:packages
            - read:org
          allow_all_keys: true
        terraform:
          url: http://mcp-terraform-proxy.toolhive.svc.cluster.local:8080/mcp
          auth_type: none
          allow_all_keys: true
        searxng:
          url: http://mcp-searxng-proxy.toolhive.svc.cluster.local:8080/mcp
          auth_type: none
          allow_all_keys: true

    # Persistent storage for GitHub Copilot OAuth tokens
    volumes:
      - name: github-copilot-tokens
        persistentVolumeClaim:
          claimName: litellm-github-copilot-tokens
    volumeMounts:
      - name: github-copilot-tokens
        mountPath: /data/github_copilot

    resources:
      requests:
        cpu: 50m
        memory: &memory 2Gi
      limits:
        memory: *memory
