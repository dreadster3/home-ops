apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: litellm-helm
  namespace: litellm
spec:
  interval: 24h
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
  ref:
    tag: 1.98.0
  url: oci://ghcr.io/berriai/litellm-helm
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: litellm
  namespace: litellm
spec:
  interval: 1h
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  chartRef:
    kind: OCIRepository
    name: litellm-helm
    namespace: litellm
  values:
    replicaCount: 2
    strategy:
      type: RollingUpdate
    podAnnotations:
      reloader.stakater.com/auto: "true"

    image:
      repository: ghcr.io/berriai/litellm-database
      tag: v1.98.0@sha256:5ead13edd4efd89f32dab349c1f19447d395affca53f3aeae00f5e6e01b8c08d

    # Use external CloudNativePG — disable the bundled Bitnami postgres subchart
    db:
      useExisting: true
      deployStandalone: false
      endpoint: litellm-cluster-rw
      database: litellm
      secret:
        name: litellm-cluster-credentials
        usernameKey: username
        passwordKey: password

    # Use external Dragonfly — disable the bundled Redis subchart
    redis:
      enabled: false

    # We use Envoy Gateway HTTPRoute (see httproute.yaml) instead of Ingress
    ingress:
      enabled: false

    # One Uvicorn worker per pod — scale horizontally via replicas (Kubernetes recommendation)
    numWorkers: 1

    # Turn off FastAPI's default info logs (production best practice)
    logLevel: "ERROR"

    # Enable Prometheus ServiceMonitor for metrics scraping
    serviceMonitor:
      enabled: false

    # Inject master key, API keys, and Redis connection info as env vars
    environmentSecrets:
      - litellm-secret-env

    masterkeySecretName: litellm-secret-env
    masterkeySecretKey: PROXY_MASTER_KEY

    envVars:
      GENERIC_AUTHORIZATION_ENDPOINT: https://authentik.${EXTERNAL_DOMAIN}/application/o/authorize/
      GENERIC_TOKEN_ENDPOINT: https://authentik.${EXTERNAL_DOMAIN}/application/o/token/
      GENERIC_USERINFO_ENDPOINT: https://authentik.${EXTERNAL_DOMAIN}/application/o/userinfo/
      GENERIC_SCOPE: openid profile email litellm_role
      PROXY_BASE_URL: https://litellm.${EXTERNAL_DOMAIN}
      PROXY_LOGOUT_URL: https://authentik.${EXTERNAL_DOMAIN}/application/o/litellm/end-session/
      GENERIC_ROLE_MAPPINGS_GROUP_CLAIM: groups
      GENERIC_ROLE_MAPPINGS_DEFAULT_ROLE: internal_user
      GENERIC_USER_FIRST_NAME_ATTRIBUTE: given_name
      GENERIC_USER_ID_ATTRIBUTE: sub
      GENERIC_USER_ROLE_ATTRIBUTE: litellm_role
      GENERIC_USER_EMAIL_ATTRIBUTE: email
      GENERIC_USER_DISPLAY_NAME_ATTRIBUTE: preferred_username
      AUTO_REDIRECT_UI_LOGIN_TO_SSO: true
      GITHUB_COPILOT_TOKEN_DIR: /data/github_copilot
      LITELLM_MODE: PRODUCTION
      SMTP_HOST: maddy.maddy.svc.cluster.local
      SMTP_PORT: 25
      SMTP_TLS: "False"
      SMTP_SENDER_EMAIL: no-reply@${EXTERNAL_DOMAIN}

    proxyConfigMap:
      create: false
      name: litellm-proxy-config
      key: config.yaml

    # Persistent storage for GitHub Copilot OAuth tokens
    volumes:
      - name: github-copilot-tokens
        persistentVolumeClaim:
          claimName: litellm-github-copilot-tokens
    volumeMounts:
      - name: github-copilot-tokens
        mountPath: /data/github_copilot

    resources:
      requests:
        cpu: 600m
        memory: &memory 1.7Gi
      limits:
        memory: *memory
