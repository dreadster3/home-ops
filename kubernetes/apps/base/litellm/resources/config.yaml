model_list:
  # ===== Image Generation =====
  - model_name: openrouter/black-forest-labs/flux.2-pro
    model_info:
      mode: chat
      supports_vision: true
      supported_openai_parameters:
        - aspect_ratio
        - output_format
        - n
        - input_references
        - seed
    litellm_params:
      model: openrouter/black-forest-labs/flux.2-pro
      api_key: os.environ/OPENROUTER_API_KEY

  - model_name: gemini/gemini-3.1-flash-image
    model_info:
      mode: image_generation
      max_input_tokens: 131072
      max_output_tokens: 32768
      supports_vision: true
      supports_reasoning: true
    litellm_params:
      model: gemini/gemini-3.1-flash-image
      api_key: os.environ/GEMINI_API_KEY

  - model_name: gemini/gemini-3.1-flash-lite-image
    model_info:
      mode: image_generation
      max_input_tokens: 131072
      max_output_tokens: 32768
      supports_vision: true
    litellm_params:
      model: gemini/gemini-3.1-flash-lite-image
      api_key: os.environ/GEMINI_API_KEY

  # ===== Audio (TTS / STT) =====
  - model_name: openai/tts-1
    # from LiteLLM community map (tts-1): mode=audio_speech, $15 per 1M characters (input_cost_per_character); text->speech
    model_info:
      mode: audio_speech
      supports_vision: false
      supports_reasoning: false
    litellm_params:
      model: openai/tts-1
      api_key: os.environ/OPENAI_API_KEY

  - model_name: openai/whisper-1
    model_info:
      mode: audio_transcription
      supports_vision: false
      supports_reasoning: false
    litellm_params:
      model: openai/whisper-1
      api_key: os.environ/OPENAI_API_KEY

  - model_name: deepgram/nova-2
    model_info:
      mode: audio_transcription
      supports_vision: false
      supports_reasoning: false
    litellm_params:
      model: deepgram/nova-2
      api_key: os.environ/DEEPGRAM_API_KEY

  # ===== Embeddings =====
  - model_name: openai/text-embedding-3-large
    model_info:
      mode: embedding
      max_input_tokens: 8191
      max_tokens: 8191
      output_vector_size: 3072
      supports_vision: false
      supports_reasoning: false
    litellm_params:
