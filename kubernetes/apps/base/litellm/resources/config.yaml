      supports_medium_reasoning_effort: true
      supports_high_reasoning_effort: true
      supports_xhigh_reasoning_effort: true
      supports_max_reasoning_effort: true
    litellm_params:
      model: anthropic/claude-sonnet-5-5
      api_key: os.environ/ANTHROPIC_API_KEY

  - model_name: claude-opus-5.5
    model_info:
      supports_none_reasoning_effort: false
      supports_minimal_reasoning_effort: false
      supports_low_reasoning_effort: true
      supports_medium_reasoning_effort: true
      supports_high_reasoning_effort: true
      supports_xhigh_reasoning_effort: true
      supports_max_reasoning_effort: true
    litellm_params:
      model: anthropic/claude-opus-5-5
      api_key: os.environ/ANTHROPIC_API_KEY

  # ===== OpenAI direct API (order 1 flex / order 3 standard in the gpt-6 groups) =====
  - model_name: gpt-6-luna
    model_info: &openai-gpt-6-luna
      supports_none_reasoning_effort: true
      supports_minimal_reasoning_effort: false
      supports_low_reasoning_effort: true
      supports_medium_reasoning_effort: true
      supports_high_reasoning_effort: true
      supports_xhigh_reasoning_effort: true
      supports_max_reasoning_effort: true
    litellm_params:
      model: openai/gpt-6-luna
      api_key: os.environ/OPENAI_API_KEY
      order: 3
      # GPT-5.6+ supports explicit prompt_cache_breakpoint markers (mapped by LiteLLM);
      # implicit keeps OpenAI's automatic checkpoint alongside ours for multi-turn chat
      cache_control_injection_points:
        - location: message
          role: system
      prompt_cache_options:
        mode: implicit

  - model_name: gpt-6-luna
    model_info: *openai-gpt-6-luna
    litellm_params:
      model: openai/gpt-6-luna
      api_key: os.environ/OPENAI_API_KEY
      service_tier: flex
      order: 1
      cache_control_injection_points:
        - location: message
          role: system
      prompt_cache_options:
        mode: implicit

  - model_name: gpt-6.1-sol
