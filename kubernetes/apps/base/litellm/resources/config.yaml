model_list:
  # Same model across providers shares one model_name; litellm_params.order sets
  # attempt priority (1 = first, each order gets its own retries before escalating).
  # fallbacks are reserved for genuinely different models.
  # ==== Decisions ====
  - model_name: jev-1.13
    litellm_params:
      model: typesafe/jev-1.13.0
      api_key: os.environ/TYPESAFE_API_KEY
      order: 1

  - model_name: jev-1.14
    litellm_params:
      model: typesafe/jev-1.14.0
      api_key: os.environ/TYPESAFE_API_KEY
      order: 1

  - model_name: jev-1.13
    litellm_params:
      model: openrouter/typesafe/jev-1.13
      api_key: os.environ/OPENROUTER_API_KEY
      order: 2

  - model_name: jev-1.14
    litellm_params:
      model: openrouter/typesafe/jev-1.14
      api_key: os.environ/OPENROUTER_API_KEY
      order: 2

  # ===== Image Generation =====
  - model_name: flux.2-pro
    model_info:
      mode: chat
      supports_vision: true
      supported_openai_parameters:
        - aspect_ratio
        - output_format
        - n
        - input_references
        - seed
    litellm_params:
      model: openrouter/black-forest-labs/flux.2-pro
      preset: "@preset/default"
      api_key: os.environ/OPENROUTER_API_KEY

  - model_name: gemini-3.1-flash-image
    model_info:
      mode: image_generation
      max_input_tokens: 131072
      max_output_tokens: 32768
      supports_vision: true
      supports_reasoning: true
    litellm_params:
      model: gemini/gemini-3.1-flash-image
      api_key: os.environ/GEMINI_API_KEY

  - model_name: gemini-3.1-flash-lite-image
    model_info:
      mode: image_generation
      max_input_tokens: 131072
      max_output_tokens: 32768
      supports_vision: true
    litellm_params:
      model: gemini/gemini-3.1-flash-lite-image
      api_key: os.environ/GEMINI_API_KEY

  # ===== Audio (TTS / STT) =====
  - model_name: tts-1
    litellm_params:
      model: openai/tts-1
      api_key: os.environ/OPENAI_API_KEY

  - model_name: whisper-1
    litellm_params:
      model: openai/whisper-1
      api_key: os.environ/OPENAI_API_KEY

  - model_name: nova-3
    litellm_params:
      model: deepgram/nova-3
      api_key: os.environ/DEEPGRAM_API_KEY

  # ===== Embeddings =====
  - model_name: text-embedding-3-large
    litellm_params:
      model: openai/text-embedding-3-large
      api_key: os.environ/OPENAI_API_KEY

  - model_name: text-embedding-3-small
    litellm_params:
      model: openai/text-embedding-3-small
      api_key: os.environ/OPENAI_API_KEY

  - model_name: qwen3-embedding-8b
    model_info:
      mode: embedding
      max_input_tokens: 32000
      max_tokens: 32000
      output_vector_size: 4096
    litellm_params:
      model: openrouter/qwen/qwen3-embedding-8b
      preset: "@preset/default"
      api_key: os.environ/OPENROUTER_API_KEY

  # ===== Rerank (for Hindsight) =====
  # LiteLLM has no openrouter rerank provider; hosted_vllm is its generic
  # OpenAI-compatible rerank passthrough (top_n/results shape) and works
  # against OpenRouter's /rerank endpoint via api_base.
  - model_name: rerank-2.5-lite
    model_info:
      mode: rerank
    litellm_params:
      model: hosted_vllm/voyageai/rerank-2.5-lite
      api_base: https://openrouter.ai/api/v1
      api_key: os.environ/OPENROUTER_API_KEY

  # ===== Text Completions =====
  - model_name: codestral-latest
    litellm_params:
      model: text-completion-codestral/codestral-latest
      api_key: os.environ/CODESTRAL_API_KEY

  # ======= Deepseek (direct API) =====
  - model_name: deepseek-v4.1-flash
    model_info: &deepseek-v41-flash
      supports_none_reasoning_effort: false
      supports_minimal_reasoning_effort: false
      supports_low_reasoning_effort: true
      supports_medium_reasoning_effort: false
      supports_high_reasoning_effort: true
      supports_xhigh_reasoning_effort: false
      supports_max_reasoning_effort: true
    litellm_params:
      model: deepseek/deepseek-flash
      api_base: https://api.deepseek.com
      api_key: os.environ/DEEPSEEK_API_KEY
      order: 3

  # ===== Anthropic (direct API) =====
  - model_name: claude-fable-5.2
    model_info:
      supports_none_reasoning_effort: false
      supports_minimal_reasoning_effort: false
      supports_low_reasoning_effort: false
      supports_medium_reasoning_effort: false
      supports_high_reasoning_effort: false
      supports_xhigh_reasoning_effort: true
      supports_max_reasoning_effort: true
    litellm_params:
      model: anthropic/claude-fable-5-2
      api_key: os.environ/ANTHROPIC_API_KEY

  - model_name: claude-haiku-5.5
    model_info:
