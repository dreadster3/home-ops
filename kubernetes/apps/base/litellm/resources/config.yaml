litellm_settings:
  callbacks:
    - prometheus
    - smtp_email
  prometheus_initialize_budget_metrics: true
  enable_end_user_cost_tracking_prometheus_only: true
  service_callback: ["prometheus_system"]
  require_auth_for_metrics_endpoint: true

  drop_params: true
  request_timeout: 600
  num_retries: 2
  set_verbose: false
  json_logs: true
  cache: true
  enable_redis_auth_cache: true
  cache_params:
    type: redis
    host: os.environ/REDIS_HOST
    port: os.environ/REDIS_PORT
    password: os.environ/REDIS_PASSWORD
router_settings:
  routing_strategy: simple-shuffle

  # redis connection
  redis_url: os.environ/REDIS_URL
  redis_port: os.environ/REDIS_PORT
  enable_pre_call_checks: true

  # Routing aliases — clean model_name → primary provider/model_name
  model_group_alias:
    # anthropic models
    claude-sonnet-5: anthropic/claude-sonnet-5
    claude-opus-5: anthropic/claude-opus-5
    claude-fable-5: anthropic/claude-fable-5

    # openai models
    gpt-5.6-luna: openai/gpt-5.6-luna
    gpt-5.6-terra: openai/gpt-5.6-terra
    gpt-5.6-sol: openai/gpt-5.6-sol

    # ollama models
    minimax-m3: ollama/minimax-m3
    deepseek-v4-flash-vision: deepseek/deepseek-v4-flash-vision
    deepseek-v4-flash: ollama/deepseek-v4-flash
    deepseek-v4-pro: ollama/deepseek-v4-pro
    glm-5.2: ollama/glm-5.2
    gemma4: ollama/gemma4
    glm-5.3: ollama/glm-5.3
    glm-5.3-flash: ollama/glm-5.3-flash

    # openrouter models
    kimi-k3: openrouter/moonshotai/kimi-k3
    qwen3.8-max: openrouter/qwen/qwen3.8-max
    qwen3.8-flash: openrouter/qwen/qwen3.8-flash

    tts: openai/tts-1
    stt: deepgram/nova-2
    imagen: openrouter/black-forest-labs/flux.2-pro
    imagedit: gemini/gemini-3.1-flash-image
    embedding: openrouter/qwen/qwen3-embedding-8b

  fallbacks:
    - "stt":
        - "openai/whisper-1"
    - "imagen":
        - "gemini/gemini-3.1-flash-image"
        - "gemini/gemini-3.1-flash-lite-image"
    - "imagedit":
        - "gemini/gemini-3.1-flash-lite-image"
    - "embedding":
        - "openai/text-embedding-3-small"
        - "openai/text-embedding-3-large"
    - "deepseek-v4-flash":
        - "openrouter/deepseek/deepseek-v4-flash"
        - "deepseek/deepseek-v4-flash"
    - "deepseek-v4-pro":
        - "openrouter/deepseek/deepseek-v4-pro"
        - "deepseek/deepseek-v4-pro"
    - "minimax-m3":
        - "openrouter/minimax/minimax-m3"
    - "glm-5.3":
        - "openrouter/z-ai/glm-5.3"
        - "zai/glm-5.3"
    - "glm-5.3-flash":
        - "openrouter/z-ai/glm-5.3-flash"
        - "zai/glm-5.3-flash"
    - "kimi-k3":
        - "moonshot/kimi-k3"

general_settings:
  user_api_key_cache_ttl: 300
  alerting:
    - email
  master_key: os.environ/PROXY_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  store_model_in_db: true
  # Per-user usage tracking from Open WebUI
  user_header_mappings:
    - header_name: X-OpenWebUI-User-Id
      litellm_user_role: internal_user
    - header_name: X-OpenWebUI-User-Email
      litellm_user_role: customer
  # Production best practices (https://docs.litellm.ai/docs/proxy/prod)
  proxy_batch_write_at: 60
  database_connection_pool_limit: 10
  disable_error_logs: true

search_tools:
  - search_tool_name: searxng-search
    litellm_params:
      search_provider: searxng
      api_base: http://searxng.searxng.svc.cluster.local

mcp_servers:
  github:
    url: https://api.githubcopilot.com/mcp/
    auth_type: oauth2
    oauth2_flow: authorization_code
    client_id: os.environ/GITHUB_OAUTH_CLIENT_ID
    client_secret: os.environ/GITHUB_OAUTH_CLIENT_SECRET
    transport: http
    scopes:
      - repo
