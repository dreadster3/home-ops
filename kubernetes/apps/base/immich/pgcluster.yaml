apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: immich-cluster
  namespace: immich
spec:
  imageName: ghcr.io/cloudnative-pg/postgresql:18.4-standard-trixie
  instances: 2
  primaryUpdateStrategy: unsupervised
  affinity:
    podAntiAffinityType: required
  storage:
    storageClass: ceph-block
    size: 10Gi

  resources:
    requests:
      cpu: 200m
      memory: &memory 1Gi
    limits:
      memory: *memory

  postgresql:
    shared_preload_libraries:
      - "vchord.so"
    extensions:
      - name: vchord
        image:
          reference: ghcr.io/tensorchord/vchord-scratch:pg18-v1.1.1
        dynamic_library_path:
          - /usr/lib/postgresql/18/lib
        extension_control_path:
          - /usr/share/postgresql/18/

  bootstrap:
    initdb:
      database: immich
      owner: immich
      secret:
        name: immich-cluster-credentials
      import:
        type: microservice
        databases:
          - immich
        source:
          externalCluster: immich-cluster-old
  externalClusters:
    - name: immich-cluster-old
      connectionParameters:
        host: immich-cluster-old-rw
        user: immich
      password:
        name: immich-cluster-credentials
        key: password
    # - name: backup
    #   plugin:
    #     name: barman-cloud.cloudnative-pg.io
    #     parameters:
    #       barmanObjectName: backup-store
    #       serverName: immich-cluster

  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: backup-store
        serverName: immich-cluster-vchord

  monitoring:
    enablePodMonitor: true
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: immich-cluster-backup
  namespace: immich
spec:
  cluster:
    name: immich-cluster
  schedule: "0 0 0 * * *"
  backupOwnerReference: self
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
