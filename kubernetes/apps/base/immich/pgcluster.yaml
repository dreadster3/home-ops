apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: immich-cluster
  namespace: immich
  annotations:
    cnpg.io/skipEmptyWalArchiveCheck: "enabled"
spec:
  imageName: ghcr.io/cloudnative-pg/postgresql:17.10-standard-trixie
  instances: 2
  primaryUpdateStrategy: unsupervised
  affinity:
    podAntiAffinityType: required
  storage:
    storageClass: ceph-block
    size: 10Gi

  resources:
    requests:
      cpu: 200m
      memory: 1Gi
    limits:
      memory: 1Gi

  postgresql:
    shared_preload_libraries:
      - "vchord.so"
    extensions:
      - name: vchord
        image:
          reference: ghcr.io/tensorchord/vchord-scratch:pg17-v1.1.1

  bootstrap:
    recovery:
      source: backup
      database: immich
      owner: immich
      secret:
        name: immich-cluster-credentials
    # initdb:
    #   database: immich
    #   owner: immich
    #   secret:
    #     name: immich-cluster-credentials
    #   postInitSQL:
    #     - CREATE EXTENSION IF NOT EXISTS "vchord" CASCADE;
    #     - CREATE EXTENSION IF NOT EXISTS "earthdistance" CASCADE;
  externalClusters:
    - name: backup
      plugin:
        name: barman-cloud.cloudnative-pg.io
        parameters:
          barmanObjectName: backup-store
          serverName: immich-cluster

  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: backup-store

  monitoring:
    enablePodMonitor: true
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: immich-cluster-backup
  namespace: immich
spec:
  cluster:
    name: immich-cluster
  schedule: "0 0 0 * * *"
  backupOwnerReference: self
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
