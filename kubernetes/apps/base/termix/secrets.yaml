apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: termix-postgres
spec:
  secretStoreRef:
    name: infisical
    kind: ClusterSecretStore
  target:
    name: termix-cluster-credentials
    creationPolicy: Owner
    template:
      metadata:
        labels:
          cnpg.io/reload: "true"
  data:
    - secretKey: username
      remoteRef:
        key: /termix/POSTGRES_USERNAME
    - secretKey: password
      remoteRef:
        key: /termix/POSTGRES_PASSWORD
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: termix-backup-s3-account
spec:
  secretStoreRef:
    name: infisical
    kind: ClusterSecretStore
  target:
    name: termix-backup-s3-account
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        ACCESS_KEY: "{{ .access_key }}"
        SECRET_KEY: "{{ .secret_key }}"
  data:
    - secretKey: access_key
      remoteRef:
        key: /termix/BACKUP_S3_ACCESS_KEY
    - secretKey: secret_key
      remoteRef:
        key: /termix/BACKUP_S3_SECRET_KEY
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: termix-secret-env
spec:
  secretStoreRef:
    name: infisical
    kind: ClusterSecretStore
  target:
    name: termix-secret-env
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        OIDC_CLIENT_ID: "{{ .oidc_client_id }}"
        OIDC_CLIENT_SECRET: "{{ .oidc_client_secret }}"

        # Encryption keys for Termix
        GUACAMOLE_ENCRYPTION_KEY: "{{ .guacamole_encryption_key }}"
        JWT_SECRET: "{{ .jwt_secret }}"
        ENCRYPTION_KEY: "{{ .encryption_key }}"
        DATABASE_KEY: "{{ .database_key }}"
        INTERNAL_AUTH_TOKEN: "{{ .internal_auth_token }}"
        CREDENTIAL_SHARING_KEY: "{{ .credential_sharing_key }}"
        DATABASE_URL: "postgres://{{ .dbuser }}:{{ .dbpass }}@termix-cluster-rw:5432/termix"
  data:
    - secretKey: jwt_secret
      remoteRef:
        key: /termix/JWT_SECRET
    - secretKey: encryption_key
      remoteRef:
        key: /termix/ENCRYPTION_KEY
    - secretKey: database_key
      remoteRef:
        key: /termix/DATABASE_KEY
    - secretKey: guacamole_encryption_key
      remoteRef:
        key: /termix/GUACAMOLE_ENCRYPTION_KEY
    - secretKey: internal_auth_token
      remoteRef:
        key: /termix/INTERNAL_AUTH_TOKEN
    - secretKey: credential_sharing_key
      remoteRef:
        key: /termix/CREDENTIAL_SHARING_KEY
    - secretKey: oidc_client_id
      remoteRef:
        key: /termix/OIDC_CLIENT_ID
    - secretKey: oidc_client_secret
      remoteRef:
        key: /termix/OIDC_CLIENT_SECRET
    - secretKey: dbuser
      remoteRef:
        key: /termix/POSTGRES_USERNAME
    - secretKey: dbpass
      remoteRef:
        key: /termix/POSTGRES_PASSWORD
