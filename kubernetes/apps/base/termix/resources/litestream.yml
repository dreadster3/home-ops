dbs:
  - path: /app/data/db.sqlite
    replica:
      type: s3
      bucket: termix
      endpoint: https://truenas.${INTERNAL_DOMAIN}:30292
      sync-interval: 1m
      concurrency: 2
levels:
  - interval: 5m
  - interval: 1h
  - interval: 6h

l0-retention: 1m
l0-retention-check-interval: 1m

snapshot:
  interval: 24h
  retention: 48h
