apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: termix-cluster
  namespace: termix
  annotations:
    cnpg.io/skipEmptyWalArchiveCheck: "enabled"
spec:
  imageName: ghcr.io/cloudnative-pg/postgresql:18.6-standard-trixie
  instances: 2
  primaryUpdateStrategy: unsupervised
  affinity:
    podAntiAffinityType: required
  storage:
    storageClass: ceph-block
    size: 5Gi

  # Greenfield deploy: no barman backup exists yet, so initialize fresh.
  # Switch bootstrap to recovery from the backup externalCluster once one exists.
  bootstrap:
    initdb:
      database: termix
      owner: termix
      secret:
        name: termix-cluster-credentials

  externalClusters:
    - name: backup
      plugin:
        name: barman-cloud.cloudnative-pg.io
        parameters:
          barmanObjectName: backup-store
          serverName: termix-cluster

  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: backup-store

  resources:
    requests:
      cpu: 50m
      memory: &memory 256Mi
    limits:
      memory: *memory

  monitoring:
    enablePodMonitor: true
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: termix-cluster-backup
  namespace: termix
spec:
  cluster:
    name: termix-cluster
  schedule: "0 0 0 * * *"
  backupOwnerReference: self
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io