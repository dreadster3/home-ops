---
# Termit pods are only reached through the KEDA HTTP add-on interceptor (in the
# keda namespace) for Gateway traffic, and pangolin's newt tunnel for the
# Pangolin-proxied path. The interceptor holds cold-start requests and forwards
# once termix is ready.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: deny-all-except-namespace
  namespace: termix
spec:
  description: "Allow traffic only to the namespace itself"
  endpointSelector: {}
  egress:
    - toEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": termix
  ingress:
    - fromEndpoints:
        - matchLabels: {}
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: termix-server
  namespace: termix
spec:
  description: "Allow traffic from and to termix server"
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: termix
      app.kubernetes.io/instance: termix
  ingress:
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: keda
            app.kubernetes.io/name: http-add-on
            app.kubernetes.io/component: interceptor
      toPorts:
        - ports:
            - port: http
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: pangolin
            app.kubernetes.io/name: pangolin
            app.kubernetes.io/component: newt
      toPorts:
        - ports:
            - port: http
              protocol: TCP
  egress:
    - toEntities:
        - world