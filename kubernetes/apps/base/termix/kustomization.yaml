apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: &app termix

labels:
  - pairs:
      app.kubernetes.io/module: *app

configMapGenerator:
  - name: litestream-config
    namespace: *app
    options:
      disableNameSuffixHash: true
    files:
      - resources/litestream.yml

resources:
  - namespace.yaml
  - helm.yaml
  - network.yaml
  - secrets.yaml
