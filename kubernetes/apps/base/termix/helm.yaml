apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: termix
  namespace: termix
spec:
  interval: 1h
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  chart:
    spec:
      chart: app-template
      version: 5.1.x
      interval: 24h
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  values:
    controllers:
      main:
        annotations:
          reloader.stakater.com/auto: "true"
        initContainers:
          litestream-restore:
            image:
              repository: litestream/litestream
              tag: 0.5.17@sha256:4b02b9859a6b6b4087d8b8944e15f7e984bd7957cba322bbeee38b0e27b9656a
            args:
              - restore
              - -if-db-not-exists
              - -if-replica-exists
              - /app/data/db.sqlite
            env:
              TZ: ${TIMEZONE}
            envFrom:
              - secretRef:
                  name: litestream-backup-credentials
            resources:
              requests:
                cpu: 15m
                memory: &memory 50Mi
              limits:
                memory: *memory
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop: ["ALL"]
        containers:
          main:
            image:
              repository: ghcr.io/lukegus/termix
              tag: 2.7.1@sha256:931e4ce466f4d29b157eb8d6dcd4d36ee5114495c6edddbb19d4e360e2a60f8d
            env:
              TZ: ${TIMEZONE}
              PORT: &port 8080
              NODE_ENV: production
              DATA_DIR: /app/data

              # Database configuration
              # INFO: litestream does not support encrypted SQLite databases
              DB_FILE_ENCRYPTION: false

              # Guacamole configuration
              GUACD_HOST: localhost
              GUACD_TUNNEL_HOST: termix
              GUACD_RECORDING_BACKEND_PATH: /app/data/recordings/guacamole
              GUACD_RECORDING_PATH: /app/data/recordings/guacamole

              # OIDC configuration
              OIDC_ISSUER_URL: https://authentik.${EXTERNAL_DOMAIN}/application/o/termix/
              OIDC_AUTHORIZATION_URL: https://authentik.${EXTERNAL_DOMAIN}/application/o/authorize/
              OIDC_TOKEN_URL: https://authentik.${EXTERNAL_DOMAIN}/application/o/token/
              OIDC_IDENTIFIER_PATH: sub
              OIDC_NAME_PATH: preferred_username
              OIDC_SCOPES: openid profile email
              OIDC_GROUP_CLAIM: groups
              OIDC_ADMIN_GROUP: AuthentikAdmins
              OIDC_ALLOW_REGISTRATION: true

              # Authentication configuration
              ALLOW_REGISTRATION: false
              ALLOW_PASSWORD_LOGIN: false
              ALLOW_PASSWORD_RESET: false

              ENABLE_TELEMETRY: false
            envFrom:
              - secretRef:
                  name: termix-secret-env
            ports:
              - containerPort: *port
                name: http
                protocol: TCP
            resources:
              requests:
                cpu: 34m
                memory: &memory 155Mi
              limits:
                memory: *memory
            securityContext:
              allowPrivilegeEscalation: false
              # Needs to be false for nginx files to work
              readOnlyRootFilesystem: false
              capabilities: { drop: ["ALL"] }
            probes:
              liveness:
                enabled: true
                spec:
                  initialDelaySeconds: 60
                  periodSeconds: 30
                  timeoutSeconds: 10
                  failureThreshold: 3
              readiness:
                enabled: true
                spec:
                  initialDelaySeconds: 15
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 6
          guacd:
            image:
              repository: guacamole/guacd
              tag: 1.6.0@sha256:8974eaa9ba32f713daf311e7cc8cd7e4cdfba1edea39eed75524e78ef4b08f4f
            ports:
              - containerPort: 4822
                name: guacd
                protocol: TCP
            securityContext:
              runAsNonRoot: true
              readOnlyRootFilesystem: true
              allowPrivilegeEscalation: false
              capabilities:
                drop: ["ALL"]
          litestream:
            image:
              repository: litestream/litestream
              tag: 0.5.17@sha256:4b02b9859a6b6b4087d8b8944e15f7e984bd7957cba322bbeee38b0e27b9656a
            args: [replicate]
            env:
              TZ: ${TIMEZONE}
            envFrom:
              - secretRef:
                  name: litestream-backup-credentials
            resources:
              requests:
                cpu: 15m
                memory: &memory 50Mi
              limits:
                memory: *memory
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop: ["ALL"]
        pod:
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile:
              type: RuntimeDefault

    service:
      main:
        controller: main
        ports:
          http:
            port: 80
            targetPort: http

    route:
      main:
        hostnames:
          - termix.${INTERNAL_DOMAIN}
        parentRefs:
          - name: envoy-internal
            namespace: envoy
        rules:
          - backendRefs:
              # Wake the zero-scaled app via the KEDA HTTP add-on interceptor
              # (the interceptor forwards to termix and holds cold-start requests).
              - name: keda-add-ons-http-interceptor-proxy
                namespace: keda
                port: 8080

    persistence:
      data:
        type: persistentVolumeClaim
        accessMode: ReadWriteOnce
        storageClass: ceph-block
        size: 5Gi
        globalMounts:
          - path: /app/data
      litestream:
        enabled: true
        type: configMap
        name: litestream-config
        advancedMounts:
          main:
            litestream-restore:
              - path: /etc/litestream.yml
                readOnly: true
                subPath: litestream.yml
            litestream:
              - path: /etc/litestream.yml
                readOnly: true
                subPath: litestream.yml
