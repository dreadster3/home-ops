apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: termix
  namespace: termix
spec:
  interval: 1h
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  chart:
    spec:
      chart: app-template
      version: 5.3.0
      interval: 24h
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  values:
    controllers:
      main:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          main:
            image:
              repository: ghcr.io/lukegus/termix
              tag: 26.10.5@sha256:28a627c1e2a568ea8c2d3fd83861675fdd3d8327a09f5a245c399b4864ad5ceb
            env:
              TZ: ${TIMEZONE}
              PORT: &port 8080
              NODE_ENV: production
              DATA_DIR: /app/data

              # Database configuration
              DATABASE_DIALECT: postgres

              # Guacamole configuration
              GUACD_HOST: localhost
              GUACD_TUNNEL_HOST: termix
              GUACD_RECORDING_BACKEND_PATH: /app/data/recordings/guacamole
              GUACD_RECORDING_PATH: /app/data/recordings/guacamole

              # OIDC configuration
              OIDC_ISSUER_URL: https://authentik.${EXTERNAL_DOMAIN}/application/o/termix/
              OIDC_AUTHORIZATION_URL: https://authentik.${EXTERNAL_DOMAIN}/application/o/authorize/
              OIDC_TOKEN_URL: https://authentik.${EXTERNAL_DOMAIN}/application/o/token/
              OIDC_IDENTIFIER_PATH: sub
              OIDC_NAME_PATH: preferred_username
              OIDC_SCOPES: openid profile email
              OIDC_GROUP_CLAIM: groups
              OIDC_ADMIN_GROUP: AuthentikAdmins
              OIDC_ALLOW_REGISTRATION: true

              # Authentication configuration
              ALLOW_REGISTRATION: false
              ALLOW_PASSWORD_LOGIN: false
              ALLOW_PASSWORD_RESET: false

              ENABLE_TELEMETRY: false
            envFrom:
              - secretRef:
                  name: termix-secret-env
            ports:
              - containerPort: *port
                name: http
                protocol: TCP
            resources:
              requests:
                cpu: 34m
                memory: &memory 200Mi
              limits:
                memory: *memory
            securityContext:
              allowPrivilegeEscalation: false
              # Needs to be false for nginx files to work
              readOnlyRootFilesystem: false
              capabilities: { drop: ["ALL"] }
            probes:
              liveness:
                enabled: true
                spec:
                  initialDelaySeconds: 60
                  periodSeconds: 30
                  timeoutSeconds: 10
                  failureThreshold: 3
              readiness:
                enabled: true
                spec:
                  initialDelaySeconds: 15
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 6
          guacd:
            image:
              repository: guacamole/guacd
              tag: 1.6.0@sha256:8974eaa9ba32f713daf311e7cc8cd7e4cdfba1edea39eed75524e78ef4b08f4f
            ports:
              - containerPort: 4822
                name: guacd
                protocol: TCP
            securityContext:
              runAsNonRoot: true
              readOnlyRootFilesystem: true
              allowPrivilegeEscalation: false
              capabilities:
                drop: ["ALL"]
        pod:
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile:
              type: RuntimeDefault

    service:
      main:
        controller: main
        ports:
          http:
            port: 80
            targetPort: http

    route:
      main:
        hostnames:
          - termix.${INTERNAL_DOMAIN}
        parentRefs:
          - name: envoy-internal
            namespace: envoy
        rules:
          - backendRefs:
              - identifier: main
                port: http

    persistence:
      data:
        type: persistentVolumeClaim
        accessMode: ReadWriteOnce
        storageClass: ceph-block
        size: 5Gi
        globalMounts:
          - path: /app/data
