apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: cognee
  namespace: cognee
spec:
  parentRefs:
    - name: envoy-internal
      namespace: envoy
  hostnames:
    - cognee.${INTERNAL_DOMAIN}
  rules:
    - backendRefs:
        - name: cognee
          port: 8000
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: cognee-mcp
  namespace: cognee
spec:
  parentRefs:
    - name: envoy-internal
      namespace: envoy
  hostnames:
    - cognee-mcp.${INTERNAL_DOMAIN}
  rules:
    - backendRefs:
        - name: cognee-mcp
          port: 8000