apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: &app cognee

labels:
  - pairs:
      app.kubernetes.io/module: *app

resources:
  - namespace.yaml
  - store.yaml
  - pgcluster.yaml
  - database.yaml
  - secrets.yaml
  - network.yaml
  - helm.yaml
  - service.yaml
  - httproute.yaml