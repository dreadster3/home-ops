apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cognee-postgres
  namespace: cognee
spec:
  secretStoreRef:
    name: infisical
    kind: ClusterSecretStore
  target:
    name: cognee-cluster-credentials
    creationPolicy: Owner
    template:
      metadata:
        labels:
          cnpg.io/reload: "true"
  data:
    - secretKey: username
      remoteRef:
        key: /cognee/POSTGRES_USERNAME
    - secretKey: password
      remoteRef:
        key: /cognee/POSTGRES_PASSWORD
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cognee-backup-s3-account
  namespace: cognee
spec:
  secretStoreRef:
    name: infisical
    kind: ClusterSecretStore
  target:
    name: cognee-backup-s3-account
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        ACCESS_KEY: "{{ .access_key }}"
        SECRET_KEY: "{{ .secret_key }}"
  data:
    - secretKey: access_key
      remoteRef:
        key: /cognee/BACKUP_S3_ACCESS_KEY
    - secretKey: secret_key
      remoteRef:
        key: /cognee/BACKUP_S3_SECRET_KEY
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cognee-secret-env
  namespace: cognee
spec:
  secretStoreRef:
    name: infisical
    kind: ClusterSecretStore
  target:
    name: cognee-secret-env
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        # Single DB serves both the relational store and pgvector
        DB_HOST: cognee-cluster-rw
        DB_PORT: "5432"
        DB_NAME: cognee
        DB_USERNAME: "{{ .pg_username }}"
        DB_PASSWORD: "{{ .pg_password }}"

        VECTOR_DB_HOST: cognee-cluster-rw
        VECTOR_DB_PORT: "5432"
        VECTOR_DB_NAME: cognee
        VECTOR_DB_USERNAME: "{{ .pg_username }}"
        VECTOR_DB_PASSWORD: "{{ .pg_password }}"

        # LiteLLM gateway (OpenAI-compatible)
        LLM_API_KEY: "{{ .litellm_api_key }}"
        EMBEDDING_API_KEY: "{{ .litellm_api_key }}"
  data:
    - secretKey: pg_username
      remoteRef:
        key: /cognee/POSTGRES_USERNAME
    - secretKey: pg_password
      remoteRef:
        key: /cognee/POSTGRES_PASSWORD
    - secretKey: litellm_api_key
      remoteRef:
        key: /cognee/LITELLM_API_KEY