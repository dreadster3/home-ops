apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: harbor
  namespace: harbor
spec:
  interval: 24h
  url: https://helm.goharbor.io
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: harbor
  namespace: harbor
spec:
  interval: 1h
  chart:
    spec:
      chart: harbor
      version: 1.*
      interval: 24h
      sourceRef:
        kind: HelmRepository
        name: harbor
  values:
    externalURL: https://harbor.${INTERNAL_DOMAIN}

    existingSecretAdminPassword: harbor-admin-password
    existingSecretSecretKey: harbor-secret-key

    core:
      replicas: 2
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
      existingSecret: harbor-core-secret
      existingXsrfSecret: harbor-core-csrf
      secretName: harbor-token-encryption
      resources:
        requests:
          memory: &memory 256Mi
          cpu: 5m
        limits:
          memory: *memory

    jobservice:
      replicas: 2
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
      existingSecret: harbor-jobservice-secret
      existingSecretKey: secret
      jobLoggers:
        - stdout
      resources:
        requests:
          memory: &memory 150Mi
          cpu: 5m
        limits:
          memory: *memory

    registry:
      replicas: 2
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
      existingSecret: harbor-registry-secret
      existingSecretKey: secret
      credentials:
        existingSecret: harbor-registry-credentials
      registry:
        resources:
          requests:
            memory: &memory 192Mi
            cpu: 5m
          limits:
            memory: *memory
      controller:
        resources:
          requests:
            cpu: 5m
            memory: &memory 40Mi
          limits:
            memory: *memory

    portal:
      resources:
        requests:
          cpu: 5m
          memory: &memory 20Mi
        limits:
          memory: *memory

    exporter:
      resources:
        requests:
          cpu: 5m
          memory: &memory 44Mi
        limits:
          memory: *memory

    trivy:
      replicas: 1
      resources:
        requests:
          cpu: 5m
          memory: &memory 1280Mi
        limits:
          memory: *memory

    expose:
      type: route
      tls:
        enabled: false
      route:
        parentRefs:
          - name: envoy-internal
            namespace: envoy
        hosts:
          - harbor.${INTERNAL_DOMAIN}

    cache:
      enabled: true

    persistence:
      imageChartStorage:
        disableredirect: true
        type: s3
        s3:
          bucket: harbor
          regionendpoint: http://rook-ceph-rgw-k8s-ceph-objectstore.rook-ceph.svc:80
          existingSecret: harbor-s3-storage
          secure: false
          chunksize: "5242880"
          multipartcopychunksize: "33554432"
          multipartcopymaxconcurrency: 100
          multipartcopythresholdsize: "33554432"

    database:
      type: external
      external:
        host: harbor-cluster-rw
        existingSecret: harbor-cluster-credentials
        coreDatabase: harbor
        username: harbor

    redis:
      type: external
      external:
        addr: harbor-dragonfly:6379

    metrics:
      enabled: true
      serviceMonitor:
        enabled: true
