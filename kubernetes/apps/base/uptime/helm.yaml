apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: uptime
  namespace: uptime
spec:
  interval: 1h
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  chart:
    spec:
      chart: app-template
      version: 5.1.x
      interval: 24h
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  values:
    controllers:
      main:
        annotations:
          reloader.stakater.com/auto: "true"
        initContainers:
          litestream-restore:
            image:
              repository: litestream/litestream
              tag: 0.5.16@sha256:f085f8bce71a5ad4ce8e28b28ea522de1d9e0d7dd0af3ea5c1bd626d0f341954
            args:
              - restore
              - -if-db-not-exists
              - -if-replica-exists
              - /app/data/kuma.db
            env:
              TZ: Europe/Lisbon
            envFrom:
              - secretRef:
                  name: litestream-backup-credentials
            resources:
              requests:
                cpu: 70m
                memory: &memory 128Mi
              limits:
                memory: *memory
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop: ["ALL"]
        containers:
          main:
            image:
              repository: docker.io/louislam/uptime-kuma
              tag: 2.5.0@sha256:a8610b3b4c38077922ba51b036691e06887d7cefd91fe620fd3d6d23d03dc240
            env:
              TZ: Europe/Lisbon
              UPTIME_KUMA_DB_TYPE: sqlite
            ports:
              - containerPort: 3001
                name: http
                protocol: TCP
            resources:
              requests:
                cpu: 70m
                memory: 256Mi
              limits:
                memory: 256Mi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities: { drop: ["ALL"] }
          litestream:
            image:
              repository: litestream/litestream
              tag: 0.5.16@sha256:f085f8bce71a5ad4ce8e28b28ea522de1d9e0d7dd0af3ea5c1bd626d0f341954
            args: [replicate]
            env:
              TZ: Europe/Lisbon
            envFrom:
              - secretRef:
                  name: litestream-backup-credentials
            resources:
              requests:
                cpu: 70m
                memory: &memory 128Mi
              limits:
                memory: *memory
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop: ["ALL"]
        pod:
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile: { type: RuntimeDefault }

    service:
      main:
        controller: main
        ports:
          http:
            port: 80
            targetPort: http

    route:
      main:
        hostnames:
          - uptime.${INTERNAL_DOMAIN}
        parentRefs:
          - name: envoy-internal
            namespace: envoy
        rules:
          - backendRefs:
              - identifier: main
                port: http

    persistence:
      data:
        enabled: true
        type: persistentVolumeClaim
        accessMode: ReadWriteOnce
        storageClass: ceph-block
        size: 3Gi
        globalMounts:
          - path: /app/data
      litestream:
        enabled: true
        type: configMap
        name: litestream-config
        advancedMounts:
          main:
            litestream-restore:
              - path: /etc/litestream.yml
                readOnly: true
                subPath: litestream.yml
            litestream:
              - path: /etc/litestream.yml
                readOnly: true
                subPath: litestream.yml
