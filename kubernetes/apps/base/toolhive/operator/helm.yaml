apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: toolhive-operator
spec:
  interval: 15m
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
  ref:
    tag: 0.65.0
    digest: sha256:b9960dfd9b72309df944a2007dee9acdf1ccc0cd3b21ef20ef5342e9b68ab81a
  url: oci://ghcr.io/stacklok/toolhive/toolhive-operator
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: toolhive-operator
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: toolhive-operator
  values:
    operator:
      replicaCount: 1
      resources:
        requests:
          cpu: 10m
          memory: &memory 256Mi
        limits:
          memory: *memory
