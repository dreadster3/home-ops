apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: toolhive-operator
spec:
  interval: 15m
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
  ref:
    tag: 0.58.0
    digest: sha256:dafa112eb6c1565c02d833634a9d8d93948ff7e20ca0c2b9ad00df9fbd5ae368
  url: oci://ghcr.io/stacklok/toolhive/toolhive-operator
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: toolhive-operator
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: toolhive-operator
  values:
    operator:
      replicaCount: 1
      resources:
        requests:
          cpu: 10m
          memory: &memory 256Mi
        limits:
          memory: *memory
