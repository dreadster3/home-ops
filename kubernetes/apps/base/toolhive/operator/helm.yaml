apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: toolhive-operator
spec:
  interval: 15m
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
  ref:
    tag: 0.54.0
    digest: sha256:c6fc8d81cbf7cad93a8ebc551362ad59e86e9bc6c03a72b57691f8d58d2d0459
  url: oci://ghcr.io/stacklok/toolhive/toolhive-operator
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: toolhive-operator
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: toolhive-operator
  values:
    operator:
      replicaCount: 1
      resources:
        requests:
          cpu: 10m
          memory: &memory 256Mi
        limits:
          memory: *memory
