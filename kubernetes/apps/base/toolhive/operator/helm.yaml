apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: toolhive-operator
spec:
  interval: 15m
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
  ref:
    tag: 0.59.0
    digest: sha256:0920e45a4d371a6a9096c0019afea688e3aecbd1167182f5dacfe86b37605449
  url: oci://ghcr.io/stacklok/toolhive/toolhive-operator
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: toolhive-operator
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: toolhive-operator
  values:
    operator:
      replicaCount: 1
      resources:
        requests:
          cpu: 10m
          memory: &memory 256Mi
        limits:
          memory: *memory
