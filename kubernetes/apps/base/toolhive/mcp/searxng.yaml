apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPServer
metadata:
  name: searxng
spec:
  image: docker.io/isokoliuk/mcp-searxng:2.12.0@sha256:75b5e1d71b2659b6f170bf2ffee7567a68d7d9f16c7ed122b35c29b0f291f330
  transport: stdio
  env:
    - name: SEARXNG_URL
      value: http://searxng.searxng.svc.cluster.local
  resources:
    requests:
      cpu: 85m
      memory: &memory 74Mi
    limits:
      memory: *memory
  podTemplateSpec:
    spec:
      containers:
        - name: mcp
          resources:
            requests:
              cpu: 5m
              memory: &memory 450Mi
            limits:
              memory: *memory
