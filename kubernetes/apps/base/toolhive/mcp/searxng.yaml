apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPServer
metadata:
  name: searxng
spec:
  image: docker.io/isokoliuk/mcp-searxng:2.10.1@sha256:39176ff787129814aa7fbc96250e35b01ccc1bb6586d98ad3963551ba53e405d
  transport: stdio
  env:
    - name: SEARXNG_URL
      value: http://searxng.searxng.svc.cluster.local
  resources:
    requests:
      cpu: 85m
      memory: &memory 74Mi
    limits:
      memory: *memory
  podTemplateSpec:
    spec:
      containers:
        - name: mcp
          resources:
            requests:
              cpu: 5m
              memory: &memory 450Mi
            limits:
              memory: *memory
