apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPServer
metadata:
  name: searxng
spec:
  image: docker.io/isokoliuk/mcp-searxng:2.7.0@sha256:c018ec75ab6613d3bddd75add274049bbad9dc178fc6c4c35817db227398c100
  transport: stdio
  env:
    - name: SEARXNG_URL
      value: http://searxng.searxng.svc.cluster.local
  resources:
    requests:
      cpu: 85m
      memory: &memory 74Mi
    limits:
      memory: *memory
  podTemplateSpec:
    spec:
      containers:
        - name: mcp
          resources:
            requests:
              cpu: 5m
              memory: &memory 450Mi
            limits:
              memory: *memory
