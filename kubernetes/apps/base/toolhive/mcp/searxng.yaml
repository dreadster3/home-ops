apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPServer
metadata:
  name: searxng
spec:
  image: docker.io/isokoliuk/mcp-searxng:2.1.0@sha256:fab95f98b28726ab9668cbe2d4db045a65b873a55fbc43e704f5d4ec5738144a
  transport: stdio
  env:
    - name: SEARXNG_URL
      value: http://searxng-proxy.searxng.svc.cluster.local:8080
  resources:
    requests:
      cpu: 5m
      memory: &memory 65Mi
    limits:
      memory: *memory
