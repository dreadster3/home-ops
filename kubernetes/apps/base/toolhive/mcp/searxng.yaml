apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPServer
metadata:
  name: searxng
spec:
  image: docker.io/isokoliuk/mcp-searxng:2.5.1@sha256:47c2c520c06b396b89d34bda8a4cd5961e04e4d35c59b931f63d617be45245b5
  transport: stdio
  env:
    - name: SEARXNG_URL
      value: http://searxng.searxng.svc.cluster.local
  resources:
    requests:
      cpu: 5m
      memory: &memory 65Mi
    limits:
      memory: *memory
