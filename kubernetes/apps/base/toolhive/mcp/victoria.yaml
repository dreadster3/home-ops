apiVersion: toolhive.stacklok.dev/v1alpha1
kind: MCPServer
metadata:
  name: victoria-logs
spec:
  image: ghcr.io/victoriametrics/mcp-victorialogs:v1.10.0@sha256:e4b1f38f708a5c99606395ba2de514eab6730ec67440f929c6e3b6f261945d4b
  transport: streamable-http
  mcpPort: 8081
  env:
    - name: MCP_SERVER_MODE
      value: http
    - name: MCP_LISTEN_ADDR
      value: :8081
    - name: MCP_LOG_FORMAT
      value: json
    - name: MCP_LOG_LEVEL
      value: info
    - name: VL_INSTANCE_ENTRYPOINT
      value: http://victoria-logs.monitoring.svc.cluster.local:9428
---
apiVersion: toolhive.stacklok.dev/v1alpha1
kind: MCPServer
metadata:
  name: victoria-metrics
spec:
  image: ghcr.io/victoriametrics/mcp-victoriametrics:v1.22.0@sha256:d304060eaf2e104e6c90e6b68c71a0cac668b7c6aa9fedaa5b35023eaabbaa99
  transport: streamable-http
  mcpPort: 8081
  env:
    - name: MCP_SERVER_MODE
      value: http
    - name: MCP_LISTEN_ADDR
      value: :8081
    - name: MCP_LOG_FORMAT
      value: json
    - name: MCP_LOG_LEVEL
      value: info
    - name: VM_INSTANCE_TYPE
      value: single
    - name: VM_INSTANCE_ENTRYPOINT
      value: http://victoria-metrics.monitoring.svc.cluster.local:8428
