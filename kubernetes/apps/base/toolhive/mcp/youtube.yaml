apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPServer
metadata:
  name: youtube
spec:
  image: ghcr.io/dreadster3/youtube-mcp:v0.5.0@sha256:77ed8ab542246cc790771ccb223237ea6927d9d3e767f64f28edf30329a72d3c
  transport: stdio
  secrets:
    - name: youtube-mcp-secret
      key: YOUTUBE_DATA_API_KEY
      targetEnvName: YOUTUBE_API_KEY
  resources:
    requests:
      cpu: 5m
      memory: &memory 50Mi
    limits:
      memory: *memory
  podTemplateSpec:
    spec:
      volumes:
        - name: cache
          emptyDir: {}
      containers:
        - name: mcp
          volumeMounts:
            - name: cache
              mountPath: /data
          resources:
            requests:
              cpu: 5m
              memory: &memory 500Mi
            limits:
              memory: *memory
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: youtube
spec:
  secretStoreRef:
    name: infisical
    kind: ClusterSecretStore
  target:
    name: youtube-mcp-secret
    creationPolicy: Owner
  data:
    - secretKey: YOUTUBE_DATA_API_KEY
      remoteRef:
        key: /toolhive/YOUTUBE_DATA_API_KEY
