apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPServer
metadata:
  name: youtube
spec:
  image: ghcr.io/dreadster3/youtube-mcp:v0.4.0@sha256:28ff0876ecf5de4fec63c912c6dcb0f8c455fd38df83faba69107bd4247de8cd
  transport: stdio
  secrets:
    - name: youtube-mcp-secret
      key: YOUTUBE_DATA_API_KEY
      targetEnvName: YOUTUBE_API_KEY
  resources:
    requests:
      cpu: 5m
      memory: &memory 50Mi
    limits:
      memory: *memory
  podTemplateSpec:
    spec:
      volumes:
        - name: cache
          emptyDir: {}
      containers:
        - name: mcp
          volumeMounts:
            - name: cache
              mountPath: /data
          resources:
            requests:
              cpu: 5m
              memory: &memory 150Mi
            limits:
              memory: *memory
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: youtube
spec:
  secretStoreRef:
    name: infisical
    kind: ClusterSecretStore
  target:
    name: youtube-mcp-secret
    creationPolicy: Owner
  data:
    - secretKey: YOUTUBE_DATA_API_KEY
      remoteRef:
        key: /toolhive/YOUTUBE_DATA_API_KEY
