apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPServer
metadata:
  name: playwright
spec:
  image: mcr.microsoft.com/playwright/mcp:v0.0.79@sha256:18c0a9c934004fe9580cc79f1e8e6e6cde7c667348b215335e8a23fd3e509804
  transport: stdio
  env:
    - name: PLAYWRIGHT_MCP_ISOLATED
      value: "true"
  podTemplateSpec:
    spec:
      volumes:
        - name: home
          emptyDir: {}
        - name: tmp
          emptyDir: {}
      containers:
        - name: mcp
          volumeMounts:
            - name: home
              mountPath: /home/node
            - name: tmp
              mountPath: /tmp
