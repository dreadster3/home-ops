apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPServer
metadata:
  name: playwright
spec:
  image: mcr.microsoft.com/playwright/mcp:v0.0.81@sha256:96999343986104be5a3755b2d873b039e2089f74bc4f449facd2608e789a9911
  transport: stdio
  env:
    - name: PLAYWRIGHT_MCP_ISOLATED
      value: "true"
  podTemplateSpec:
    spec:
      volumes:
        - name: home
          emptyDir: {}
        - name: tmp
          emptyDir: {}
      containers:
        - name: mcp
          volumeMounts:
            - name: home
              mountPath: /home/node
            - name: tmp
              mountPath: /tmp
