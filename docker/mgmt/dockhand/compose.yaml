services:
  socket-proxy:
    image: lscr.io/linuxserver/socket-proxy:3.2.18@sha256:8d4ba67fd377b6ce9252bdb47ff1de7f28f17c52b0fb801e797bbafcc1bfe5bc
    container_name: dockhand-socket-proxy
    environment:
      # Default
      - EVENTS=1
      - PING=1
      - VERSION=1
      # Required for Dockhand core functionality
      - POST=1
      - CONTAINERS=1
      - IMAGES=1
      - NETWORKS=1
      - VOLUMES=1
      - DELETE=1
      # Required for dashboard host info and disk usage
      - INFO=1
      - SYSTEM=1
      # Required for vulnerability scanning
      - ALLOW_START=1
      - ALLOW_STOP=1
      - ALLOW_RESTARTS=1
      # Optional: enable for terminal access
      - EXEC=1
      - DISABLE_IPV6=1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - default
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /run
  dockhand:
    container_name: dockhand
    image: docker.io/fnsys/dockhand:v1.0.27@sha256:8c2f62e215d257e3b17fd0d458d4fcd134f67c4ee495831b818004677ad57e3b
    restart: unless-stopped
    depends_on:
      - socket-proxy
    volumes:
      - data:/app/data
      - doco_data:/data:ro
    networks:
      - proxy
      - default
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.dockhand.rule=Host(`dockhand.${INTERNAL_DOMAIN}`)"
      - "traefik.http.routers.dockhand.entrypoints=websecure"
      - "traefik.http.routers.dockhand.tls.certresolver=letsencrypt"
      - "traefik.http.services.dockhand.loadbalancer.server.port=3000"
      - "traefik.http.services.dockhand.loadbalancer.server.scheme=http"

volumes:
  data:
  doco_data:
    external: true

networks:
  default:
    driver: bridge
  proxy:
    external: true
