services:
  socket-proxy:
    image: lscr.io/linuxserver/socket-proxy:3.4.3@sha256:165670d41ce04c44c271075e4be87f6de17633478eae817ed967d71755de650b
    container_name: dockhand-socket-proxy
    environment:
      # Default
      - EVENTS=1
      - PING=1
      - VERSION=1
      # Required for Dockhand core functionality
      - POST=1
      - CONTAINERS=1
      - IMAGES=1
      - NETWORKS=1
      - VOLUMES=1
      - DELETE=1
      # Required for dashboard host info and disk usage
      - INFO=1
      - SYSTEM=1
      # Required for vulnerability scanning
      - ALLOW_START=1
      - ALLOW_STOP=1
      - ALLOW_RESTARTS=1
      # Optional: enable for terminal access
      - EXEC=1
      - DISABLE_IPV6=1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - default
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /run
  dockhand:
    container_name: dockhand
    image: docker.io/fnsys/dockhand:v1.0.43@sha256:d6e0c277fd9e3ddd0039256bf1e74510f3352cd3237bd9c7c4b30eeebb7af7ba
    restart: unless-stopped
    depends_on:
      - socket-proxy
    volumes:
      - data:/app/data
      - doco_data:/data:ro
    networks:
      - proxy
      - default
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.dockhand.rule=Host(`dockhand.${INTERNAL_DOMAIN}`)"
      - "traefik.http.routers.dockhand.entrypoints=websecure"
      - "traefik.http.routers.dockhand.tls.certresolver=letsencrypt"
      - "traefik.http.services.dockhand.loadbalancer.server.port=3000"
      - "traefik.http.services.dockhand.loadbalancer.server.scheme=http"

volumes:
  data:
  doco_data:
    external: true

networks:
  default:
    driver: bridge
  proxy:
    external: true
