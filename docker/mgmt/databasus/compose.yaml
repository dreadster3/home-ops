services:
  databasus:
    container_name: databasus
    image: databasus/databasus:v3.62.0@sha256:04f63c57af364c82219a03a45be76699014117ba715ff1f17cf1e3c6fc6e5419
    volumes:
      - /opt/docker/databasus/data:/databasus-data
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.databasus.rule=Host(`databasus.${INTERNAL_DOMAIN}`)"
      - "traefik.http.routers.databasus.entrypoints=websecure"
      - "traefik.http.routers.databasus.tls.certresolver=letsencrypt"
      - "traefik.http.services.databasus.loadbalancer.server.port=4005"
    networks:
      - proxy
      - database
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - SETUID
      - SETGID
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER

networks:
  database:
    name: database
    driver: bridge
  proxy:
    external: true
