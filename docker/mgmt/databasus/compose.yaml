services:
  databasus:
    container_name: databasus
    image: databasus/databasus:v3.57.0@sha256:3c814cdb4de830232c0fa8b3e0dfbe3ae39f685e7e8bd3effdf3b989c9e5d74d
    volumes:
      - /opt/docker/databasus/data:/databasus-data
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.databasus.rule=Host(`databasus.${INTERNAL_DOMAIN}`)"
      - "traefik.http.routers.databasus.entrypoints=websecure"
      - "traefik.http.routers.databasus.tls.certresolver=letsencrypt"
      - "traefik.http.services.databasus.loadbalancer.server.port=4005"
    networks:
      - proxy
      - database
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - SETUID
      - SETGID
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER

networks:
  database:
    name: database
    driver: bridge
  proxy:
    external: true
