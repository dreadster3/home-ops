services:
  databasus:
    container_name: databasus
    image: databasus/databasus:v3.70.0@sha256:62e8b0cf649fd30127690831b85387075dfc5b42fc5898f546bf01c3fda440d8
    environment:
      IS_DISABLE_ANONYMOUS_TELEMETRY: true
    volumes:
      - /opt/docker/databasus/data:/databasus-data
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.databasus.rule=Host(`databasus.${INTERNAL_DOMAIN}`)"
      - "traefik.http.routers.databasus.entrypoints=websecure"
      - "traefik.http.routers.databasus.tls.certresolver=letsencrypt"
      - "traefik.http.services.databasus.loadbalancer.server.port=4005"
    networks:
      - default
      - proxy
      - database
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - SETUID
      - SETGID
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
  databasus-agent:
    container_name: databasus-agent
    image: databasus/databasus:v3.70.0@sha256:62e8b0cf649fd30127690831b85387075dfc5b42fc5898f546bf01c3fda440d8
    entrypoint:
      - /app/agent-binaries/databasus-verification-agent-linux-amd64
    command:
      - run
      - --databasus-host=https://databasus.${INTERNAL_DOMAIN}
      - --agent-id=${AGENT_ID}
      - --token=${AGENT_TOKEN}
      - --max-cpu=2
      - --max-ram-mb=1024
      - --max-disk-gb=10
      - --max-concurrent-jobs=2
    environment:
      IS_DISABLE_ANONYMOUS_TELEMETRY: true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped
    network_mode: host
    deploy:
      resources:
        reservations:
          cpus: 1
          memory: &memory 1G
        limits:
          cpus: 2
          memory: *memory
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

networks:
  default:
  database:
    name: database
    driver: bridge
  proxy:
    external: true
