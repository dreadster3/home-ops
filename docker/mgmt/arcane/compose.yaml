services:
  socket-proxy:
    image: lscr.io/linuxserver/socket-proxy:3.4.4@sha256:cba12c42b1df30a6446856028f5ab726e9d8921f1ea74be509216c5e41357d42
    container_name: arcane-socket-proxy
    environment:
      - EVENTS=1
      - PING=1
      - VERSION=1
      # Security critical
      - AUTH=0
      - SECRETS=0
      - POST=1
      # Not always needed
      - BUILD=0
      - COMMIT=0
      - CONFIGS=0
      - CONTAINERS=1
      - DISTRIBUTION=0
      - EXEC=1
      - IMAGES=1
      - INFO=1
      - NETWORKS=1
      - NODES=0
      - PLUGINS=0
      - SERVICES=0
      - SESSION=0
      - SWARM=0
      - SYSTEM=0
      - TASKS=0
      - VOLUMES=1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - default
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /run

  arcane:
    image: ghcr.io/getarcaneapp/manager:v2.10.1@sha256:5695ac9b3ffb4dc8ac33030e92c87f2fa64f431b03d63605316af0cb713156de
    container_name: arcane
    volumes:
      - data:/app/data
      - ./role-mappings.json:/app/role-mappings.json
    environment:
      TZ: ${TIMEZONE}
      LOG_LEVEL: INFO
      LOG_JSON: true
      PUID: 1000
      PGID: 1000
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      JWT_SECRET: ${JWT_SECRET}
      APP_URL: https://arcane.${INTERNAL_DOMAIN}
      UPDATE_CHECK_DISABLED: true
      DOCKER_HOST: tcp://socket-proxy:2375
      DATABASE_URL: postgres://${DB_USER}:${DB_PASSWORD}@db:5432/arcane
      OIDC_ENABLED: true
      OIDC_AUTO_REDIRECT_TO_PROVIDER: true
      OIDC_PROVIDER_NAME: authentik
      OIDC_ISSUER_URL: https://authentik.${INTERNAL_DOMAIN}/application/o/arcane/
      OIDC_SCOPES: openid email profile
      OIDC_SKIP_TLS_VERIFY: false
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET}
      OIDC_MERGE_ACCOUNTS: true
      OIDC_GROUPS_CLAIM: groups
      OIDC_ROLE_MAPPINGS_FILE: /app/role-mappings.json
    networks:
      - default
      - proxy
    depends_on:
      socket-proxy:
        condition: service_started
      db:
        condition: service_healthy
        restart: true
    # healthcheck:
    #   test:
    #     [
    #       "CMD-SHELL",
    #       "curl -fsS http://localhost:3552/api/health >/dev/null || exit 1",
    #     ]
    #   interval: 10s
    #   timeout: 3s
    #   retries: 5
    #   start_period: 15s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.arcane.rule=Host(`arcane.${INTERNAL_DOMAIN}`)"
      - "traefik.http.routers.arcane.entrypoints=websecure"
      - "traefik.http.routers.arcane.tls.certresolver=letsencrypt"
      - "traefik.http.services.arcane.loadbalancer.server.port=3552"
      - "traefik.http.services.arcane.loadbalancer.server.scheme=http"
    restart: unless-stopped
    user: "1000:1000"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp

  db:
    container_name: arcane-db
    image: postgres:18.6-alpine@sha256:6a0f91c16a4e83a8faeb3d84827c85909d5ad8f7faa703fe32d2179b46a338c4
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: arcane
    volumes:
      - db_data:/var/lib/postgresql
    networks:
      - default
      - database
    healthcheck:
      test: "pg_isready --username=${DB_USER} && psql --username=${DB_USER} --list"
      interval: 5s
      timeout: 10s
      retries: 10
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - DAC_READ_SEARCH

networks:
  default:
  database:
    external: true
  proxy:
    external: true

volumes:
  data:
    driver: local
  db_data:
    driver: local
