services:
  socket-proxy:
    image: lscr.io/linuxserver/socket-proxy:3.4.8@sha256:6beb1743581ec3b2ed1a2bafd617e8c7a1d7ae2fe835293e333327618fc2b925
    container_name: arcane-socket-proxy
    environment:
      - EVENTS=1
      - PING=1
      - VERSION=1
      # Security critical
      - AUTH=0
      - SECRETS=0
      - POST=1
      # Not always needed
      - BUILD=0
      - COMMIT=0
      - CONFIGS=0
      - CONTAINERS=1
      - DISTRIBUTION=0
      - EXEC=1
      - IMAGES=1
      - INFO=1
      - NETWORKS=1
      - NODES=0
      - PLUGINS=0
      - SERVICES=0
      - SESSION=0
      - SWARM=0
      - SYSTEM=0
      - TASKS=0
      - VOLUMES=1
      - ALLOW_LOGS=1
      - ALLOW_TOP=1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - default
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /run

  arcane:
    image: ghcr.io/getarcaneapp/manager:v3.1.0@sha256:4151e7bc42ddec87c2ce5534d7611297465e2b05e6472f12382073eeca878c8e
    container_name: arcane
    volumes:
      - data:/app/data
      - ./role-mappings.json:/app/role-mappings.json
    environment:
      TZ: ${TIMEZONE}
      PUID: 1000
      PGID: 1000
      ARCANE_LOG_LEVEL: INFO
      ARCANE_LOG_JSON: true
      ARCANE_APP_URL: https://arcane.${INTERNAL_DOMAIN}
      ARCANE_UPDATE_CHECK_DISABLED: true
      ARCANE_ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      ARCANE_DOCKER_HOST: tcp://socket-proxy:2375
      ARCANE_DATABASE_URL: postgres://${DB_USER}:${DB_PASSWORD}@db:5432/arcane
      ARCANE_OIDC_ENABLED: true
      ARCANE_OIDC_AUTO_REDIRECT_TO_PROVIDER: true
      ARCANE_OIDC_PROVIDER_NAME: authentik
      ARCANE_OIDC_ISSUER_URL: https://authentik.${INTERNAL_DOMAIN}/application/o/arcane/
      ARCANE_OIDC_SCOPES: openid email profile
      ARCANE_OIDC_SKIP_TLS_VERIFY: false
      ARCANE_OIDC_CLIENT_ID: ${OIDC_CLIENT_ID}
      ARCANE_OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET}
      ARCANE_OIDC_MERGE_ACCOUNTS: true
      ARCANE_OIDC_GROUPS_CLAIM: groups
      ARCANE_OIDC_ROLE_MAPPINGS_FILE: /app/role-mappings.json
    networks:
      - default
      - proxy
    depends_on:
      socket-proxy:
        condition: service_started
      db:
        condition: service_healthy
        restart: true
    # healthcheck:
    #   test:
    #     [
    #       "CMD-SHELL",
    #       "curl -fsS http://localhost:3552/api/health >/dev/null || exit 1",
    #     ]
    #   interval: 10s
    #   timeout: 3s
    #   retries: 5
    #   start_period: 15s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.arcane.rule=Host(`arcane.${INTERNAL_DOMAIN}`)"
      - "traefik.http.routers.arcane.entrypoints=websecure"
      - "traefik.http.routers.arcane.tls.certresolver=letsencrypt"
      - "traefik.http.services.arcane.loadbalancer.server.port=3552"
      - "traefik.http.services.arcane.loadbalancer.server.scheme=http"
    restart: unless-stopped
    user: "1000:1000"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp

  db:
    container_name: arcane-db
    image: postgres:18.7-alpine@sha256:335e19cef981ddd39e0c1509a3edaa8d708c0ea1caa91ba24c175e46f1b245d0
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: arcane
    volumes:
      - db_data:/var/lib/postgresql
    networks:
      - default
      - database
    healthcheck:
      test: "pg_isready --username=${DB_USER} && psql --username=${DB_USER} --list"
      interval: 5s
      timeout: 10s
      retries: 10
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - DAC_READ_SEARCH

networks:
  default:
  database:
    external: true
  proxy:
    external: true

volumes:
  data:
    driver: local
  db_data:
    driver: local
