version: "3"

services:
  backend:
    image: infisical/infisical:v1.0.0@sha256:38ab670020d065f0f7079d5954ee2ca4060fb1d4989da771089b7d92a65711f6
    container_name: infisical
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      SITE_URL: https://infisical.${INTERNAL_DOMAIN}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      AUTH_SECRET: ${AUTH_SECRET}
      DB_CONNECTION_URI: postgres://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      NODE_ENV: production
      TELEMETRY_ENABLED: false
      SMTP_HOST: smtp.gmail.com
      SMTP_PORT: 587
      SMTP_FROM_ADDRESS: no-reply@${EXTERNAL_DOMAIN}
      SMTP_FROM_NAME: Infisical
      SMTP_USERNAME: ${SMTP_USERNAME}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      ALLOW_INTERNAL_IP_CONNECTIONS: true
    networks:
      - default
      - proxy
    labels:
      - traefik.enable=true
      - traefik.http.routers.infisical.rule=Host(`infisical.${INTERNAL_DOMAIN}`)
      - traefik.http.routers.infisical.entrypoints=websecure
      - traefik.http.routers.infisical.tls.certresolver=letsencrypt
      - traefik.http.services.infisical.loadbalancer.server.port=8080
    deploy:
      resources:
        reservations:
          cpus: "0.25"
          memory: &memory 768M
        limits:
          memory: *memory
    user: "non-root-user"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp

  redis:
    image: redis:8.6.2-alpine@sha256:1f073813b641755b70b0200da64131bbeeb4ec5b633ca67772229b49820caafa
    container_name: infisical-redis
    restart: always
    command:
      - redis-server
      - --requirepass ${REDIS_PASSWORD}
      - --appendonly "yes"
      - --maxmemory 256mb
      - --maxmemory-policy noeviction
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    networks:
      - default
    volumes:
      - redis_data:/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    user: "999:999"
    mem_limit: 300m

  db:
    container_name: infisical-db
    image: postgres:18.4-alpine@sha256:ccfb3a1332f1ade601b73005eda74192167c5ca09c3bd7589c46f61f0490f470
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: infisical
    volumes:
      - db_data:/var/lib/postgresql
    networks:
      - default
      - database
    healthcheck:
      test: "pg_isready --username=${DB_USER} && psql --username=${DB_USER} --list"
      interval: 5s
      timeout: 10s
      retries: 10
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - DAC_READ_SEARCH

volumes:
  db_data:
    driver: local
  redis_data:
    driver: local

networks:
  default:
    internal: true
  proxy:
    external: true
  database:
    external: true
