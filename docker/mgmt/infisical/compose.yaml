version: "3"

services:
  backend:
    image: infisical/infisical:v0.162.21@sha256:59520dc77b50eb17eb3edea8b6139bc04132db8b606f9980e03ef40ce51cbf05
    container_name: infisical
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      SITE_URL: https://infisical.${INTERNAL_DOMAIN}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      AUTH_SECRET: ${AUTH_SECRET}
      DB_CONNECTION_URI: postgres://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      NODE_ENV: production
      TELEMETRY_ENABLED: false
      SMTP_HOST: smtp.gmail.com
      SMTP_PORT: 587
      SMTP_FROM_ADDRESS: no-reply@${EXTERNAL_DOMAIN}
      SMTP_FROM_NAME: Infisical
      SMTP_USERNAME: ${SMTP_USERNAME}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      ALLOW_INTERNAL_IP_CONNECTIONS: true
    networks:
      - default
      - proxy
    labels:
      - traefik.enable=true
      - traefik.http.routers.infisical.rule=Host(`infisical.${INTERNAL_DOMAIN}`)
      - traefik.http.routers.infisical.entrypoints=websecure
      - traefik.http.routers.infisical.tls.certresolver=letsencrypt
      - traefik.http.services.infisical.loadbalancer.server.port=8080
    deploy:
      resources:
        reservations:
          cpus: "0.25"
          memory: &memory 1.5G
        limits:
          memory: *memory
    user: "1001:1001"

  redis:
    image: redis:8.10.0-alpine@sha256:978f0e01593e65eed801f2402944efcd936d43b5027e4908a7897baf88ed6241
    container_name: infisical-redis
    restart: always
    command:
      - redis-server
      - --requirepass ${REDIS_PASSWORD}
      - --appendonly "yes"
      - --maxmemory 256mb
      - --maxmemory-policy noeviction
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    networks:
      - default
    volumes:
      - redis_data:/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    user: "999:999"
    mem_limit: 300m

  db:
    container_name: infisical-db
    image: postgres:18.6-alpine@sha256:6a0f91c16a4e83a8faeb3d84827c85909d5ad8f7faa703fe32d2179b46a338c4
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: infisical
    volumes:
      - db_data:/var/lib/postgresql
    networks:
      - default
      - database
    healthcheck:
      test: "pg_isready --username=${DB_USER} && psql --username=${DB_USER} --list"
      interval: 5s
      timeout: 10s
      retries: 10
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - DAC_READ_SEARCH

volumes:
  db_data:
    driver: local
  redis_data:
    driver: local

networks:
  default:
    internal: true
  proxy:
    external: true
  database:
    external: true
