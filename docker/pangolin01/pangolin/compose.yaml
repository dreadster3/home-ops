services:
  pangolin:
    image: fosrl/pangolin:1.26.0@sha256:a8285fd7c4ba400ef011dd62d4116e69298b51df242cdc4f26ba9f2b5d57ff6c
    container_name: pangolin
    restart: unless-stopped
    env_file: pangolin.env
    volumes:
      - ./config/pangolin/config.yml:/app/config/config.yml:ro
      - /opt/docker/pangolin:/app/config
      - ./config/geolite:/app/geolite
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/api/v1/"]
      interval: "10s"
      timeout: "10s"
      retries: 15

  gerbil:
    image: fosrl/gerbil:1.6.0@sha256:420f5210b6d1a6d3035f15c3938b5289fee5aeff51ffdcb9b217838338908885
    container_name: gerbil
    restart: unless-stopped
    depends_on:
      pangolin:
        condition: service_healthy
    command:
      - --reachableAt=http://gerbil:3003
      - --generateAndSaveKeyTo=/var/config/key
      - --remoteConfig=http://pangolin:3001/api/v1/
    volumes:
      - /opt/docker/pangolin:/var/config
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    ports:
      - 51820:51820/udp
      - 21820:21820/udp
      - 443:443
      - 80:80
      - 25565:25565

  traefik:
    image: docker.io/traefik:v3.7.19@sha256:aa942a00bce033c909bf1f7e861d93761be4b31a035f10d2410d33e38a8f41cf
    container_name: traefik
    restart: unless-stopped
    network_mode: service:gerbil
    env_file:
      - traefik.env
    environment:
      TZ: Europe/Lisbon
    depends_on:
      pangolin:
        condition: service_healthy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - letsencrypt:/letsencrypt
      - /var/log/docker/traefik:/var/log/traefik
      - ./config/traefik:/etc/traefik:ro
    secrets:
      - crowdsec_lapi_key
    logging:
      driver: "json-file"
      options:
        max-size: "500m"
        max-file: "2"
    cap_drop:
      - ALL
    cap_add:
      - CAP_NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true

  crowdsec:
    image: crowdsecurity/crowdsec:v1.8.2@sha256:65b74942f7e7ed5c60fde4ac15fc4ba715904c398c8b16dd451f4907d90347d4
    container_name: crowdsec
    restart: unless-stopped
    environment:
      COLLECTIONS: crowdsecurity/traefik crowdsecurity/appsec-virtual-patching crowdsecurity/appsec-generic-rules crowdsecurity/linux crowdsecurity/iptables
    ports:
      - 8080:8080
    volumes:
      - ./config/crowdsec/postoverflows/s01-whitelist/01-home-whitelist.yaml:/etc/crowdsec/postoverflows/s01-whitelist/01-home-whitelist.yaml:ro
      - ./config/crowdsec/acquis.d:/etc/crowdsec/acquis.d:ro
      - /opt/docker/crowdsec:/etc/crowdsec
      - /opt/docker/crowdsec/data:/var/lib/crowdsec/data
      - /var/log/docker/traefik:/var/log/traefik:ro
      - /var/log/journal:/var/log/host/journal:ro
      - /var/log/auth.log:/var/log/host/auth.log:ro
      - /var/log/syslog:/var/log/host/syslog:ro

volumes:
  letsencrypt:
    driver: local

networks:
  default:
    driver: bridge
    name: pangolin

secrets:
  crowdsec_lapi_key:
    file: ./secrets/crowdsec_lapi_key
