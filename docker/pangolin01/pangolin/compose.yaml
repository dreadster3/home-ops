services:
  pangolin:
    image: fosrl/pangolin:1.22.2@sha256:83a55f933b4d970da85333ba9715a36550972398939ba1b70fe0381434259b96
    container_name: pangolin
    restart: unless-stopped
    env_file: pangolin.env
    volumes:
      - ./config/pangolin/config.yml:/app/config/config.yml:ro
      - /opt/docker/pangolin:/app/config
      - ./config/geolite:/app/geolite
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/api/v1/"]
      interval: "10s"
      timeout: "10s"
      retries: 15

  gerbil:
    image: fosrl/gerbil:1.5.1@sha256:e8010d0354d7dc3b8cb1c80d1ae9d961c02e8b1fccc353ef1dfc37631722f7f6
    container_name: gerbil
    restart: unless-stopped
    depends_on:
      pangolin:
        condition: service_healthy
    command:
      - --reachableAt=http://gerbil:3003
      - --generateAndSaveKeyTo=/var/config/key
      - --remoteConfig=http://pangolin:3001/api/v1/
    volumes:
      - /opt/docker/pangolin:/var/config
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    ports:
      - 51820:51820/udp
      - 21820:21820/udp
      - 443:443
      - 80:80
      - 25565:25565

  traefik:
    image: docker.io/traefik:v3.7.12@sha256:9c2a54d87f76f5c2f5f2682c68394af92fb12c0a2686798d6462a3f84bd78eaf
    container_name: traefik
    restart: unless-stopped
    network_mode: service:gerbil
    env_file:
      - traefik.env
    environment:
      TZ: Europe/Lisbon
    depends_on:
      pangolin:
        condition: service_healthy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - letsencrypt:/letsencrypt
      - /var/log/docker/traefik:/var/log/traefik
      - ./config/traefik:/etc/traefik:ro
    secrets:
      - crowdsec_lapi_key
    logging:
      driver: "json-file"
      options:
        max-size: "500m"
        max-file: "2"
    cap_drop:
      - ALL
    cap_add:
      - CAP_NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true

  crowdsec:
    image: crowdsecurity/crowdsec:v1.8.0@sha256:99eb4df235527e978595ef5ebb30182831686dc875521de67ef39b7659a86897
    container_name: crowdsec
    restart: unless-stopped
    environment:
      COLLECTIONS: crowdsecurity/traefik crowdsecurity/appsec-virtual-patching crowdsecurity/appsec-generic-rules crowdsecurity/linux crowdsecurity/iptables
    ports:
      - 8080:8080
    volumes:
      - ./config/crowdsec/postoverflows/s01-whitelist/01-home-whitelist.yaml:/etc/crowdsec/postoverflows/s01-whitelist/01-home-whitelist.yaml:ro
      - ./config/crowdsec/acquis.d:/etc/crowdsec/acquis.d:ro
      - /opt/docker/crowdsec:/etc/crowdsec
      - /opt/docker/crowdsec/data:/var/lib/crowdsec/data
      - /var/log/docker/traefik:/var/log/traefik:ro
      - /var/log/journal:/var/log/host/journal:ro
      - /var/log/auth.log:/var/log/host/auth.log:ro
      - /var/log/syslog:/var/log/host/syslog:ro

volumes:
  letsencrypt:
    driver: local

networks:
  default:
    driver: bridge
    name: pangolin

secrets:
  crowdsec_lapi_key:
    file: ./secrets/crowdsec_lapi_key
