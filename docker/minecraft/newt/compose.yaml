services:
  newt:
    image: fosrl/newt:1.18.1@sha256:7fed6605e0a104a337e1cb903bbb1225f80c7f6e5e56ff1eb1d70c57740d8e0f
    container_name: minecraft-newt
    restart: unless-stopped
    env_file:
      - newt.env
    networks:
      - edge
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true

networks:
  edge:
    name: edge
