services:
  newt:
    image: fosrl/newt:1.20.1@sha256:03561e3f3d10b94ee7839318ae46e5acf8b4431550ea1d0e15666ab60caa2e43
    container_name: minecraft-newt
    restart: unless-stopped
    env_file:
      - newt.env
    networks:
      - edge
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true

networks:
  edge:
    name: edge
