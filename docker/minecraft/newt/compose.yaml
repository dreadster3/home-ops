services:
  newt:
    image: fosrl/newt:1.19.1@sha256:c89f01cb387bf6c598959036cbf56306b068a43e8784345bee7398b7af8ee2e1
    container_name: minecraft-newt
    restart: unless-stopped
    env_file:
      - newt.env
    networks:
      - edge
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true

networks:
  edge:
    name: edge
