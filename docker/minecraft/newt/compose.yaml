services:
  newt:
    image: fosrl/newt:1.19.0@sha256:0189c8287058b800cca825590e4c39946b3815344ca48678dd0b96616d639319
    container_name: minecraft-newt
    restart: unless-stopped
    env_file:
      - newt.env
    networks:
      - edge
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true

networks:
  edge:
    name: edge
