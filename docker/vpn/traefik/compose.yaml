configs:
  traefik-dynamic.yaml:
    content: |
      http:
        routers:
          wg-easy:
            rule: Host(`vpn.${INTERNAL_DOMAIN}`)
            entrypoints:
              - websecure
            service: wg-easy

        services:
          wg-easy:
            loadBalancer:
              servers:
                - url: http://${VM_IP}:51821
  traefik.yaml:
    content: |
      api:
        dashboard: true
        insecure: true

      providers:
        docker:
          exposedByDefault: false
          network: proxy
        file:
          filename: /etc/traefik/traefik-dynamic.yaml

      entryPoints:
        web:
          address: ":80"
          http:
            redirections:
              entrypoint:
                to: websecure
                scheme: https
        websecure:
          address: ":443"
          http:
            tls:
              certResolver: "letsencrypt"

      certificatesResolvers:
        letsencrypt:
          acme:
            email: "afonso.antunes@live.com.pt"
            storage: "/letsencrypt/acme.json"
            caServer: "https://acme-v02.api.letsencrypt.org/directory"
            dnsChallenge:
              provider: cloudflare  # or your DNS provider
              resolvers:
                - "1.1.1.1:53"
                - "8.8.8.8:53"

      log:
        filePath: /var/log/traefik/traefik.log
        format: json
        level: DEBUG

      accessLog:
        filePath: /var/log/traefik/access.log
        format: json

      serversTransport:
        insecureSkipVerify: true

services:
  traefik:
    container_name: traefik
    image: docker.io/traefik:v3.7.8@sha256:4299bbed850421258fc5448c2e0e6ad350981d4d335a68de11b92448aedbefe5
    env_file:
      - traefik.env
    ports:
      - 80:80
      - 443:443
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - letsencrypt:/letsencrypt
      - /var/log/docker/traefik:/var/log/traefik
    configs:
      - source: traefik.yaml
        target: /etc/traefik/traefik.yaml
      - source: traefik-dynamic.yaml
        target: /etc/traefik/traefik-dynamic.yaml
    logging:
      driver: "json-file"
      options:
        max-size: "500m"
        max-file: "2"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.dashboard.rule=Host(`vpn.proxy.${INTERNAL_DOMAIN}`)"
      - "traefik.http.routers.dashboard.entrypoints=websecure"
      - "traefik.http.routers.dashboard.tls.certresolver=letsencrypt"
      - "traefik.http.routers.dashboard.service=api@internal"
    cap_drop:
      - ALL
    cap_add:
      - CAP_NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    networks:
      proxy:
        ipv4_address: 172.22.1.254
      netbird:
        aliases:
          - traefik.local

volumes:
  letsencrypt:
    driver: local

networks:
  proxy:
    name: proxy
    driver: bridge
    ipam:
      config:
        - subnet: 172.22.1.0/24
          gateway: 172.22.1.1
  netbird:
    external: true
