services:
  netbird:
    image: ghcr.io/netbirdio/netbird:0.76.3@sha256:9f0ad6ae354359926adbd40735fc2cb0be75c786759492abb160a1170544970b
    restart: unless-stopped
    container_name: netbird
    hostname: vpn
    env_file: netbird.env
    environment:
      NB_MANAGEMENT_URL: https://netbird.${EXTERNAL_DOMAIN}
    volumes:
      - /var/log/docker/netbird:/var/log/netbird
    cap_add:
      - NET_ADMIN
      - NET_RAW
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - netbird

networks:
  netbird:
    name: netbird
    driver: bridge
