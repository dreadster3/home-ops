services:
  netbird:
    image: ghcr.io/netbirdio/netbird:0.77.0@sha256:fcf1d37d1a9b8c65e2968193d8762896750cfb4e81b04862b1b464f4eede3b9e
    restart: unless-stopped
    container_name: netbird
    hostname: vpn
    env_file: netbird.env
    environment:
      NB_MANAGEMENT_URL: https://netbird.${EXTERNAL_DOMAIN}
    volumes:
      - /var/log/docker/netbird:/var/log/netbird
    cap_add:
      - NET_ADMIN
      - NET_RAW
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - netbird

networks:
  netbird:
    name: netbird
    driver: bridge
