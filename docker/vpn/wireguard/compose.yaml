services:
  wg-easy:
    image: ghcr.io/wg-easy/wg-easy:15.4.0@sha256:0e7bc9d34e86ddcaa92bc700d4d7dc9b33291dbc07ac8d13382f7c2095f949ec
    restart: unless-stopped
    container_name: wg-easy
    network_mode: "host"
    env_file:
      - ./wireguard.env
    environment:
      DISABLE_IPV6: true
      OAUTH_PROVIDERS: oidc
      OAUTH_AUTO_REGISTER: true
      OAUTH_AUTO_LAUNCH: true
      DISABLE_PASSWORD_AUTH: true
    volumes:
      - /opt/docker/wireguard:/etc/wireguard
      - /lib/modules:/lib/modules:ro
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
      - NET_RAW
      - SYS_MODULE
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
  litestream:
    image: litestream/litestream:0.5.17@sha256:4b02b9859a6b6b4087d8b8944e15f7e984bd7957cba322bbeee38b0e27b9656a
    restart: unless-stopped
    container_name: wg-easy-litestream
    command: replicate
    env_file:
      - ./litestream.env
    volumes:
      - /opt/docker/wireguard:/data
      - ./config/litestream.yml:/etc/litestream.yml:ro
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
