services:
  wg-easy:
    image: ghcr.io/wg-easy/wg-easy:15.4.0@sha256:0e7bc9d34e86ddcaa92bc700d4d7dc9b33291dbc07ac8d13382f7c2095f949ec
    restart: unless-stopped
    container_name: wg-easy
    network_mode: "host"
    environment:
      DISABLE_IPV6: true
    volumes:
      - /opt/docker/wireguard:/etc/wireguard
      - /lib/modules:/lib/modules:ro
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
      - NET_RAW
      - SYS_MODULE
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
  litestream:
    image: litestream/litestream:0.5.16@sha256:f085f8bce71a5ad4ce8e28b28ea522de1d9e0d7dd0af3ea5c1bd626d0f341954
    restart: unless-stopped
    container_name: wg-easy-litestream
    command: replicate
    env_file:
      - ./litestream.env
    volumes:
      - /opt/docker/wireguard:/data
      - ./litestream.yml:/etc/litestream.yml:ro
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
